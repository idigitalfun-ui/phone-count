name: Nightly inventory backup
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: inventory-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Open backup branch
        run: |
          git fetch origin refs/heads/inventory-backups:refs/remotes/origin/inventory-backups
          git worktree add backup-state origin/inventory-backups
      - name: Save changed inventory once per UTC night and keep three backups
        env:
          INVENTORY_STORAGE: records
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/nightly-backup.mjs backup-state/backups/phone-count
      - name: Commit recovery snapshot
        working-directory: backup-state
        run: |
          git config user.name 'Phone Count Backup'
          git config user.email 'phone-count-backup@users.noreply.github.com'
          git add backups/phone-count
          if git diff --cached --quiet; then
            echo 'No backup changes to commit.'
            exit 0
          fi
          git commit -m "Back up changed Firebase inventory"
          git push origin HEAD:inventory-backups
