  };

/* ---------- store ---------- */
const Store = {
  data:null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      this.data = raw ? JSON.parse(raw) : seedData();
    }catch(e){ this.data = seedData(); }
    this.migrate();
  },
  migrate(){
    const d = this.data;
    if(!d) { this.data = seedData(); return; }
    if(!Array.isArray(d.shops)) d.shops = seedData().shops;
    if(!Array.isArray(d.categories)) d.categories = seedData().categories;
    if(!Array.isArray(d.items)) d.items = [];
    if(!Array.isArray(d.movements)) d.movements = [];
    else d.movements = d.movements.filter(m => {
      if(!m || !m.type) return false;
      if(!['stock-in','transfer-in','transfer-out','sold','faulty','deposit'].includes(m.type)) return false;
      const note = (m.note || '').toLowerCase();
      const from = (m.fromLocation || '').toLowerCase();
      if(note.includes('assigned imei') || note.includes('added from inventory') || note.includes('opening balance') || from.includes('opening balance')) return false;
      return true;
    });
    if(!d.archivedCategories) d.archivedCategories=[];
    if(!d.reorderList) d.reorderList=[];
    if(!d.reorderMeta) d.reorderMeta = { lastOrderDate: null };
    if(!d.meta) d.meta = { createdAt: todayISO() };
    // ensure Tullamore exists as a shop
    if(!d.shops.find(s=>s.id==='shop_tullamore')){
      d.shops.push({id:'shop_tullamore', name:'Tullamore', isWarehouse:false, active:true});
    }
    // ensure Kilkenney spelling
    const kilk = d.shops.find(s=>s.id==='shop_kilkenny' || s.name==='Kilkenny');
    if(kilk) kilk.name = 'Kilkenney';
    // de-duplicate shops that share a name (e.g. one added manually before, one added by a later update) —
    // keep the first, fold any stock from the duplicate into it, drop the duplicate.
    {
      const seenByName = {};
      const keep = [];
      d.shops.forEach(s=>{
        const key = s.name.trim().toLowerCase();
        if(!seenByName[key]){ seenByName[key]=s; keep.push(s); return; }
        const primary = seenByName[key];
        d.items.forEach(it=>{
          const extra = it.locations[s.id]||0;
          if(extra>0) it.locations[primary.id] = (it.locations[primary.id]||0)+extra;
          (it.units||[]).forEach(u=>{ if(u.location===s.id) u.location = primary.id; });
          delete it.locations[s.id];
          delete it.shopPrices[s.id];
        });
        d.movements.forEach(m=>{
          if(m.location===s.id) m.location = primary.id;
          if(m.toLocation===s.id) m.toLocation = primary.id;
          if(m.fromLocation===s.id) m.fromLocation = primary.id;
        });
      });
      d.shops = keep;
    }
    // 1. Normalize all device names, categories, conditions, colors, and memories
    const validItems = [];
    const itemMap = new Map(); // key -> surviving item

    d.items.forEach(it => {
      if(!it || !it.name) return;
      let name = it.name.trim();

      // Filter out garbage headers like Availability"
      if(/availability/i.test(name) || /batterypercentage/i.test(it.imei||'')) return;

      // Normalize Condition: Mint & Refurb mean Used
      let cond = it.condition || 'New';
      if(/mint|refurb|used|grade/i.test(name) || /mint|refurb|used/i.test(cond)) cond = 'Used';
      if(!['New', 'Used'].includes(cond)) cond = 'Used';
      it.condition = cond;

      // Strip grade / condition annotations from name
      name = name.replace(/grade\s*['"]?[a-z]['"]?/gi, '').replace(/\b(mint|refurbished|refurb\s*[a-z]?|brand\s*new|new|used)\b/gi, '').trim();

      // Extract colors from name
      if(!Array.isArray(it.colors)) it.colors = [];
      const COLOR_PATTERNS = [
        { reg: /\b(awesome\s+lavender)\b/gi, col: 'Awesome Lavender' },
        { reg: /\b(awesome\s+lilac)\b/gi, col: 'Awesome Lilac' },
        { reg: /\b(awesome\s+light\s*gray|awsome\s+lightgray|awesome\s+lightgrey)\b/gi, col: 'Awesome Light Gray' },
        { reg: /\b(awesome\s+pink|awsome\s+pink)\b/gi, col: 'Awesome Pink' },
        { reg: /\b(awesome\s+lemon)\b/gi, col: 'Awesome Lemon' },
        { reg: /\b(awesome\s+navy)\b/gi, col: 'Awesome Navy' },
        { reg: /\b(awesome\s+olive)\b/gi, col: 'Awesome Olive' },
        { reg: /\b(awesome\s+white)\b/gi, col: 'Awesome White' },
        { reg: /\b(awesome\s+lime)\b/gi, col: 'Awesome Lime' },
        { reg: /\b(awesome\s+graygreen|graygreen)\b/gi, col: 'Graygreen' },
        { reg: /\b(forest\s+green)\b/gi, col: 'Forest Green' },
        { reg: /\b(coral\s+green)\b/gi, col: 'Coral Green' },
        { reg: /\b(phantom\s+black)\b/gi, col: 'Phantom Black' },
        { reg: /\b(space\s+gray|space\s+grey)\b/gi, col: 'Space Gray' },
        { reg: /\b(rose\s+gold|rgold)\b/gi, col: 'Rose Gold' },
        { reg: /\b(ocean\s+blue)\b/gi, col: 'Ocean Blue' },
        { reg: /\b(dreamy\s+purple)\b/gi, col: 'Dreamy Purple' },
        { reg: /\b(pacific\s+blue)\b/gi, col: 'Pacific Blue' },
        { reg: /\b(midnight)\b/gi, col: 'Midnight' },
        { reg: /\b(starlight)\b/gi, col: 'Starlight' },
        { reg: /\b(ultramarine)\b/gi, col: 'Ultramarine' },
        { reg: /\b(icyblue|icy\s+blue)\b/gi, col: 'Icy Blue' },
        { reg: /\b(olive)\b/gi, col: 'Olive' },
        { reg: /\b(peach)\b/gi, col: 'Peach' },
        { reg: /\b(sage)\b/gi, col: 'Sage' },
        { reg: /\b(teal)\b/gi, col: 'Teal' },
        { reg: /\b(graphite)\b/gi, col: 'Graphite' },
        { reg: /\b(charcoal)\b/gi, col: 'Charcoal' },
        { reg: /\b(sapphire)\b/gi, col: 'Sapphire' },
        { reg: /\b(lavender)\b/gi, col: 'Lavender' },
        { reg: /\b(black|blk)\b/gi, col: 'Black' },
        { reg: /\b(white)\b/gi, col: 'White' },
        { reg: /\b(pink)\b/gi, col: 'Pink' },
        { reg: /\b(purple)\b/gi, col: 'Purple' },
        { reg: /\b(yellow)\b/gi, col: 'Yellow' },
        { reg: /\b(blue)\b/gi, col: 'Blue' },
        { reg: /\b(red)\b/gi, col: 'Red' },
        { reg: /\b(green)\b/gi, col: 'Green' },
        { reg: /\b(gold)\b/gi, col: 'Gold' },
        { reg: /\b(silver)\b/gi, col: 'Silver' },
        { reg: /\b(gray|grey)\b/gi, col: 'Gray' },
        { reg: /\b(navy)\b/gi, col: 'Navy' },
        { reg: /\b(lime)\b/gi, col: 'Lime' }
      ];
      COLOR_PATTERNS.forEach(({ reg, col }) => {
        if(reg.test(name)){
          name = name.replace(reg, '').trim();
          if(!it.colors.includes(col)) it.colors.push(col);
          (it.units||[]).forEach(u=>{ if(!u.color || u.color==='-') u.color = col; });
        }
      });

      // Standardize memory (uppercase GB)
      let memory = it.memory || '';
      const memMatch = name.match(/(\d+\s*gb\s*\/\s*\d+\s*gb|\d+\s*gb|\d+\s*\/\s*\d+\s*gb)/i);
      if(memMatch){
        memory = memMatch[0].replace(/\s+/g, '').replace(/gb/gi, 'GB');
        name = name.replace(memMatch[0], '').trim();
      }
      if(memory){
        memory = memory.replace(/\s+/g, '').replace(/gb/gi, 'GB');
        if(/^\d+$/.test(memory)) memory = memory + 'GB';
      }
      it.memory = memory;

      // Brand & Model casing corrections
      name = name.replace(/\bapple\s+ipad\b/gi, 'iPad');
      name = name.replace(/\bipad\b/gi, 'iPad');
      name = name.replace(/\bapple\s+airpods\b/gi, 'AirPods');
      name = name.replace(/\bairpods\b/gi, 'AirPods');
      name = name.replace(/\bapple\s+iphone\b/gi, 'iPhone');
      name = name.replace(/\biphone\b/gi, 'iPhone');
      name = name.replace(/\b(samsung|samusng)\b/gi, 'Samsung');
      name = name.replace(/\bgalaxy\b/gi, 'Galaxy');
      name = name.replace(/\bblackview\b/gi, 'Blackview');
      name = name.replace(/\bblack\s*view\b/gi, 'Blackview');
      name = name.replace(/\bblackviwe\b/gi, 'Blackview');
      name = name.replace(/\bnokia\b/gi, 'Nokia');
      name = name.replace(/\bmobitel\b/gi, 'Mobitel');
      name = name.replace(/\bgoogle\s+pixel\b/gi, 'Google Pixel');
      name = name.replace(/\bpoco\b/gi, 'Poco');
      name = name.replace(/\bredmi\b/gi, 'Redmi');
      name = name.replace(/\bamazon\s+fire\b/gi, 'Amazon Fire');
      name = name.replace(/\bamazon\s+kindle\b/gi, 'Amazon Kindle');
      name = name.replace(/\blenovo\s+tab\b/gi, 'Lenovo Tab');
      name = name.replace(/\bhuawei\s+mediapad\b/gi, 'Huawei MediaPad');
      name = name.replace(/\barchos\b/gi, 'Archos');
      name = name.replace(/\bmodio\b/gi, 'Modio');
      name = name.replace(/\bhoco\b/gi, 'Hoco');
      name = name.replace(/\bjoyroom\b/gi, 'Joyroom');

      // Model suffix corrections
      name = name.replace(/\b(\d+)\s*\+\b/g, '$1 Plus');
      name = name.replace(/\bxr\b/gi, 'XR');
      name = name.replace(/\bxs\b/gi, 'XS');
      name = name.replace(/\bse\b/gi, 'SE');
      name = name.replace(/\b5g\b/gi, '5G');
      name = name.replace(/\b4g\b/gi, '4G');
      name = name.replace(/\bhd\b/gi, 'HD');
      name = name.replace(/\bpro\s+max\b/gi, 'Pro Max');
      name = name.replace(/\bpro\b/gi, 'Pro');
      name = name.replace(/\bmax\b/gi, 'Max');
      name = name.replace(/\bplus\b/gi, 'Plus');
      name = name.replace(/\bultra\b/gi, 'Ultra');
      name = name.replace(/\bfe\b/gi, 'FE');
      name = name.replace(/\blite\b/gi, 'Lite');
      name = name.replace(/\bmini\b/gi, 'Mini');
      name = name.replace(/\bgen\b/gi, 'Gen');
      name = name.replace(/\bgeneration\b/gi, 'Generation');
      name = name.replace(/\b(1st|2nd|3rd|4th|5th|6th|7th|8th|9th|10th|11th)\b/gi, s=>s.toLowerCase());

      // Uppercase model codes (A07, A16, S24, M33, etc.)
      name = name.replace(/\b([asmtcASMTCNBv])(\d{2,4}[a-zA-Z]?)\b/g, (m, letter, num) => {
        return letter.toUpperCase() + num.toUpperCase();
      });

      // Clean extra spaces & append standard memory
      name = name.replace(/\s+/g, ' ').replace(/\s+-\s*$/, '').trim();
      if(memory && !name.includes(memory)){
        name = name + ' ' + memory;
      }
      it.name = name;

      // Category assignment: Samsung A11, A11+, A9, iPads, Kindles -> iPad & Tablets
      const isTablet = /ipad|tab\b|tablet|kindle|fire\s*\d|mediapad|archos|t20\b|sky\s*pad|modio\s*m/i.test(it.name);
      if(isTablet){
        it.category = 'cat_cgd9w36w69i'; // iPad & Tablets
      } else if(/iphone/i.test(it.name)){
        it.category = 'cat_7qgen7vw69i'; // iPhone
      } else if(/samsung/i.test(it.name)){
        it.category = 'cat_w56n2ktw69i'; // Samsung
      } else if(/airpods|buds/i.test(it.name)){
        it.category = 'cat_qaxr5vow69i'; // Gadgets
      } else if(/watch|band|pencil/i.test(it.name)){
        it.category = 'cat_u83iatxw69i'; // Smart Watches
      } else if(/nokia\s*(105|106|110|1010|1110|c1)|mobitel|doro/i.test(it.name)){
        it.category = 'cat_lkhn0qyw69i'; // Button Phones
      }

      it.colors = [...new Set(it.colors.filter(Boolean))];

      // Merge duplicates
      const canonKey = (it.name + '|' + it.category + '|' + (it.memory||'') + '|' + it.condition).toLowerCase();
      if(itemMap.has(canonKey)){
        const primary = itemMap.get(canonKey);
        d.shops.forEach(s => {
          primary.locations[s.id] = (primary.locations[s.id]||0) + (it.locations[s.id]||0);
        });
        if(Array.isArray(it.units) && it.units.length > 0){
          if(!Array.isArray(primary.units)) primary.units = [];
          it.units.forEach(u => primary.units.push(u));
        }
        (it.colors||[]).forEach(c => {
          if(!primary.colors.includes(c)) primary.colors.push(c);
        });
        d.movements.forEach(m => {
          if(m.itemId === it.id){
            m.itemId = primary.id;
            m.itemName = primary.name;
            m.categoryId = primary.category;
          }
        });
      } else {
        itemMap.set(canonKey, it);
        validItems.push(it);
      }
    });

    d.items = validItems;

    // backfill every item: units[] array, and a locations/shopPrices slot for every shop (incl. any newly added one)
    d.items.forEach(it=>{
      if(!Array.isArray(it.units)) it.units = [];
      if(it.wholesalePrice==null) it.wholesalePrice = it.costPrice||0;
      d.shops.forEach(s=>{
        if(it.locations[s.id]==null) it.locations[s.id]=0;
        if(it.shopPrices[s.id]==null) it.shopPrices[s.id]=it.shopPrices.warehouse||it.costPrice||0;
      });
      // backfill wholesalePrice on tracked units too
      (it.units||[]).forEach(u=>{
        if(u.wholesalePrice==null) u.wholesalePrice = u.costPrice||it.wholesalePrice||0;
      });
    });
    this.save();
  },
  save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    this.data.meta.lastSaved = new Date().toISOString();
    FileStore.writeAsync(); // silently write to linked file if one is set
    updateSaveIndicator();
  },
  snapshotToBackups(label){
    try{
      const list = JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');
      list.unshift({id:uid('bak'), label:label||'Backup', at:new Date().toISOString(), data:JSON.parse(JSON.stringify(this.data))});
      while(list.length>15) list.pop();
      localStorage.setItem(BACKUP_KEY, JSON.stringify(list));
    }catch(e){}
  },
  getBackups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]'); }catch(e){ return []; } },
  restoreBackup(id){
    const list = this.getBackups();
    const b = list.find(x=>x.id===id);
    if(!b) return false;
    this.data = JSON.parse(JSON.stringify(b.data));
    this.save();
    return true;
  }
};

/* ---------- File System Access API persistence ---------- */
const FileStore = {
  handle: null,      // FileSystemFileHandle — in-memory for this session
  _writing: false,
  _IDB_DB: 'stockline_fs',
  _IDB_STORE: 'handles',
  _IDB_KEY: 'dataFile',

  // Open (or create) the IndexedDB that stores the file handle across sessions
  _openIdb(){
    return new Promise((res, rej)=>{
      const req = indexedDB.open(this._IDB_DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(this._IDB_STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e);
    });
  },
  async _saveHandleToIdb(handle){
    try{
      const db = await this._openIdb();
      const tx = db.transaction(this._IDB_STORE, 'readwrite');
      tx.objectStore(this._IDB_STORE).put(handle, this._IDB_KEY);
    }catch(e){}
  },
  async _loadHandleFromIdb(){
    try{
      const db = await this._openIdb();
      return await new Promise((res,rej)=>{
        const tx = db.transaction(this._IDB_STORE, 'readonly');
        const req = tx.objectStore(this._IDB_STORE).get(this._IDB_KEY);
        req.onsuccess = e => res(e.target.result||null);
        req.onerror = e => rej(e);
      });
    }catch(e){ return null; }
  },
  async _clearHandleFromIdb(){
    try{
      const db = await this._openIdb();
      const tx = db.transaction(this._IDB_STORE, 'readwrite');
      tx.objectStore(this._IDB_STORE).delete(this._IDB_KEY);
    }catch(e){}
  },

  // On app startup — try to restore saved file handle and read latest data from it
  async init(){
    if(!window.showOpenFilePicker){ updateSaveIndicator(); return; } // API not available
    const handle = await this._loadHandleFromIdb();
    if(!handle) { updateSaveIndicator(); return; }
    // Verify we still have permission
    try{
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        this.handle = handle;
        await this._readFromHandle(); // load latest data from file
        updateSaveIndicator();
        return;
      }
      // Permission not auto-granted — show a prompt to re-link
      updateSaveIndicator('needs-relink');
    }catch(e){ updateSaveIndicator(); }
  },

  // Read data from the linked file and merge into Store
  async _readFromHandle(){
    try{
      const file = await this.handle.getFile();
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(parsed && parsed.items && parsed.shops){
        // Only load if the file is newer than localStorage
        const fileTs = parsed.meta?.lastSaved || '0';
        const lsTs = Store.data?.meta?.lastSaved || '0';
        if(fileTs > lsTs){
          Store.data = parsed;
          Store.migrate();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
          Toast.show('✓ Data loaded from linked file (newer than local copy).','ok');
          render();
        }
      }
    }catch(e){}
  },

  // Write Store.data to the linked file (non-blocking)
  writeAsync(){
    if(!this.handle) return;
    if(this._writing) return; // skip if already writing
    this._writing = true;
    this.handle.createWritable()
      .then(w => w.write(JSON.stringify(Store.data, null, 2)).then(()=>w.close()))
      .catch(()=>{})
      .finally(()=>{ this._writing = false; });
  },

  // Let user pick/create a file to link to
  async linkFile(){
    if(!window.showSaveFilePicker){
      Toast.show('Your browser does not support automatic file saving. Use Export JSON instead.','err');
      return;
    }
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: 'phone_count_data.json',
        types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
      });
      // Check if existing file has data we should load
      try{
        const file = await handle.getFile();
        if(file.size > 10){
          const text = await file.text();
          const parsed = JSON.parse(text);
          if(parsed && parsed.items && confirm('This file has existing data. Load it into the app?')){
            Store.data = parsed;
            Store.migrate();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
            render();
          }
        }
      }catch(e){}
      this.handle = handle;
      await this._saveHandleToIdb(handle);
      await this.writeAsync(); // write current data immediately
      Toast.show('✓ Data file linked! Auto-saving to this file on every change.','ok');
      updateSaveIndicator();
    }catch(e){
      if(e.name!=='AbortError') Toast.show('Could not link file.','err');
    }
  },

  // Re-request permission for a previously linked file (after browser restart)
  async requestPermission(){
    if(!this.handle){ await this.linkFile(); return; }
    try{
      const perm = await this.handle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        await this._readFromHandle();
        updateSaveIndicator();
        Toast.show('✓ File re-linked. Auto-saving resumed.','ok');
      }
    }catch(e){}
  },

  // Unlink the file
  async unlink(){
    this.handle = null;
    await this._clearHandleFromIdb();
    updateSaveIndicator();
    Toast.show('File unlinked. Data still saved in browser localStorage.','ok');
  },

  // Manual export — always available as fallback
  exportJson(){
    const blob = new Blob([JSON.stringify(Store.data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'phone_count_data_' + todayISO() + '.json';
    a.click();
    Toast.show('Data exported as JSON file.','ok');
  },

  // Manual import
  async importJson(){
    if(!window.showOpenFilePicker){
      // Fallback: hidden file input
      const inp = document.createElement('input');
      inp.type='file'; inp.accept='.json';
      inp.onchange = async()=>{
        const file = inp.files[0]; if(!file) return;
        const text = await file.text();
        try{
          const parsed = JSON.parse(text);
          if(!parsed.items || !parsed.shops){ Toast.show('Invalid data file.','err'); return; }
          if(!confirm('This will replace ALL current data with the imported file. Continue?')) return;
          Store.data = parsed; Store.migrate(); Store.save(); render();
          Toast.show('Data imported successfully!','ok');
        }catch(e){ Toast.show('Could not read file.','err'); }
      };
      inp.click();
      return;
    }
    try{
      const [handle] = await window.showOpenFilePicker({
        types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
      });
      const file = await handle.getFile();
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed.items || !parsed.shops){ Toast.show('Invalid data file.','err'); return; }
      if(!confirm('This will replace ALL current data with the imported file. Continue?')) return;
      Store.data = parsed; Store.migrate(); Store.save();
      // Optionally link this file for future auto-saving
      if(confirm('Link this file for auto-saving going forward?')){
        const writeHandle = await window.showSaveFilePicker({
          suggestedName: file.name,
          types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
        });
        this.handle = writeHandle;
        await this._saveHandleToIdb(writeHandle);
        updateSaveIndicator();
      }
      render();
      Toast.show('Data imported successfully!','ok');
    }catch(e){
      if(e.name!=='AbortError') Toast.show('Could not load file.','err');
    }
  }
};

function updateSaveIndicator(state){
  const el = document.getElementById('save_indicator');
  if(!el) return;
  const linked = !!FileStore.handle;
  const ts = Store.data?.meta?.lastSaved ? new Date(Store.data.meta.lastSaved).toLocaleTimeString('en-IE') : '—';
  if(state==='needs-relink'){
    el.innerHTML = `<span style="color:#F9AB00;font-weight:600;">⚠ File needs permission</span> <button class="btn sm" onclick="FileStore.requestPermission()" style="padding:3px 8px;font-size:11px;margin-left:6px;">🔓 Re-link</button>`;
  } else if(linked){
    el.innerHTML = `<span style="color:var(--green);font-size:12px;">✓ Auto-saving to file</span> <span style="color:var(--muted);font-size:11px;margin-left:6px;">Last: ${ts}</span>`;
  } else {
    el.innerHTML = `<span style="color:var(--amber);font-size:12px;">⚠ Saved in browser only</span> <button class="btn sm primary" onclick="FileStore.linkFile()" style="padding:3px 10px;font-size:11px;margin-left:8px;">📁 Link data file</button>`;
  }
}

function shopName(id){ const s=Store.data?.shops?.find(x=>x.id===id); return s?s.name:(id||'—'); }
function catName(id){ const c=Store.data?.categories?.find(x=>x.id===id); return c?c.name:'—'; }
function itemById(id){ return Store.data?.items?.find(x=>x.id===id); }
function totalQty(item){ return item && item.locations ? Object.values(item.locations).reduce((a,b)=>a+(Number(b)||0),0) : 0; }
function unitsAt(item, loc){ return (item?.units||[]).filter(u=>u && u.location===loc); }
function untrackedQtyAt(item, loc){ return item ? Math.max(0, ((item.locations&&item.locations[loc])||0) - unitsAt(item, loc).length) : 0; }
function findUnitByImei(imei){
  imei = (imei||'').trim().toLowerCase();
  if(!imei) return null;
  for(const it of (Store.data?.items||[])){
    const u = (it?.units||[]).find(x=>(x?.imei||'').trim().toLowerCase()===imei);
    if(u) return {item:it, unit:u};
  }
  return null;
}
function nonWarehouseShops(){ return (Store.data?.shops||[]).filter(s=>!s.isWarehouse && s.active!==false); }
function activeShops(){ return (Store.data?.shops||[]).filter(s=>s.active!==false); }
function categoryOrderIndex(catId){ const i = (Store.data?.categories||[]).findIndex(c=>c.id===catId); return i<0?999:i; }
function sortedItems(list){
  return (list||Store.data?.items||[]).filter(Boolean).slice().sort((a,b)=>{
    const ci = categoryOrderIndex(a?.category) - categoryOrderIndex(b?.category);
    if(ci!==0) return ci;
    return (a?.name||'').localeCompare(b?.name||'');
  });
}
function groupByCategory(list){
  const groups = {};
  Store.data.categories.forEach(c=>groups[c.id]=[]);
  (list||Store.data.items).forEach(it=>{ (groups[it.category]||(groups[it.category]=[])).push(it); });
  return Store.data.categories.map(c=>({cat:c, items:(groups[c.id]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name))})).filter(g=>g.items.length);
}
function signalClass(q){ if(q<=0) return 's0'; if(q<=2) return 's1'; if(q<=5) return 's2'; if(q<=10) return 's3'; return 's4'; }
function signalHtml(q){
  return `<span class="signal ${signalClass(q)}" title="${q} in stock"><i></i><i></i><i></i><i></i></span>`;
}
function weekLabel(startISO,endISO){ return `${startISO} – ${endISO}`; }
function isoAddDays(iso,days){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function mostRecentMonday(){
  const d = new Date();
  const day = d.getDay(); // 0 sun .. 6 sat
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(v=>{
    v = v==null?'':String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

  parseShopCsv(text, shopId){
    const out = [];
    const lines = text.split(/\r?\n/);
    let cat = 'Other';
    for(const line of lines){
      if(!line.trim()) continue;
      const cols = line.split(',').map(c=>c.trim());
      const lineLower = line.toLowerCase();
      if(lineLower.includes('iphone')) cat = 'iPhone';
      else if(lineLower.includes('samsung')) cat = 'Samsung';
      else if(lineLower.includes('ipad') || lineLower.includes('tablet')) cat = 'iPad & Tablets';
      else if(lineLower.includes('button') || lineLower.includes('nokia') || lineLower.includes('mobitel')) cat = 'Button Phones';
      else if(lineLower.includes('watch')) cat = 'Smart Watches';
      else if(lineLower.includes('mix phone') || lineLower.includes('other')) cat = 'Other Brands';
      else if(lineLower.includes('airpod') || lineLower.includes('gadget')) cat = 'Gadgets';

      if(/imei\s*number|current\s*availability|update\s*every|boxed\/new|storage.*colour/i.test(line)) continue;
      if(/date.*iphone|date.*samsung|model.*imei/i.test(line)) continue;
      if(/faulty|sold|transfer|out the back/i.test(line)) continue;

      let imei=null, model=null, condition='Used', prices=[], color='';
      if(shopId === 'warehouse'){
        if(cols.length >= 2){
          model = cols[0];
          imei = (cols[1]||'').replace(/[\s\-']/g,'');
          condition = cols[2] || 'New';
          if(cols[5]) { const p = this.parseEuro(cols[5]); if(p) prices.push(p); }
          if(cols[6]) { const p = this.parseEuro(cols[6]); if(p) prices.push(p); }
          if(cols[7]) { const p = this.parseEuro(cols[7]); if(p) prices.push(p); }
        }
      } else if(shopId === 'shop_thurles'){
        if(cols.length >= 4){
          model = cols[2];
          imei = (cols[3]||'').replace(/[\s\-']/g,'');
          condition = cols[4] || 'Used';
          if(cols[6]) { const p = this.parseEuro(cols[6]); if(p) prices.push(p); }
          if(cols[7]) { const p = this.parseEuro(cols[7]); if(p) prices.push(p); }
        }
      } else if(shopId === 'shop_tralee'){
        if(cols.length >= 4){
          const storage = (cols[1] && cols[1] !== '-') ? cols[1] : '';
          model = (cols[0] + ' ' + storage).trim();
          color = cols[2] || '';
          imei = (cols[3]||'').replace(/[\s\-']/g,'');
          condition = cols[4] || 'Used';
        }
      } else {
        if(cols.length >= 3){
          model = cols[1];
          imei = (cols[2]||'').replace(/[\s\-']/g,'');
          condition = cols[3] || 'Used';
          for(let i=4; i<cols.length; i++){
            const p = this.parseEuro(cols[i]);
            if(p) prices.push(p);
          }
        }
      }

      if(!imei || imei.length<8 || !model || /date/i.test(model) || model.toLowerCase()==='model') continue;
      out.push({ shopId, cat, model:model.trim(), imei, condition:this.normCondition(condition), color, prices });
    }
    return out;
  },
  catNameToId(name){
    const map={'iPhone':'iPhone','Samsung':'Samsung','Other Brands':'Other Brands','Button Phones':'Button Phones','iPad & Tablets':'iPad & Tablets','Gadgets':'Gadgets','Smart Watches':'Smart Watches'};
    const n=map[name]||name;
    let c=Store.data.categories.find(x=>x.name===n);
    if(!c){ c={id:uid('cat'),name:n}; Store.data.categories.push(c); }
    return c.id;
  },
  findItem(model, cat){
    const key=this.normKey(model);
    const items=Store.data.items;
    let it=items.find(i=>this.normKey(i.name)===key);
    if(it) return it;
    const scored=items.map(i=>{
      const ik=this.normKey(i.name);
      let score=0;
      if(ik.includes(key)||key.includes(ik)) score+=50;
      const words=key.match(/\d+[a-z]*/g)||[];
      words.forEach(w=>{ if(w.length>2&&ik.includes(w)) score+=10; });
      if(cat&&catName(i.category)===cat) score+=5;
      return {item:i,score};
    }).filter(x=>x.score>15).sort((a,b)=>b.score-a.score);
    return scored[0]?.item||null;
  },
  importUnits(rows, shopId){
    let added=0;
    rows.forEach(row=>{
      if(findUnitByImei(row.imei)) return;
      const loc=row.shopId||shopId;
      const existed=this.findItem(row.model, row.cat);
      let it=existed;
      const defaults = it ? { costPrice:it.costPrice, wholesalePrice:it.wholesalePrice, sellPrice:it.shopPrices[loc] } : null;
      const {cost,wholesale,sale}=this.classifyPrices(row.prices, defaults);
      if(!it){
        it={ id:uid('item'), name:row.model, category:this.catNameToId(row.cat), memory:'', imei:'', condition:this.normCondition(row.condition),
          colors:row.color?[row.color]:[], batteryPct:null, costPrice:cost, wholesalePrice:wholesale,
          shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
        activeShops().forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sale; });
        Store.data.items.push(it);
      } else {
        if(cost>0){ it.costPrice=cost; it.wholesalePrice=wholesale; }
        if(sale>0) it.shopPrices[loc]=sale;
      }
      const unit={ id:uid('unit'), imei:row.imei, color:row.color||'', condition:this.normCondition(row.condition),
        location:loc, costPrice:cost||it.costPrice, wholesalePrice:wholesale||it.wholesalePrice||it.costPrice+12,
        sellPrice:sale||it.shopPrices[loc]||it.costPrice };
      if(!Array.isArray(it.units)) it.units=[];
      it.units.push(unit);
      // Only bump location count for brand-new items; existing RAW stock already counted these devices
      if(!existed) it.locations[loc]=(it.locations[loc]||0)+1;
      else if((it.locations[loc]||0) < it.units.filter(u=>u.location===loc).length)
        it.locations[loc] = it.units.filter(u=>u.location===loc).length;
      added++;
    });
    return added;
  },
  importText(shopId, text){
    const rows=this.parseShopCsv(text, shopId);
    return this.importUnits(rows, shopId);
  },
  async tryFetchAll(){
    let total=0;
    for(const [shopId,filename] of Object.entries(this.SHOP_FILES)){
      try{
        const r=await fetch(filename);
        if(r.ok) total+=this.importText(shopId, await r.text());
      }catch(e){}
    }
    if(total>0) Store.save();
    return total;
  },
  importFiles(fileList){
    const nameToShop={
      'warhouse phone count main.csv':'warehouse','thurles phone count.csv':'shop_thurles',
      'kilkenney phone count.csv':'shop_kilkenny','maynooth phone count.csv':'shop_maynooth',
      'mullingar phone count.csv':'shop_mullingar','tralee phone count.csv':'shop_tralee',
      'tullamore phone count.csv':'shop_tullamore',
    };
    let total=0, pending=fileList.length;
    return new Promise(resolve=>{
      if(!pending){ resolve(0); return; }
      [...fileList].forEach(file=>{
        const shopId=nameToShop[file.name.toLowerCase()];
        const reader=new FileReader();
        reader.onload=e=>{
          if(shopId) total+=CsvImport.importText(shopId, e.target.result);
          pending--;
          if(pending===0){ Store.data.meta.imeiImportedV2=true; Store.save(); resolve(total); }
        };
        reader.readAsText(file);
      });
    });
  }
};

function allUnitsWithImei(atLoc){
  const rows=[];
  (Store.data?.items||[]).forEach(it=>{
    if(!it) return;
    (it.units||[]).filter(u=>u&&u.imei&&(!atLoc||u.location===atLoc)).forEach(u=>rows.push({it,u}));
  });
  return rows.sort((a,b)=>(a.it?.name||'').localeCompare(b.it?.name||''));
}

const Stock = {
  addMovement(m){
    m.id = uid('mv'); m.date = m.date||todayISO();
    Store.data.movements.push(m);
  },
  stockIn(itemId, qty, date, note, location){
    const it = itemById(itemId); if(!it||qty<=0) return;
    const loc = location || 'warehouse';
    it.locations[loc] = (it.locations[loc]||0) + qty;
    this.addMovement({type:'stock-in', itemId, itemName:it.name, categoryId:it.category, location:loc, fromLocation:'supplier', qty, date, note});
    Store.save();
  },
  // Adds ONE individually-tracked unit (IMEI, colour, condition, its own price). IMEI may be blank.
  // logMovement is FALSE by default: adding phones/IMEIs in Inventory fixes the count without logging Stock In.
  // Only the Stock In tab sets logMovement = true.
  addUnit(itemId, loc, data, date, note, logMovement = false){
    const it = itemById(itemId); if(!it) return null;
    if(!Array.isArray(it.units)) it.units=[];
    if(data.imei && findUnitByImei(data.imei)){ Toast.show('That IMEI is already in the system.','err'); return null; }
    const unit = {
      id: uid('unit'), imei:(data.imei||'').trim(), color:data.color||'', condition:data.condition||it.condition||'New',
      location: loc, costPrice: data.costPrice!=null?data.costPrice:it.costPrice, sellPrice: data.sellPrice!=null?data.sellPrice:((it.shopPrices&&it.shopPrices[loc])||it.costPrice),
      batteryPct: data.batteryPct!=null?data.batteryPct:null, dateAdded: date||todayISO()
    };
    it.units.push(unit);
    if(logMovement){
      it.locations[loc] = (it.locations[loc]||0) + 1;
      this.addMovement({type:'stock-in', itemId, itemName:it.name, categoryId:it.category, location:loc, fromLocation:'supplier', qty:1, date:date||todayISO(), note:note||(unit.imei?('IMEI '+unit.imei):'Individually tracked unit')});
    } else {
      // Baseline / count adjustment: ensure locations count has at least this unit counted
      if((it.locations[loc]||0) < unitsAt(it, loc).length){
        it.locations[loc] = unitsAt(it, loc).length;
      }
    }
    if(unit.color && !it.colors.includes(unit.color)) it.colors.push(unit.color);
    Store.save();
    return unit;
  },
  transfer(itemId, toShopId, qty, date, note){
    // kept for backwards compatibility: warehouse -> shop
    return this.transferGeneric(itemId, 'warehouse', toShopId, qty, date, note);
  },
  transferGeneric(itemId, fromLoc, toLoc, qty, date, note){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if(fromLoc===toLoc){ Toast.show('Pick two different locations.','err'); return false; }
    if((it.locations[fromLoc]||0) < qty){ Toast.show(`Not enough stock at ${shopName(fromLoc)} for that transfer.`,'err'); return false; }
    it.locations[fromLoc] -= qty;
    it.locations[toLoc] = (it.locations[toLoc]||0) + qty;
    // if this fully-untracked bulk move happens to be the only stock and a tracked unit exists, leave units alone —
    // tracked units should be moved explicitly (by IMEI) so their record stays accurate.
    this.addMovement({type:'transfer-out', itemId, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty, date, note});
    this.addMovement({type:'transfer-in', itemId, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty, date, note});
    Store.save();
    return true;
  },
  // Move ONE specific tracked unit (found by IMEI) to a new location.
  transferUnitByImei(imei, toLoc, date, note){
    const found = findUnitByImei(imei);
    if(!found){ Toast.show('No device found with that IMEI.','err'); return false; }
    const {item:it, unit} = found;
    const fromLoc = unit.location;
    if(fromLoc===toLoc){ Toast.show('That device is already at '+shopName(toLoc)+'.','err'); return false; }
    it.locations[fromLoc] = Math.max(0,(it.locations[fromLoc]||0)-1);
    it.locations[toLoc] = (it.locations[toLoc]||0)+1;
    unit.location = toLoc;
    this.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty:1, date, note:note||('IMEI '+unit.imei)});
    this.addMovement({type:'transfer-in', itemId:it.id, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty:1, date, note:note||('IMEI '+unit.imei)});
    Store.save();
    return {item:it, unit};
  },
  // Remove ONE specific tracked unit from stock (sold / faulty / deposit).
  removeUnit(itemId, unitId, status, date, note){
    const it = itemById(itemId); if(!it) return false;
    const idx = (it.units||[]).findIndex(u=>u.id===unitId);
    if(idx<0) return false;
    const unit = it.units[idx];
    it.units.splice(idx,1);
    it.locations[unit.location] = Math.max(0,(it.locations[unit.location]||0)-1);
    const mv = {
      id: uid('mv'),
      type: status,
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: unit.location,
      qty: 1,
      date: date||todayISO(),
      note: note||('IMEI '+(unit.imei||'—')),
      sellPrice: unit.sellPrice,
      unitData: JSON.parse(JSON.stringify(unit))
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  // qty=1 convenience actions used by Shop Sales quick buttons — auto-consumes a tracked unit if one exists
  // at that location (so IMEI records stay accurate without the person having to pick one manually).
  sell(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'sold', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'sold', date, note); }
    it.locations[shopId] -= qty;
    const mv = {
      id: uid('mv'),
      type: 'sold',
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: shopId,
      qty,
      date: date||todayISO(),
      note: note||'Bulk sale'
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  faulty(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'faulty', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'faulty', date, note); }
    it.locations[shopId] -= qty;
    const mv = {
      id: uid('mv'),
      type: 'faulty',
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: shopId,
      qty,
      date: date||todayISO(),
      note: note||'Bulk faulty'
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  deposit(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'deposit', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'deposit', date, note); }
    it.locations[shopId] -= qty;
    const mv = {
      id: uid('mv'),
      type: 'deposit',
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: shopId,
      qty,
      date: date||todayISO(),
      note: note||'Bulk deposit'
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  revertMovement(movementId){
    const mIdx = Store.data.movements.findIndex(m=>m.id===movementId);
    if(mIdx < 0){ Toast.show('Activity record not found.','err'); return false; }
    const m = Store.data.movements[mIdx];
    const it = itemById(m.itemId);
    if(!it){ Toast.show('Product not found.','err'); return false; }

    const qty = Math.abs(m.qty || 1);
    it.locations[m.location] = (it.locations[m.location]||0) + qty;
    if(m.unitData){
      if(!Array.isArray(it.units)) it.units = [];
      if(!it.units.some(u=>u.id===m.unitData.id || (m.unitData.imei && u.imei===m.unitData.imei))){
        it.units.push(m.unitData);
      }
    }
    Store.data.movements.splice(mIdx, 1);
    Store.save();
    Toast.show(`✓ Reverted: ${it.name} restored to ${shopName(m.location)} stock.`,'ok');
    return true;
  },
  adjust(itemId, shopId, newQty, note){
    const it = itemById(itemId); if(!it) return;
    it.locations[shopId] = Math.max(0, Number(newQty)||0);
    Store.save();
  }
};

// Transfer by scanning/typing IMEI directly from the top bar
Views.doScanTransfer = function(){
  const imei = (document.getElementById('inv_scan_imei')?.value||'').trim();
  const toLoc = document.getElementById('inv_scan_to')?.value;
  if(!imei){ Toast.show('Enter or scan an IMEI first.','err'); return; }
  if(!toLoc){ Toast.show('Select a destination store.','err'); return; }
  const found = findUnitByImei(imei);
  if(!found){ Toast.show(`No device found with IMEI ${imei}.`,'err'); return; }
  const {item:it, unit:u} = found;
  if(u.location === toLoc){ Toast.show(`That device is already at ${shopName(toLoc)}.`,'err'); return; }
  const result = Stock.transferUnitByImei(imei, toLoc, todayISO(), 'Transferred by IMEI scan from Inventory');
  if(result) Toast.show(`✓ ${it.name} (IMEI ${imei}) moved to ${shopName(toLoc)}.`,'ok');
  render();
};

// Save IMEI typed/pasted directly on the inventory row — no modal needed
Views.saveInlineImei = function(itemId, unitId, rawVal){
  const imei = (rawVal||'').replace(/[\s\-]/g,'').trim();
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  if(imei && imei !== (unit.imei||'')){
    // Check for duplicate
    const existing = findUnitByImei(imei);
    if(existing && existing.unit.id !== unitId){
      Toast.show(`IMEI ${imei} already assigned to ${existing.item.name}.`,'err');
      // reset the input back to original
      const inp = document.getElementById('imei_inp_'+unitId);
      if(inp) inp.value = unit.imei||'';
      return;
    }
  }
  unit.imei = imei;
  Store.save();
  Toast.show(imei ? `IMEI ${imei} saved.` : 'IMEI cleared.','ok');
  render();
};

// Inline transfer of a tracked IMEI unit — reads the inline <select> for destination
Views.doInlineTransfer = function(itemId, unitId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const toLoc = document.getElementById('inv_to_'+unitId)?.value;
  if(!toLoc || toLoc===fromLoc){ Toast.show('Pick a different destination store.','err'); return; }

  if(unit.imei){
    const result = Stock.transferUnitByImei(unit.imei, toLoc, todayISO(), 'Transferred from Inventory');
    if(result) Toast.show(`IMEI ${unit.imei} → ${shopName(toLoc)}.`,'ok');
  } else {
    it.locations[fromLoc] = Math.max(0,(it.locations[fromLoc]||0)-1);
    it.locations[toLoc] = (it.locations[toLoc]||0)+1;
    unit.location = toLoc;
    Stock.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty:1, date:todayISO(), note:'Transferred from Inventory'});
    Stock.addMovement({type:'transfer-in',  itemId:it.id, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty:1, date:todayISO(), note:'Transferred from Inventory'});
    Store.save();
    Toast.show(`Device transferred to ${shopName(toLoc)}.`,'ok');
  }
  render();
};

Views.doBulkInlineTransfer = function(itemId, fromLoc){

  const toEl  = document.getElementById('inv_bto_'+itemId+'_'+fromLoc);

Views.exportInventoryCsv = function(){
  const rows = [['Name','Category','Memory','IMEI','Colour','Condition','Location','Cost Price','Wholesale Price','Sale Price']];
  Store.data.items.forEach(it=>{
    const units = (it.units||[]).filter(u=>u.imei);
    if(units.length){
      units.forEach(u=>{
        rows.push([it.name, catName(it.category), it.memory, u.imei, u.color||'', u.condition||'',
          shopName(u.location), u.costPrice||it.costPrice, u.wholesalePrice||it.wholesalePrice, u.sellPrice||'']);
      });
    } else if(totalQty(it)>0){
      rows.push([it.name, catName(it.category), it.memory, '', '', it.condition, '',
        it.costPrice, it.wholesalePrice||0, it.shopPrices.warehouse||'']);
    }
  });
  csvDownload('inventory_export.csv', rows);
  Toast.show('Inventory exported as CSV.','ok');
};

/* ---- UNTRACKED / NO-IMEI STOCK HANDLERS ---- */
Views.cleanAllUntracked = function(){
  Modal.confirm({
    title: 'Clean all untracked (no-IMEI) balances?',
    body: '<p>This will adjust all stock counts so they match <b>only your exact tracked IMEI devices</b>.</p><p>Any ghost opening balances that do not have an IMEI number will be removed immediately.</p>',
    danger: true,
    confirmText: '🧹 Clean untracked counts',
    onConfirm: ()=>{
      let cleaned = 0;
      Store.data.items.forEach(it=>{
        Store.data.shops.forEach(s=>{
          const trackedCount = unitsAt(it, s.id).length;
          if((it.locations[s.id]||0) > trackedCount){
            cleaned += ((it.locations[s.id]||0) - trackedCount);
            it.locations[s.id] = trackedCount;
          }
        });
      });
      Store.save();
      Toast.show(`Cleaned ${cleaned} untracked balance(s). All stock now matches exact IMEIs.`,'ok');
      render();
    }
  });
};

Views.removeUntrackedStock = function(itemId, shopId){
  const it = itemById(itemId); if(!it) return;
  const untracked = untrackedQtyAt(it, shopId);
  const qtyToClear = untracked > 0 ? untracked : (it.locations[shopId]||0);
  Modal.confirm({
    title: `Clear untracked ${esc(it.name)}?`,
    body: `<p>Remove the ${qtyToClear} non-IMEI unit(s) for <b>${esc(it.name)}</b> at <b>${esc(shopName(shopId))}</b>?</p>`,
    danger: true,
    confirmText: 'Clear from store',
    onConfirm: ()=>{
      it.locations[shopId] = unitsAt(it, shopId).length;
      Store.save();
      Toast.show(`Cleared untracked balance for ${it.name} at ${shopName(shopId)}.`,'ok');
      render();
    }
  });
};

Views.saveEditedUnit = function(itemId, unitId){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;

  const newName = val('eu_name').trim();
  if(!newName){ Toast.show('Please enter a device model/name.','err'); return; }
  const newCat = val('eu_cat');
  const newMem = val('eu_mem').trim();
  const newImei = val('eu_imei').replace(/[\s\-']/g,'');
  const newColor = val('eu_color').trim();
  const newCond = val('eu_cond');
  const newLoc = val('eu_loc');
  const newCost = Math.max(0, parseFloat(val('eu_cost'))||0);
  const newWholesale = Math.max(0, parseFloat(val('eu_wholesale'))||0);
  const newSale = Math.max(0, parseFloat(val('eu_sale'))||0);

  // Check duplicate IMEI if changed
  if(newImei && newImei.toLowerCase() !== (unit.imei||'').toLowerCase()){
    const existing = findUnitByImei(newImei);
    if(existing && existing.unit.id !== unit.id){
      Toast.show(`IMEI ${newImei} is already assigned to ${existing.item.name}.`,'err');
      return;
    }
  }

  // Handle location change if changed
  const oldLoc = unit.location;
  if(newLoc && newLoc !== oldLoc){
    it.locations[oldLoc] = Math.max(0, (it.locations[oldLoc]||0) - 1);
    it.locations[newLoc] = (it.locations[newLoc]||0) + 1;
    unit.location = newLoc;
    Stock.addMovement({
      type: newLoc==='warehouse' ? 'transfer-in' : 'transfer-out',
      itemId: it.id, itemName: newName, categoryId: newCat,
      location: oldLoc, toLocation: newLoc, fromLocation: oldLoc,
      qty: 1, date: todayISO(), note: `Location updated for IMEI ${newImei||unit.id}`
    });
  }

  // Update item details
  it.name = newName;
  it.category = newCat;
  it.memory = newMem;

  // Update unit details
  unit.imei = newImei;
  unit.color = newColor;
  unit.condition = newCond;
  unit.costPrice = newCost;
  unit.wholesalePrice = newWholesale;
  unit.sellPrice = newSale;

  // Sync color with item colors array if new
  if(newColor && !it.colors.includes(newColor)) it.colors.push(newColor);

  Store.save();
  Modal.close();
  Toast.show(`Saved ${newName} (IMEI ${newImei||'updated'}).`,'ok');
  render();
};

Views.drawerRemoveUnit = function(itemId, unitId){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId);
  Modal.confirm({
    title: 'Delete this device record?',
    body: `<p>This will <b>silently remove</b> IMEI <b>${esc(unit?unit.imei||'(no IMEI)':'')}</b> from ${esc(shopName(unit?unit.location:''))} — no stock-in, stock-out or faulty entry will be created. Use this only to correct a data entry mistake.</p>`,
    danger: true, confirmText: 'Delete record',
    onConfirm: ()=>{
      const idx = (it.units||[]).findIndex(u=>u.id===unitId);
      if(idx >= 0){

        it.units.splice(idx, 1);
        it.locations[loc] = Math.max(0, (it.locations[loc]||0) - 1);

      Toast.show('Device record deleted (no movement logged).','ok');
      render();
    }
  });

Views.drawerConfirmTransfer = function(itemId, unitId){
  const it = itemById(itemId); const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const to = val('dwt_to');
  const from = unit.location;
  if(unit.imei){
    Stock.transferUnitByImei(unit.imei, to, todayISO(), 'Transferred from Inventory drawer');
  } else {
    it.locations[from] = Math.max(0,(it.locations[from]||0)-1);

Views.saveItem = function(itemId){
  const name = val('f_name').trim();
  if(!name){ Toast.show('Please enter a name.','err'); return; }
  const cat = val('f_cat');
  const mem = val('f_mem').trim();
  const cond = val('f_cond');
  const batt = val('f_batt');
  const imei = val('f_imei').trim();
  const colors = val('f_colors').split(',').map(s=>s.trim()).filter(Boolean);
  const cost = parseFloat(val('f_cost'))||0;
  const shopPrices = {};
  document.querySelectorAll('.sp').forEach(inp=>{ shopPrices[inp.dataset.shop] = parseFloat(inp.value)||0; });

  if(itemId){
    const it = itemById(itemId);
    Object.assign(it, {name, category:cat, memory:mem, condition:cond, batteryPct:batt===''?null:Number(batt), imei, colors, costPrice:cost, shopPrices});
  } else {
    const it = {
      id:uid('item'), name, category:cat, memory:mem, condition:cond, batteryPct:batt===''?null:Number(batt),
      imei, colors, costPrice:cost, shopPrices, locations:{}, units:[], createdAt: todayISO()
    };
    Store.data.shops.forEach(s=>it.locations[s.id]=0);
    Store.data.items.push(it);
    const openQty = Number(val('f_openqty'))||0;
    const openLoc = val('f_openloc');
    if(openQty>0){
      it.locations[openLoc] = openQty;
    }
  }
  Store.save();
  Modal.close();
  Toast.show('Saved.','ok');
  render();
};

    }, date, note, true);

Views.doBulkStockIn = function(){
  const raw = val('si_bulk').trim();
  const loc = val('si_bulk_loc') || 'warehouse';
  if(!raw){ Toast.show('Paste a list first.','err'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=[];
  lines.forEach(line=>{
    const parts = line.split(/\t|,(?=[^,]*$)/).map(s=>s.trim());
    if(parts.length<2){ fail.push(line); return; }
    const name = parts[0]; const qty = Number(parts[1]);
    const it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!it || !qty){ fail.push(line); return; }
    Stock.stockIn(it.id, qty, todayISO(), 'Bulk import', loc);
    ok++;
  });
  Toast.show(`${ok} line(s) imported.${fail.length? ' '+fail.length+' skipped (name not found).':''}`, fail.length?'err':'ok');
  render();
};

const CSV_HEADERS = ['Name','Memory','Category','Colour','Condition','IMEI','Location','Cost','Sell','Qty'];
Views.exportCsvTemplate = function(){
  csvDownload('stockline_import_template.csv', [CSV_HEADERS, ['iPhone 14 128GB','128GB','iPhone','Starlight','Used','','Warehouse','285','340','1']]);
};
Views.exportFullStockCsv = function(){
  const rows = [CSV_HEADERS];
  Store.data.items.forEach(it=>{
    (it.units||[]).forEach(u=>{
      rows.push([it.name, it.memory, catName(it.category), u.color, u.condition, u.imei, shopName(u.location), u.costPrice, u.sellPrice, 1]);
    });
    Store.data.shops.forEach(s=>{
      const bulk = untrackedQtyAt(it, s.id);
      if(bulk>0) rows.push([it.name, it.memory, catName(it.category), (it.colors||[]).join('/'), it.condition, '', s.name, it.costPrice, it.shopPrices[s.id], bulk]);
    });
  });
  csvDownload('stockline_current_stock.csv', rows);
  Toast.show('Full stock exported.','ok');
};
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(line=>{
    const cells=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===',' && !inQ){ cells.push(cur); cur=''; continue; }
      cur+=c;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}
Views.doCsvImport = function(){
  const fileInput = document.getElementById('si_csv_file');
  const file = fileInput && fileInput.files[0];
  if(!file){ Toast.show('Choose a CSV file first.','err'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const rows = parseCsv(e.target.result);
      const header = rows[0].map(h=>h.toLowerCase());
      const idx = name => header.indexOf(name.toLowerCase());
      const iName=idx('Name'), iMem=idx('Memory'), iCat=idx('Category'), iColor=idx('Colour'), iCond=idx('Condition'),
            iImei=idx('IMEI'), iLoc=idx('Location'), iCost=idx('Cost'), iSell=idx('Sell'), iQty=idx('Qty');
      if(iName<0){ Toast.show('CSV needs at least a Name column.','err'); return; }
      let added=0, skipped=0;
      rows.slice(1).forEach(r=>{
        const name=(r[iName]||'').trim(); if(!name) return;
        const memory=iMem>=0?(r[iMem]||'').trim():'';
        const catNameStr=iCat>=0?(r[iCat]||'').trim():'';
        const color=iColor>=0?(r[iColor]||'').trim():'';
        const condition=iCond>=0?(r[iCond]||'New').trim():'New';
        const imei=iImei>=0?(r[iImei]||'').trim():'';
        const locName=iLoc>=0?(r[iLoc]||'').trim():'Warehouse';
        const cost=iCost>=0?Number(r[iCost])||0:0;
        const sell=iSell>=0?Number(r[iSell])||0:0;
        const qty=iQty>=0?Number(r[iQty])||1:1;
        const shop = Store.data.shops.find(s=>s.name.toLowerCase()===locName.toLowerCase()) || Store.data.shops.find(s=>s.isWarehouse);
        let it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase() && (x.memory||'').toLowerCase()===memory.toLowerCase());
        if(!it){
          let cat = Store.data.categories.find(c=>c.name.toLowerCase()===catNameStr.toLowerCase());
          if(!cat) cat = Store.data.categories[0];
          it = { id:uid('item'), name, category:cat.id, memory, imei:'', condition, colors:[], batteryPct:null, costPrice:cost||0, shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
          Store.data.shops.forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sell||cost||0; });
          Store.data.items.push(it);
        }
        if(imei){
          if(findUnitByImei(imei)){ skipped++; return; }
          Stock.addUnit(it.id, shop.id, {imei, color, condition, costPrice:cost||it.costPrice, sellPrice:sell||it.shopPrices[shop.id]}, todayISO(), 'CSV import');
        } else if(qty>0){
          Stock.stockIn(it.id, qty, todayISO(), 'CSV import', shop.id);
        }
        added++;
      });
      Store.save();
      Toast.show(`Imported ${added} row(s).${skipped?(' '+skipped+' skipped (duplicate IMEI).'):''}`, 'ok');
      render();
    }catch(err){
      Toast.show('Could not read that CSV file.','err');
    }
  };
  reader.readAsText(file);
};

  if(!raw){ Toast.show('Paste a list first.','err'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=[];
  lines.forEach(line=>{
    const parts = line.split(/\t|,(?=[^,]*$)/).map(s=>s.trim());
    if(parts.length<2){ fail.push(line); return; }
    const name = parts[0]; const qty = Number(parts[1]);

  });

/* ---- WEEKLY REPORT (matches your uploaded sheet layout) ---- */
Views._weekStart = mostRecentMonday();
Views.weekly = function(){
  const weekStart = Views._weekStart;
  const weekEnd = isoAddDays(weekStart,6);
  const shops = activeShops();

  function calcFor(shopId, catId){
    const itemsInCat = Store.data.items.filter(it=>it.category===catId);
    const currQty = itemsInCat.reduce((sum, it) => sum + (it.locations[shopId]||0), 0);
    
    let inQ = 0, outQ = 0, faultyQ = 0, depositQ = 0;
    itemsInCat.forEach(it=>{
      const moves = Store.data.movements.filter(m => m.itemId === it.id && m.location === shopId);
      const during = moves.filter(m => m.date >= weekStart && m.date <= weekEnd);
      during.forEach(m=>{
        if(m.type === 'stock-in' || m.type === 'transfer-in') inQ += Math.abs(m.qty);
        else if(m.type === 'sold' || m.type === 'transfer-out') outQ += Math.abs(m.qty);
        else if(m.type === 'faulty') faultyQ += Math.abs(m.qty);
        else if(m.type === 'deposit') depositQ += Math.abs(m.qty);
      });
    });

    // If viewing a past week, adjust for movements that occurred after weekEnd
    let afterInQ = 0, afterOutQ = 0;
    itemsInCat.forEach(it=>{
      const moves = Store.data.movements.filter(m => m.itemId === it.id && m.location === shopId);
      const after = moves.filter(m => m.date > weekEnd);
      after.forEach(m=>{
        if(m.type === 'stock-in' || m.type === 'transfer-in') afterInQ += Math.abs(m.qty);
        else if(m.type === 'sold' || m.type === 'transfer-out' || m.type === 'faulty' || m.type === 'deposit') afterOutQ += Math.abs(m.qty);
      });
    });

    const remaining = Math.max(0, currQty + afterOutQ - afterInQ);
    const afterIn = remaining + outQ + faultyQ + depositQ;
    const start = Math.max(0, afterIn - inQ);

    return { start, inQ, afterIn, outQ, faultyQ, depositQ, remaining };
  }

  let html = `
    <div class="toolbar">
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,-7);render()">← Prev week</button>
      <span style="font-weight:600;">${weekLabel(weekStart,weekEnd)}</span>
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,7);render()">Next week →</button>
      <div class="spacer"></div>
      <button class="btn" onclick="Views.printPage()">🖨 Export PDF</button>
      <button class="btn" onclick="Views.exportWeeklyCsv()">⬇ Export Excel (CSV)</button>
    </div>
  `;
  shops.forEach(s=>{
    let tS=0,tI=0,tAI=0,tO=0,tF=0,tD=0,tR=0;
    const catRows = Store.data.categories.map(c=>{
      const r = calcFor(s.id,c.id);
      tS+=r.start;tI+=r.inQ;tAI+=r.afterIn;tO+=r.outQ;tF+=r.faultyQ;tD+=r.depositQ;tR+=r.remaining;
      return `<tr><td>${esc(c.name)}</td><td>${r.start}</td><td>${r.inQ?'+'+r.inQ:0}</td><td>${r.afterIn}</td><td>${r.outQ?'-'+r.outQ:0}</td><td>${r.faultyQ||0}</td><td>${r.depositQ||0}</td><td><b>${r.remaining}</b></td></tr>`;
    }).join('');
    html += `
      <div class="card" style="margin-bottom:18px;">
        <div class="table-section-title">${esc(s.name)}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Category</th><th>Start of week</th><th>Stock in</th><th>After stock in</th><th>Stock out</th><th>Faulty</th><th>Deposit</th><th>Remaining</th></tr></thead>
          <tbody>
            <tr class="table-total-row"><td>All categories</td><td>${tS}</td><td>${tI?'+'+tI:0}</td><td>${tAI}</td><td>${tO?'-'+tO:0}</td><td>${tF}</td><td>${tD}</td><td>${tR}</td></tr>
            ${catRows}
          </tbody>
        </table></div>
      </div>`;
  });
  return html;
};
Views.exportWeeklyCsv = function(){
  const weekStart = Views._weekStart, weekEnd = isoAddDays(weekStart,6);
  const rows = [['Shop','Category','Start of week','Stock in','After stock in','Stock out','Faulty','Deposit','Remaining']];
  const shops = activeShops();
  shops.forEach(s=>{
    Store.data.categories.forEach(c=>{
      const itemsInCat = Store.data.items.filter(it=>it.category===c.id);
      const currQty = itemsInCat.reduce((sum, it) => sum + (it.locations[s.id]||0), 0);
      let inQ = 0, outQ = 0, faultyQ = 0, depositQ = 0;
      itemsInCat.forEach(it=>{
        const moves = Store.data.movements.filter(m => m.itemId === it.id && m.location === s.id);
        const during = moves.filter(m => m.date >= weekStart && m.date <= weekEnd);
        during.forEach(m=>{
          if(m.type === 'stock-in' || m.type === 'transfer-in') inQ += Math.abs(m.qty);
          else if(m.type === 'sold' || m.type === 'transfer-out') outQ += Math.abs(m.qty);
          else if(m.type === 'faulty') faultyQ += Math.abs(m.qty);
          else if(m.type === 'deposit') depositQ += Math.abs(m.qty);
        });
      });
      let afterInQ = 0, afterOutQ = 0;
      itemsInCat.forEach(it=>{
        const moves = Store.data.movements.filter(m => m.itemId === it.id && m.location === s.id);
        const after = moves.filter(m => m.date > weekEnd);
        after.forEach(m=>{
          if(m.type === 'stock-in' || m.type === 'transfer-in') afterInQ += Math.abs(m.qty);
          else if(m.type === 'sold' || m.type === 'transfer-out' || m.type === 'faulty' || m.type === 'deposit') afterOutQ += Math.abs(m.qty);
        });
      });
      const remaining = Math.max(0, currQty + afterOutQ - afterInQ);
      const afterIn = remaining + outQ + faultyQ + depositQ;
      const start = Math.max(0, afterIn - inQ);
      rows.push([s.name, c.name, start, inQ, afterIn, outQ, faultyQ, depositQ, remaining]);
    });
  });
  csvDownload(`weekly_report_${weekStart}.csv`, rows);
  Toast.show('Weekly report exported.','ok');
};

            <td>${totalQty(r.item)}</td>
            <td><b>${soldInPeriod(r.item, since)}</b></td>
            <td><input type="number" min="1" value="${r.qty}" style="width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;" onchange="Views.setReorderQty('${r.itemId}',this.value)"></td>
            <td><button class="btn sm danger" onclick="Views.removeReorder('${r.itemId}')">Remove</button></td>
          </tr>`).join('') : `<tr><td colspan="6"><div class="empty"><div class="big">Reorder list is empty</div>Add items from Best Sellers or click "+ Add item".</div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
};
Views.markOrdered = function(){
  Store.data.reorderMeta.lastOrderDate = todayISO();
  Store.save();
  Toast.show('Marked as ordered — the "since last order" clock starts fresh from today.','ok');
  render();
};
Views.setReorderQty = function(itemId,val){
  const r = Store.data.reorderList.find(x=>x.itemId===itemId); if(r){ r.qty = Number(val)||1; Store.save(); }
};
Views.removeReorder = function(itemId){
  Store.data.reorderList = Store.data.reorderList.filter(r=>r.itemId!==itemId);
  Store.save(); render();
};
Views.addAnyToReorder = function(){
  const since = reorderPeriodStart();
  Modal.open(`
    <div class="modal">
      <div class="modal-head"><h3>Add item to reorder list</h3><button class="btn ghost sm" onclick="Modal.close()">✕</button></div>
      <div class="modal-body">
        <div class="field"><label>Item</label><select id="ro_item" onchange="Views.updateReorderSoldHint()">${sortedItems().map(it=>`<option value="${it.id}">${esc(it.name)}</option>`).join('')}</select></div>
        <div class="helpbox" id="ro_sold_hint" style="margin-top:-4px;"></div>
        <div class="field"><label>Quantity to order</label><input id="ro_qty" type="number" min="1" value="5"></div>
      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.confirmAddReorder()">Add</button></div>
    </div>`);
  Views.updateReorderSoldHint();
};
Views.updateReorderSoldHint = function(){
  const it = itemById(val('ro_item'));
  const el = document.getElementById('ro_sold_hint');
  if(!it || !el) return;
  const since = reorderPeriodStart();
  el.textContent = `Currently in stock: ${totalQty(it)} · Sold in selected period: ${soldInPeriod(it, since)}`;
};
Views.confirmAddReorder = function(){
  const itemId = val('ro_item');
  const qty = Number(val('ro_qty'))||1;
  const existing = Store.data.reorderList.find(r=>r.itemId===itemId);
  if(existing) existing.qty = qty; else Store.data.reorderList.push({itemId,qty});
  Store.save(); Modal.close(); Toast.show('Added to reorder list.','ok'); render();
};
Views.exportReorderCsv = function(){
  const since = reorderPeriodStart();
  const rows = [['Item','Category','Memory','Currently in stock','Sold in period','Qty to order','Cost price']];
  Store.data.reorderList.forEach(r=>{
    const it = itemById(r.itemId); if(!it) return;
    rows.push([it.name, catName(it.category), it.memory, totalQty(it), soldInPeriod(it, since), r.qty, it.costPrice]);
  });
  csvDownload('supplier_reorder_list.csv', rows);
  Toast.show('Reorder list exported — ready to send to your supplier.','ok');
};

/* ---- SHOPS ---- */
Views.shops = function(){
  const shops = Store.data.shops.filter(s=>s.active!==false);
  const archived = Store.data.shops.filter(s=>s.active===false);
  return `
    <div class="row">
      <div class="col" style="flex:2;min-width:340px;">
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th>Shop</th><th>Units in stock</th><th></th></tr></thead>
            <tbody>
              ${shops.map(s=>{
                const units = Store.data.items.reduce((a,it)=>a+(it.locations[s.id]||0),0);
                return `<tr><td><b>${esc(s.name)}</b> ${s.isWarehouse?'<span class="pill gray">warehouse</span>':''}</td><td>${units}</td>
                  <td>${s.isWarehouse?'<span style="color:var(--muted);font-size:12px;">the warehouse can not be removed</span>':`
                    <button class="btn sm" onclick="Views.renameShop('${s.id}')">Rename</button>
                    <button class="btn sm danger" onclick="Views.removeShop('${s.id}')">Remove</button>`}</td></tr>`;
              }).join('')}
            </tbody>
          </table></div>
        </div>
      </div>
      <div class="col" style="flex:1;min-width:260px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Add a shop</h3>
          <div class="field"><label>Name</label><input id="newshop" placeholder="e.g. Portlaoise"></div>
          <button class="btn primary" onclick="Views.addShop()">+ Add shop</button>
        </div>
        ${archived.length? `
        <div class="card card-pad" style="margin-top:16px;">
          <h3 style="margin-top:0;">Removed shops</h3>
          ${archived.map(s=>{
            const units = Store.data.items.reduce((a,it)=>a+(it.locations[s.id]||0),0);
            return `<div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);">
              <div>${esc(s.name)}<div style="font-size:11px;color:var(--muted);">${units} unit(s) still recorded there, kept safe</div></div>
              <button class="btn sm" onclick="Views.restoreShop('${s.id}')">Restore</button>
            </div>`;
          }).join('')}
        </div>` : ''}
      </div>
    </div>
  `;
};
Views.renameShop = function(id){
  const s = Store.data.shops.find(x=>x.id===id);
  const name = prompt('Rename shop', s.name);
  if(name && name.trim()){ s.name = name.trim(); Store.save(); render(); }
};
Views.removeShop = function(id){
  const s = Store.data.shops.find(x=>x.id===id);
  const units = Store.data.items.reduce((a,it)=>a+(it.locations[id]||0),0);
  Modal.confirm({
    title:'Remove this shop?',
    body:`<p>Do you really want to remove <b>${esc(s.name)}</b>?${units?` It currently has <b>${units}</b> unit(s) recorded there.`:''}</p>
          <p>A full backup is saved automatically before removing. The shop and every unit currently recorded there are kept safe and hidden — nothing is deleted — so you can restore it any time from this page with its stock intact.</p>`,
    danger:true, confirmText:'Yes, remove it',
    onConfirm:()=>{
      Store.snapshotToBackups('Before removing shop: '+s.name);
      s.active = false;
      Store.save();
      Toast.show('Shop removed — restore it any time from this page.','ok');
      render();
    }
  });
};
Views.restoreShop = function(id){
  const s = Store.data.shops.find(x=>x.id===id);
  s.active = true;
  Store.save(); Toast.show('Shop restored, with its stock intact.','ok'); render();
};

/* ---- CATEGORIES ---- */
Views.categories = function(){
  const cats = Store.data.categories;
  return `
    <div class="row">
      <div class="col" style="flex:2;min-width:340px;">
        <div class="card">
          <div class="table-wrap"><table>
            <thead><tr><th>Category</th><th>Items</th><th>Total units</th><th></th></tr></thead>
            <tbody>
              ${cats.map(c=>{
                const its = Store.data.items.filter(i=>i.category===c.id);
                const units = its.reduce((a,i)=>a+totalQty(i),0);
                return `<tr><td><b>${esc(c.name)}</b></td><td>${its.length}</td><td>${units}</td>
                  <td><button class="btn sm" onclick="Views.renameCategory('${c.id}')">Rename</button>
                  <button class="btn sm danger" onclick="Views.removeCategory('${c.id}')">Remove</button></td></tr>`;
              }).join('') || `<tr><td colspan="4"><div class="empty">No categories yet.</div></td></tr>`}
            </tbody>
          </table></div>
        </div>
      </div>
      <div class="col" style="flex:1;min-width:260px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Add a category</h3>
          <div class="field"><label>Name</label><input id="newcat" placeholder="e.g. Chargers & Cables"></div>
          <button class="btn primary" onclick="Views.addCategory()">+ Add category</button>
        </div>
        ${Store.data.archivedCategories.length? `
        <div class="card card-pad" style="margin-top:16px;">
          <h3 style="margin-top:0;">Removed categories</h3>
          ${Store.data.archivedCategories.map(c=>`
            <div class="row" style="justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);">
              <div>${esc(c.name)}<div style="font-size:11px;color:var(--muted);">removed ${c.removedAt}</div></div>
              <button class="btn sm" onclick="Views.restoreCategory('${c.id}')">Restore</button>
            </div>`).join('')}
        </div>` : ''}
      </div>
    </div>
  `;
};
Views.addCategory = function(){
  const name = val('newcat').trim();
  if(!name){ Toast.show('Enter a category name.','err'); return; }
  Store.data.categories.push({id:uid('cat'), name});
  Store.save(); Toast.show('Category added.','ok'); render();
};
Views.renameCategory = function(catId){
  const c = Store.data.categories.find(x=>x.id===catId);
  const name = prompt('Rename category', c.name);
  if(name && name.trim()){ c.name = name.trim(); Store.save(); render(); }
};
Views.removeCategory = function(catId){
  const c = Store.data.categories.find(x=>x.id===catId);
  const inUse = Store.data.items.filter(i=>i.category===catId).length;
  Modal.confirm({
    title:'Remove this category?',
    body:`<p>Do you really want to remove <b>${esc(c.name)}</b>?${inUse?` It is currently used by <b>${inUse}</b> item(s).`:''}</p>
          <p>A full backup is saved automatically before removing, and the category itself is kept in <b>Removed categories</b> so you can restore it any time — nothing is permanently deleted.</p>`,
    danger:true, confirmText:'Yes, remove it',
    onConfirm:()=>{
      Store.snapshotToBackups('Before removing category: '+c.name);
      Store.data.categories = Store.data.categories.filter(x=>x.id!==catId);
      Store.data.archivedCategories.push({...c, removedAt: todayISO()});
      Store.save();
      Toast.show('Category removed — restore it any time from this page.','ok');
      render();
    }
  });
};
Views.restoreCategory = function(catId){
  const idx = Store.data.archivedCategories.findIndex(x=>x.id===catId);
  if(idx<0) return;
  const [c] = Store.data.archivedCategories.splice(idx,1);
  delete c.removedAt;
  Store.data.categories.push(c);
  Store.save(); Toast.show('Category restored.','ok'); render();
};

/* ---- BACKUP & SETTINGS ---- */
Views.backup = function(){
  const backups = Store.getBackups();
  return `
    <div class="row">
      <div class="col" style="flex:1;min-width:320px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Full data backup</h3>
          <p style="color:var(--muted);font-size:13px;">Download everything — items, stock levels, categories, and history — as one file. Keep it somewhere safe (email to yourself, cloud drive, USB).</p>
          <button class="btn primary" onclick="Views.downloadFullBackup()">⬇ Download full backup (.json)</button>
          <div style="height:14px;"></div>
          <p style="color:var(--muted);font-size:13px;">Restore from a downloaded backup file:</p>
          <input type="file" id="restoreFile" accept=".json" onchange="Views.restoreFromFile(this)">
        </div>
        <div class="card card-pad" style="margin-top:16px;">
          <h3 style="margin-top:0;">Import IMEIs from shop CSV files</h3>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;">
            Loads every phone with its <b>IMEI</b>, <b>cost</b>, <b>wholesale</b>, and <b>sale</b> price from your shop count spreadsheets.
            Prices are sorted per model: lowest = cost, middle = wholesale (~€12 above cost), highest = sale.
          </p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;">
            <button class="btn primary" onclick="Views.fetchShopCsvs()">↻ Auto-load CSVs from this folder</button>
            <label class="btn" style="cursor:pointer;">📂 Choose CSV files<input type="file" accept=".csv" multiple style="display:none;" onchange="Views.importShopCsvs(this)"></label>
          </div>
          <p style="color:var(--muted);font-size:12px;margin-top:10px;">Select all 7 shop CSV files if auto-load doesn't work (e.g. opening the file directly from Downloads).</p>
        </div>
        <div class="card card-pad" style="margin-top:16px;">
          <h3 style="margin-top:0;">Publish online (Cloudflare)</h3>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;">
            This app is a single file — you can host it for free on <b>Cloudflare Pages</b>:<br>
            1. Download this page (use your browser's Save As, or ask for the file).<br>
            2. Go to the Cloudflare dashboard → Workers &amp; Pages → Create → Pages → upload the file.<br>
            3. Cloudflare gives you a public link you can open from any device.
          </p>
          <p style="color:var(--muted);font-size:13px;">
            Note: stock data is saved in the browser you're using (per device). For one shared list across all shops and devices, ask to connect this to a small cloud database — happy to help set that up next.
          </p>
        </div>
      </div>
      <div class="col" style="flex:1;min-width:320px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Automatic snapshots (undo safety net)</h3>
          <p style="color:var(--muted);font-size:13px;">Saved automatically before risky actions (like removing a category or device), plus whenever you click "Quick backup" at the top of the screen.</p>
          <div class="table-wrap"><table>
            <thead><tr><th>When</th><th>Label</th><th></th></tr></thead>
            <tbody>
              ${backups.length? backups.map(b=>`<tr><td>${new Date(b.at).toLocaleString()}</td><td>${esc(b.label)}</td><td><button class="btn sm" onclick="Views.restoreSnapshot('${b.id}')">Restore</button></td></tr>`).join('') : `<tr><td colspan="3"><div class="empty">No snapshots yet.</div></td></tr>`}
            </tbody>
          </table></div>
        </div>
      </div>
    </div>
  `;
};
Views.fetchShopCsvs = function(){
  CsvImport.tryFetchAll().then(n=>{
    if(n>0){
      Store.data.meta.imeiImportedV2=true;
      Store.save();
      Toast.show(`Loaded ${n} device(s) with IMEI from CSV files.`,'ok');
      render();
    } else {
      Toast.show('Could not auto-load CSVs — use "Choose CSV files" and select all shop count spreadsheets.','err');
    }
  });
};
Views.importShopCsvs = function(input){
  const files = input.files;
  if(!files||!files.length){ Toast.show('Select at least one CSV file.','err'); return; }
  CsvImport.importFiles(files).then(n=>{
    Toast.show(n>0?`Imported ${n} device(s) with IMEI.`:'No new devices imported (may already exist).', n>0?'ok':'err');
    render();
  });
};
Views.downloadFullBackup = function(){
  const blob = new Blob([JSON.stringify(Store.data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stockline_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  Toast.show('Backup downloaded.','ok');
};
Views.restoreFromFile = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      Modal.confirm({
        title:'Restore from this file?',
        body:'<p>This will replace all current data with the contents of the uploaded backup. Your current data will be snapshotted first, just in case.</p>',
        danger:true, confirmText:'Restore',
        onConfirm:()=>{
          Store.snapshotToBackups('Before restoring from uploaded file');
          Store.data = data; Store.save(); Toast.show('Data restored.','ok'); render();
        }
      });
    }catch(err){ Toast.show('That file could not be read as a backup.','err'); }
  };
  reader.readAsText(file);
};
Views.restoreSnapshot = function(id){
  Modal.confirm({
    title:'Restore this snapshot?',
    body:'<p>Your current data will replace with this earlier snapshot. This action itself is also backed up first.</p>',
    danger:true, confirmText:'Restore',
    onConfirm:()=>{
      Store.snapshotToBackups('Before restoring snapshot');
      Store.restoreBackup(id);
      Toast.show('Restored.','ok'); render();
    }
  });
};
Views.addShop = function(){
  const name = val('newshop').trim();
  if(!name){ Toast.show('Enter a shop name.','err'); return; }
  const id = uid('shop');
  Store.data.shops.push({id,name,isWarehouse:false,active:true});
  Store.data.items.forEach(it=>{ it.locations[id]=0; it.shopPrices[id]=it.shopPrices.warehouse||0; });
  Store.save(); Toast.show('Shop added.','ok'); render();
};
