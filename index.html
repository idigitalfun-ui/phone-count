<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockLine — Multi-Shop Device Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430;
  --muted:#6B7686;
  --line:#DDE2E9;
  --bg:#ECEFF3;
  --card:#FFFFFF;
  --teal:#1D6F8C;
  --teal-dark:#154F63;
  --teal-light:#E6F1F5;
  --amber:#E2A33D;
  --amber-light:#FBF0DD;
  --red:#C1443C;
  --red-light:#FBEAE9;
  --green:#3E8E5A;
  --green-light:#E9F5EC;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 4px 12px rgba(27,36,48,.05);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:8px;}

/* LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:222px; flex-shrink:0; background:var(--ink); color:#DCE3EC;
  display:flex; flex-direction:column; padding:18px 12px;
}
#sidebar .brand{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#fff;
  padding:6px 10px 18px 10px; display:flex; align-items:center; gap:8px;
}
#sidebar .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--amber);display:inline-block;}
.navgroup{margin-bottom:14px;}
.navlabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7C8AA0;padding:8px 10px 4px;}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:#C7CFDD;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500;
  margin-bottom:2px; transition:background .12s;
}
.navbtn .ic{width:18px;text-align:center;opacity:.85;font-size:14px;}
.navbtn:hover{background:#26313F;color:#fff;}
.navbtn.active{background:var(--teal);color:#fff;}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  position:sticky; top:0; z-index:20;
}
#topbar h1{font-size:19px;margin:0;font-weight:600;}
#topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
#content{padding:22px 26px 60px;flex:1;}

/* COMPONENTS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.col{flex:1;min-width:0;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-card .n{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
.stat-card .l{color:var(--muted);font-size:12px;margin-top:2px;}
.stat-card.accent-teal{border-left:4px solid var(--teal);}
.stat-card.accent-amber{border-left:4px solid var(--amber);}
.stat-card.accent-red{border-left:4px solid var(--red);}
.stat-card.accent-green{border-left:4px solid var(--green);}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);
}
.btn:hover{background:#F5F7FA;}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn.primary:hover{background:var(--teal-dark);}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-light);}
.btn.ghost{border-color:transparent;background:none;}
.btn.ghost:hover{background:#F0F2F5;}
.btn.green{background:#E6F4EA;border-color:#34A853;color:#1E7E34;}
.btn.green:hover{background:#34A853;color:#fff;}
.btn.amber{background:#FEF7E0;border-color:#F9AB00;color:#A06000;}
.btn.amber:hover{background:#F9AB00;color:#fff;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.pill.teal{background:var(--teal-light);color:var(--teal-dark);}
.pill.amber{background:var(--amber-light);color:#8A5A16;}
.pill.red{background:var(--red-light);color:var(--red);}
.pill.green{background:var(--green-light);color:var(--green);}
.pill.gray{background:#EEF0F3;color:var(--muted);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;background:#F6F7F9;color:var(--muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid #EEF0F3;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{filter:brightness(0.97);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);}
.table-section-title{background:var(--teal);color:#fff;font-family:'Space Grotesk';font-weight:700;padding:8px 12px;font-size:14px;}
.table-total-row td{background:#FBF7EC;font-weight:700;border-bottom:2px solid var(--amber);}

/* Strict Column Alignment for Weekly Reports */
.weekly-table{width:100%;table-layout:fixed;border-collapse:collapse;border:1px solid #CBD5E1;font-size:12.5px;background:#fff;}
.weekly-table th{background:#FEF3C7;color:#92400E;border:1px solid #CBD5E1;padding:8px 6px;font-size:11px;font-weight:700;letter-spacing:.02em;text-align:center;text-transform:uppercase;white-space:normal;line-height:1.2;}
.weekly-table td{border:1px solid #E2E8F0;padding:7px 6px;text-align:center;vertical-align:middle;}
.weekly-table th:nth-child(1), .weekly-table td:nth-child(1){width:15%;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:11.5px;}
.weekly-table th:nth-child(2), .weekly-table td:nth-child(2){width:18%;text-align:left;}
.weekly-table th:nth-child(3), .weekly-table td:nth-child(3){width:11%;text-align:center;}
.weekly-table th:nth-child(4), .weekly-table td:nth-child(4){width:9%;text-align:center;}
.weekly-table th:nth-child(5), .weekly-table td:nth-child(5){width:11%;text-align:center;}
.weekly-table th:nth-child(6), .weekly-table td:nth-child(6){width:9%;text-align:center;}
.weekly-table th:nth-child(7), .weekly-table td:nth-child(7){width:8%;text-align:center;}
.weekly-table th:nth-child(8), .weekly-table td:nth-child(8){width:8%;text-align:center;}
.weekly-table th:nth-child(9), .weekly-table td:nth-child(9){width:11%;text-align:center;}
.weekly-table tr.table-total-row td{background:#FEF3C7;border-top:2px solid #F59E0B;border-bottom:2px solid #F59E0B;font-weight:bold;}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px;}

.signal{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle;}
.signal i{width:4px;display:block;border-radius:1px;background:#D8DEE6;}
.signal i:nth-child(1){height:4px;} .signal i:nth-child(2){height:7px;}
.signal i:nth-child(3){height:10px;} .signal i:nth-child(4){height:14px;}
.signal.s1 i:nth-child(1){background:var(--red);}
.signal.s2 i:nth-child(1),.signal.s2 i:nth-child(2){background:var(--amber);}
.signal.s3 i:nth-child(1),.signal.s3 i:nth-child(2),.signal.s3 i:nth-child(3){background:var(--teal);}
.signal.s4 i{background:var(--green);}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .spacer{flex:1;}
.search-input{position:relative;}
.search-input input{padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:220px;}
.search-input .ic{position:absolute;left:9px;top:8px;color:var(--muted);font-size:13px;}

.empty{padding:44px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,34,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-bg.show{display:flex;}
.drawer-bg{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;z-index:100;}
.drawer-bg.show{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow-y:auto;z-index:101;}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2;}
.drawer-head h3{margin:0 0 2px;font-size:16px;}
.drawer-body{padding:16px 20px 40px;}
.unit-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.unit-row .meta{font-size:12.5px;color:var(--muted);}
.unit-row .meta b{color:var(--ink);}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal.confirm .modal-body{color:var(--ink);}
.modal.confirm .icon{font-size:26px;margin-bottom:6px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:340px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-row .label{width:140px;flex-shrink:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .track{flex:1;background:#EEF1F4;border-radius:5px;height:16px;overflow:hidden;}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--teal),#2A93B9);border-radius:5px;}
.bar-row .val{width:34px;text-align:right;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);}

.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-select button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted);}
.chip-select button.active{background:var(--teal);border-color:var(--teal);color:#fff;}

.color-swatch{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);margin-right:4px;vertical-align:middle;}

.helpbox{background:var(--teal-light);border:1px solid #C8E2EA;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--teal-dark);margin-bottom:16px;}

@media print{
  @page {
    size: landscape;
    margin: 4mm 4mm 4mm 4mm;
  }
  #sidebar,#topbar,.no-print,button,.toolbar,details,details summary button{display:none !important;}
  body{background:#fff !important;margin:0 !important;padding:0 !important;color:#000 !important;font-size:7.5px !important;-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;}
  #main,#content{width:100% !important;padding:0 !important;margin:0 !important;}
  .weekly-print-grid{display:grid !important;grid-template-columns:repeat(2,1fr) !important;gap:4px !important;width:100% !important;}
  .card{box-shadow:none !important;border:1px solid #000 !important;margin-bottom:3px !important;break-inside:avoid !important;page-break-inside:avoid !important;padding:0 !important;}
  .table-section-title{background:#fff !important;color:#000 !important;font-size:9.5px !important;font-weight:900 !important;text-align:center !important;border-bottom:1.5px solid #000 !important;padding:1.5px 3px !important;}
  table{width:100% !important;table-layout:fixed !important;border-collapse:collapse !important;margin:0 !important;}
  th, td{border:1px solid #000 !important;padding:1.5px 2px !important;font-size:7px !important;line-height:1.1 !important;color:#000 !important;text-align:center !important;overflow:hidden !important;word-wrap:break-word !important;white-space:normal !important;}
  th:nth-child(1), td:nth-child(1){width:13%;font-size:6.5px;}
  th:nth-child(2), td:nth-child(2){width:20%;text-align:left !important;font-weight:bold;}
  th:nth-child(3), td:nth-child(3){width:10%;}
  th:nth-child(4), td:nth-child(4){width:9%;}
  th:nth-child(5), td:nth-child(5){width:10%;}
  th:nth-child(6), td:nth-child(6){width:9%;}
  th:nth-child(7), td:nth-child(7){width:8%;}
  th:nth-child(8), td:nth-child(8){width:8%;}
  th:nth-child(9), td:nth-child(9){width:13%;font-weight:bold;}
  thead th, thead tr.table-total-row td{background:#FFFF00 !important;color:#000 !important;font-weight:bold !important;}
  details{display:none !important;}
}
@media (max-width:900px){
  #sidebar{position:fixed;left:-230px;top:0;bottom:0;z-index:50;transition:left .2s;}
  #sidebar.open{left:0;}
  #main{width:100%;}
  .navlabel{display:block;}
}
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar"></nav>
  <div id="main">
    <div id="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="row" style="gap:8px;align-items:center;flex-wrap:wrap;">
        <div id="save_indicator" style="display:flex;align-items:center;gap:4px;font-size:12px;"></div>
        <button class="btn sm no-print" onclick="Views.showRecentActivity()" title="View recent actions and revert accidental sales, deposits, or faulty marks" style="border:1px solid var(--teal);color:var(--teal-dark);font-weight:600;">↩ Revert / Activity</button>
        <button class="btn sm no-print" onclick="FileStore.exportJson()" title="Download a backup JSON file right now">⬇ Export data</button>
        <button class="btn sm no-print" onclick="FileStore.importJson()" title="Load data from a JSON backup file">⬆ Import data</button>
        <button class="btn sm no-print" onclick="Modal.backupQuick()">💾 Quick backup</button>
        <button class="btn sm no-print" onclick="Router.go('backup')">⚙ Settings</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalRoot"></div></div>
<div class="drawer-bg" id="drawerBg" onclick="if(event.target===this)Drawer.close()"><div class="drawer" id="drawerRoot"></div></div>
<div class="toast-wrap" id="toastWrap"></div>

/* ---------- store ---------- */
const Store = {
  data:null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      this.data = raw ? JSON.parse(raw) : seedData();
    }catch(e){ this.data = seedData(); }
    try{
      this.migrate();
      if(this.data) localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
    }catch(err){
      console.error('Migration error:', err);
    }
  },
  migrate(){
    const d = this.data;
    if(!d) { this.data = seedData(); return; }
    if(!Array.isArray(d.shops)) d.shops = seedData().shops;
    if(!Array.isArray(d.categories)) d.categories = seedData().categories;
    if(!Array.isArray(d.items)) d.items = [];
    if(!Array.isArray(d.movements)) d.movements = [];
    else d.movements = d.movements.filter(m => {
      if(!m || !m.type) return false;
      if(!['stock-in','transfer-in','transfer-out','sold','faulty','deposit'].includes(m.type)) return false;
      const note = (m.note || '').toLowerCase();
      const from = (m.fromLocation || '').toLowerCase();
      if(note.includes('assigned imei') || note.includes('added from inventory') || note.includes('opening balance') || from.includes('opening balance')) return false;
      return true;
    });
    if(!d.archivedCategories) d.archivedCategories=[];
    if(!d.reorderList) d.reorderList=[];
    if(!d.reorderMeta) d.reorderMeta = { lastOrderDate: null };
    if(!d.meta) d.meta = { createdAt: todayISO() };
    if(!d.meta.shopPortals) d.meta.shopPortals = {};
    (d.shops||[]).forEach(s => {
      if(!d.meta.shopPortals[s.id]){
        d.meta.shopPortals[s.id] = {
          enabled: true,
          allowEditName: true,
          allowCostPrice: false,
          allowSalePrice: true,
          allowEditImei: true,
          allowVerify: true,
          allowAddDevice: true,
          allowEditActions: true
        };
      } else {
        if(d.meta.shopPortals[s.id].allowEditName === undefined) d.meta.shopPortals[s.id].allowEditName = true;
        if(d.meta.shopPortals[s.id].allowEditActions === undefined) d.meta.shopPortals[s.id].allowEditActions = true;
      }
    });
    // ensure Tullamore exists as a shop
    if(!d.shops.find(s=>s.id==='shop_tullamore')){
      d.shops.push({id:'shop_tullamore', name:'Tullamore', isWarehouse:false, active:true});
    }

/* ---------- File System Access API persistence ---------- */
const FileStore = {
  handle: null,      // FileSystemFileHandle — in-memory for this session
  _writing: false,
  _IDB_DB: 'stockline_fs',
  _IDB_STORE: 'handles',
  _IDB_KEY: 'dataFile',

  // Open (or create) the IndexedDB that stores the file handle across sessions
  _openIdb(){
    return new Promise((res, rej)=>{
      const req = indexedDB.open(this._IDB_DB, 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore(this._IDB_STORE);
      req.onsuccess = e => res(e.target.result);
      req.onerror = e => rej(e);
    });
  },
  async _saveHandleToIdb(handle){
    try{
      const db = await this._openIdb();
      const tx = db.transaction(this._IDB_STORE, 'readwrite');
      tx.objectStore(this._IDB_STORE).put(handle, this._IDB_KEY);
    }catch(e){}
  },
  async _loadHandleFromIdb(){
    try{
      const db = await this._openIdb();
      return await new Promise((res,rej)=>{
        const tx = db.transaction(this._IDB_STORE, 'readonly');
        const req = tx.objectStore(this._IDB_STORE).get(this._IDB_KEY);
        req.onsuccess = e => res(e.target.result||null);
        req.onerror = e => rej(e);
      });
    }catch(e){ return null; }
  },
  async _clearHandleFromIdb(){
    try{
      const db = await this._openIdb();
      const tx = db.transaction(this._IDB_STORE, 'readwrite');
      tx.objectStore(this._IDB_STORE).delete(this._IDB_KEY);
    }catch(e){}
  },

  // On app startup — try to restore saved file handle and read latest data from it
  async init(){
    if(!window.showOpenFilePicker){ updateSaveIndicator(); return; } // API not available
    const handle = await this._loadHandleFromIdb();
    if(!handle) { updateSaveIndicator(); return; }
    // Verify we still have permission
    try{
      const perm = await handle.queryPermission({mode:'readwrite'});
      if(perm === 'granted'){
        this.handle = handle;
        await this._readFromHandle(); // load latest data from file
        updateSaveIndicator();
        return;
      }
      // Permission not auto-granted — show a prompt to re-link
      updateSaveIndicator('needs-relink');
    }catch(e){ updateSaveIndicator(); }
  },

  // Read data from the linked file and merge into Store
  async _readFromHandle(){
    try{
      const file = await this.handle.getFile();
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(parsed && parsed.items && parsed.shops){
        // Only load if the file is newer than localStorage
        const fileTs = parsed.meta?.lastSaved || '0';
        const lsTs = Store.data?.meta?.lastSaved || '0';
        if(fileTs > lsTs){
          Store.data = parsed;
          Store.migrate();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
          Toast.show('✓ Data loaded from linked file (newer than local copy).','ok');
          render();
        }
      }
    }catch(e){}
  },

  // Write Store.data to the linked file (non-blocking)
  writeAsync(){
    if(!this.handle) return;
    if(this._writing) return; // skip if already writing
    this._writing = true;
    this.handle.createWritable()
      .then(w => w.write(JSON.stringify(Store.data, null, 2)).then(()=>w.close()))
      .catch(()=>{})
      .finally(()=>{ this._writing = false; });
  },

  // Let user pick/create a file to link to
  async linkFile(){
    if(!window.showSaveFilePicker){
      Toast.show('Your browser does not support automatic file saving. Use Export JSON instead.','err');
      return;
    }
    try{
      const handle = await window.showSaveFilePicker({
        suggestedName: 'phone_count_data.json',
        types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
      });
      // Check if existing file has data we should load
      try{
        const file = await handle.getFile();
        if(file.size > 10){
          const text = await file.text();
          const parsed = JSON.parse(text);
          if(parsed && parsed.items && confirm('This file has existing data. Load it into the app?')){
            Store.data = parsed;
            Store.migrate();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
            render();
          }
        }
      }catch(e){}
      this.handle = handle;
      await this._saveHandleToIdb(handle);
      await this.writeAsync(); // write current data immediately
      Toast.show('✓ Data file linked! Auto-saving to this file on every change.','ok');
      updateSaveIndicator();
    }catch(e){
      if(e.name!=='AbortError') Toast.show('Could not link file.','err');
    }
  },

  // Re-request permission for a previously linked file (after browser restart)
  async requestPermission(){
    if(!this.handle){ await this.linkFile(); return; }
    try{
      const perm = await this.handle.requestPermission({mode:'readwrite'});
      if(perm === 'granted'){
        await this._readFromHandle();
        updateSaveIndicator();
        Toast.show('✓ File re-linked. Auto-saving resumed.','ok');
      }
    }catch(e){}
  },

  // Unlink the file
  async unlink(){
    this.handle = null;
    await this._clearHandleFromIdb();
    updateSaveIndicator();
    Toast.show('File unlinked. Data still saved in browser localStorage.','ok');
  },

  // Manual export — always available as fallback
  exportJson(){
    const blob = new Blob([JSON.stringify(Store.data, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'phone_count_data_' + todayISO() + '.json';
    a.click();
    Toast.show('Data exported as JSON file.','ok');
  },

  // Manual import
  async importJson(){
    if(!window.showOpenFilePicker){
      // Fallback: hidden file input
      const inp = document.createElement('input');
      inp.type='file'; inp.accept='.json';
      inp.onchange = async()=>{
        const file = inp.files[0]; if(!file) return;
        const text = await file.text();
        try{
          const parsed = JSON.parse(text);
          if(!parsed.items || !parsed.shops){ Toast.show('Invalid data file.','err'); return; }
          if(!confirm('This will replace ALL current data with the imported file. Continue?')) return;
          Store.data = parsed; Store.migrate(); Store.save(); render();
          Toast.show('Data imported successfully!','ok');
        }catch(e){ Toast.show('Could not read file.','err'); }
      };
      inp.click();
      return;
    }
    try{
      const [handle] = await window.showOpenFilePicker({
        types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
      });
      const file = await handle.getFile();
      const text = await file.text();
      const parsed = JSON.parse(text);
      if(!parsed.items || !parsed.shops){ Toast.show('Invalid data file.','err'); return; }
      if(!confirm('This will replace ALL current data with the imported file. Continue?')) return;
      Store.data = parsed; Store.migrate(); Store.save();
      // Optionally link this file for future auto-saving
      if(confirm('Link this file for auto-saving going forward?')){
        const writeHandle = await window.showSaveFilePicker({
          suggestedName: file.name,
          types:[{description:'StockLine Data',accept:{'application/json':['.json']}}]
        });
        this.handle = writeHandle;
        await this._saveHandleToIdb(writeHandle);
        updateSaveIndicator();
      }
      render();
      Toast.show('Data imported successfully!','ok');
    }catch(e){
      if(e.name!=='AbortError') Toast.show('Could not load file.','err');
    }
  }
};

/* ---------- GitHub Cloud Auto-Save Engine ---------- */
const GITHUB_CONFIG_KEY = 'stockline_gh_config';

function utf8ToBase64(str) {
  try {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
  } catch(e) {
    return btoa(unescape(encodeURIComponent(str)));
  }
}
function base64ToUtf8(str) {
  try {
    return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  } catch(e) {
    return decodeURIComponent(escape(atob(str)));
  }
}

  _timer: null,
  _debounceTimer: null,

      });
      if(res.status === 200){
        const data = await res.json();
        this.saveConfig({ sha: data.sha, status: 'synced', lastError: null });
        return { ok: true, fileFound: true, sha: data.sha, message: `Connected! Found '${cfg.path}' (SHA: ${data.sha.slice(0,7)}).` };
      } else if(res.status === 404){
        const repoRes = await fetch(`https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}`, {
          headers: {
            'Authorization': `Bearer ${cfg.token.trim()}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        if(repoRes.ok){
          this.saveConfig({ sha: null, status: 'synced', lastError: null });
          return { ok: true, fileFound: false, message: `Connected to repository! '${cfg.path}' will be created on first sync.` };
        } else {
          return { ok: false, error: `Repository not accessible (${repoRes.status}). Check repository name and token permissions.` };
        }
      } else if(res.status === 401 || res.status === 403){
        const err = await res.json().catch(()=>({}));
        return { ok: false, error: `Authentication failed (${res.status}): ${err.message || 'Check your GitHub token permissions.'}` };
      } else {
        return { ok: false, error: `GitHub API error: ${res.statusText} (${res.status})` };

  async saveRemote(manual = false){
    // Commit any active in-progress input field before pushing to GitHub
    if(document.activeElement && typeof document.activeElement.blur === 'function'){
      document.activeElement.blur();
    }
    const cfg = this.getConfig();
    if(!cfg.token || !cfg.token.trim() || !cfg.owner || !cfg.repo) return;
    if(this._syncing) return;
    this._syncing = true;
    this.saveConfig({ status: 'syncing' });
    updateSaveIndicator();

    try {
      let currentSha = cfg.sha;
      const getUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}/contents/${encodeURIComponent(cfg.path.trim())}?ref=${encodeURIComponent(cfg.branch.trim()||'main')}&_t=${Date.now()}`;
      const getRes = await fetch(getUrl, {
        cache: 'no-store',
        headers: {
          'Authorization': `Bearer ${cfg.token.trim()}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        }
      });
      if(getRes.ok){
        const getData = await getRes.json();
        currentSha = getData.sha;
        
        // CHECK IF REMOTE FILE IS NEWER (e.g. edited by a shop portal or another device)
        if(getData.content && getData.sha !== cfg.sha){
          try{
            const remoteText = base64ToUtf8(getData.content.replace(/\s/g, ''));
            const remoteData = JSON.parse(remoteText);
            const remoteTs = remoteData?.meta?.lastSaved || '0';
            const localTs = Store.data?.meta?.lastSaved || '0';
            
            // If remote is newer, adopt remote data so we never overwrite live shop edits!
            if(remoteTs > localTs){
              Store.data = remoteData;
              Store.migrate();
              localStorage.setItem(STORAGE_KEY, JSON.stringify(Store.data));
              this.saveConfig({
                status: 'synced',
                sha: getData.sha,
                lastSync: new Date().toISOString(),
                lastError: null
              });
              if(manual) Toast.show('☁️ Cloud sync: Received latest store updates from GitHub.', 'ok');
              render();
              return;
            }
          }catch(err){
            console.error('Remote check error:', err);
          }
        }
      }

      const jsonStr = JSON.stringify(Store.data, null, 2);
      const base64Content = utf8ToBase64(jsonStr);
      const timeStr = new Date().toLocaleTimeString('en-IE');
      const body = {
        message: `Auto-save phone inventory data [${timeStr}]`,
        content: base64Content,
        branch: cfg.branch.trim() || 'main'
      };
      if(currentSha) body.sha = currentSha;

      const putUrl = `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}/contents/${encodeURIComponent(cfg.path.trim())}`;
      let putRes = await fetch(putUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${cfg.token.trim()}`,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
          'X-GitHub-Api-Version': '2022-11-28'
        },
        body: JSON.stringify(body)
      });

      // If SHA mismatch (409 Conflict), automatically re-fetch latest SHA and retry once
      if(putRes.status === 409){
        const retryGet = await fetch(getUrl, {
          cache: 'no-store',
          headers: {
            'Authorization': `Bearer ${cfg.token.trim()}`,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          }
        });
        if(retryGet.ok){
          const retryData = await retryGet.json();
          body.sha = retryData.sha;
          putRes = await fetch(putUrl, {
            method: 'PUT',
            headers: {
              'Authorization': `Bearer ${cfg.token.trim()}`,
              'Accept': 'application/vnd.github+json',
              'Content-Type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28'
            },
            body: JSON.stringify(body)
          });
        }
      }

      if(putRes.ok){
        const putData = await putRes.json();
        const newSha = putData.content?.sha || currentSha;
        this.saveConfig({
          status: 'synced',
          sha: newSha,
          lastSync: new Date().toISOString(),
          lastError: null
        });
        if(manual) Toast.show('Cloud sync complete: saved to GitHub.', 'ok');
      } else {
        const errJson = await putRes.json().catch(()=>({}));
        const msg = errJson.message || `GitHub error ${putRes.status}`;
        this.saveConfig({ status: 'error', lastError: msg });
        if(manual) Toast.show('GitHub sync failed: ' + msg, 'err');
      }
    } catch(err){
      this.saveConfig({ status: 'error', lastError: err.message });
      if(manual) Toast.show('GitHub sync network error: ' + err.message, 'err');
    } finally {
      this._syncing = false;
      updateSaveIndicator();
    }
  },

  async pullRemote(){
    const cfg = this.getConfig();
    if(!cfg.token || !cfg.token.trim()){
      Toast.show('Configure your GitHub token in Settings first.', 'err');
      return;
    }
    const url = `https://api.github.com/repos/${encodeURIComponent(cfg.owner.trim())}/${encodeURIComponent(cfg.repo.trim())}/contents/${encodeURIComponent(cfg.path.trim())}?ref=${encodeURIComponent(cfg.branch.trim()||'main')}`;
    try {
      const res = await fetch(url, {
        headers: {
          'Authorization': `Bearer ${cfg.token.trim()}`,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28'
        }
      });
      if(!res.ok){
        const err = await res.json().catch(()=>({}));
        Toast.show(`Could not pull from GitHub: ${err.message || res.statusText}`, 'err');
        return;
      }
      const data = await res.json();
      const content = base64ToUtf8(data.content.replace(/\s/g, ''));
      const parsed = JSON.parse(content);
      Modal.confirm({
        title: 'Replace local data with GitHub version?',
        body: `<p>Found <b>${esc(cfg.path)}</b> on GitHub (SHA: <code>${esc(data.sha.slice(0,7))}</code>).<br>This will update your local data. A backup snapshot of your current local data will be taken first.</p>`,
        confirmText: 'Pull from GitHub',
        onConfirm: () => {
          Store.snapshotToBackups('Before pulling from GitHub');
          Store.data = parsed;
          Store.migrate();
          Store.save();
          this.saveConfig({ sha: data.sha, lastSync: new Date().toISOString(), status: 'synced' });
          Toast.show('Data updated from GitHub successfully!', 'ok');
          render();
        }
      });
    } catch(e){
      Toast.show('Error pulling from GitHub: ' + e.message, 'err');
    }
  },

  triggerDebouncedSave(){
    const cfg = this.getConfig();
    if(!cfg.autoSync || !this.isConfigured()) return;
    if(this._debounceTimer) clearTimeout(this._debounceTimer);
    this._debounceTimer = setTimeout(() => {
      this.saveRemote(false);
    }, 10000);
  },

  startAutoSyncTimer(){
    if(this._timer) clearInterval(this._timer);
    const cfg = this.getConfig();

function render(){
  try{
    renderSidebar();
    const portalShopId = Router.getPortalShopId();
    if(portalShopId){
      Router.current = 'portal';
    }
    const [title,sub] = portalShopId 
      ? [`📍 ${shopName(portalShopId)} Store Portal`, 'Live store inventory verification and physical count session']
      : (TITLES[Router.current] || ['','']);
    const titleEl = document.getElementById('pageTitle');
    const subEl = document.getElementById('pageSub');
    if(titleEl) titleEl.textContent = title;
    if(subEl) subEl.textContent = sub;
    const c = document.getElementById('content');
    if(!c) return;

    // PRESERVE FOCUSED INPUT & CARET POSITION
    let focusInfo = null;
    const active = document.activeElement;
    if(active && c.contains(active)){
      if(active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT'){
        focusInfo = {
          id: active.id || null,
          placeholder: active.placeholder || null,
          className: active.className || null,
          tagName: active.tagName,
          selectionStart: (typeof active.selectionStart === 'number') ? active.selectionStart : null,
          selectionEnd: (typeof active.selectionEnd === 'number') ? active.selectionEnd : null
        };
      }
    }

    const fns = {
      dashboard: Views.dashboard, inventory: Views.inventory, stockin: Views.stockin,
      transfer: Views.stockview, sales: Views.stockview, weekly: Views.weekly,
      history: Views.history, stockview: Views.stockview, bestsellers: Views.bestsellers,
      reorder: Views.reorder, shops: Views.shops, categories: Views.categories,
      portals: Views.portals, portal: () => Views.shopPortal(portalShopId), backup: Views.backup,
    };
    c.innerHTML = (fns[Router.current]||(()=>'<p>Not found</p>'))();
    if(Views.after && Views.after[Router.current]) Views.after[Router.current]();

    // RESTORE FOCUSED INPUT & CARET POSITION
    if(focusInfo){
      let target = null;
      if(focusInfo.id){
        target = document.getElementById(focusInfo.id);
      }
      if(!target && focusInfo.placeholder){
        target = c.querySelector(`${focusInfo.tagName.toLowerCase()}[placeholder="${CSS.escape(focusInfo.placeholder)}"]`);
      }
      if(!target && focusInfo.className){
        target = c.querySelector(`${focusInfo.tagName.toLowerCase()}.${focusInfo.className.trim().split(/\s+/).join('.')}`);
      }
      if(target){
        target.focus();
        if(focusInfo.selectionStart !== null && focusInfo.selectionEnd !== null && typeof target.setSelectionRange === 'function'){
          try {
            target.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
          } catch(e){}
        }
      }
    }
  }catch(e){
    console.error('Render error:', e);
    const c = document.getElementById('content');
    if(c){
      c.innerHTML = `<div class="card card-pad" style="margin:20px;border-left:4px solid var(--red);"><h3>Could not render view</h3><p style="color:var(--muted);">${esc(e.message)}</p><button class="btn primary" onclick="Router.go('dashboard')">Reload Dashboard</button></div>`;
    }
  }
}

function deviceSortRank(name) {
  if(!name) return 999999;
  const n = String(name).trim().toLowerCase();
  
  if(n.includes('iphone')) {
    if(n.includes('iphone 6s plus')) return 6.6;
    if(n.includes('iphone 6s')) return 6.5;
    if(n.includes('iphone 6 plus')) return 6.2;
    if(n.includes('iphone 6')) return 6.0;
    if(n.includes('iphone 7 plus')) return 7.5;
    if(n.includes('iphone 7')) return 7.0;
    if(n.includes('iphone 8 plus') || n.includes('iphone 8+')) return 8.5;
    if(n.includes('iphone 8')) return 8.0;
    if(n.includes('iphone se 2020') || n.includes('iphone se 2nd') || n.includes('iphone se (2020)')) return 8.8;
    if(n.includes('iphone se 2022') || n.includes('iphone se 3rd') || n.includes('iphone se (2022)') || n.includes('iphone se 3')) return 8.9;
    if(n.includes('iphone se')) return 8.7;
    if(n.includes('iphone xr')) return 10.2;
    if(n.includes('iphone xs max')) return 10.6;
    if(n.includes('iphone xs')) return 10.4;
    if(n.includes('iphone x')) return 10.0;

    const m = n.match(/iphone\s+(\d+)(\s+mini|\s+plus|\s+pro\s+max|\s+pro)?/i);
    if(m) {
      const gen = parseInt(m[1]);
      const variant = (m[2]||'').trim().toLowerCase();
      let sub = 0.2;
      if(variant === 'mini') sub = 0.1;
      else if(variant === '') sub = 0.2;
      else if(variant === 'plus') sub = 0.3;
      else if(variant === 'pro') sub = 0.4;
      else if(variant === 'pro max') sub = 0.5;
      return gen * 10 + sub;
    }
  }
  return null;
}

function compareDeviceNames(a, b) {
  const nameA = (a?.name || a || '').trim();
  const nameB = (b?.name || b || '').trim();
  
  const rankA = deviceSortRank(nameA);
  const rankB = deviceSortRank(nameB);
  
  let cmp = 0;
  if(rankA !== null && rankB !== null) {
    if(rankA !== rankB) cmp = rankA - rankB;
  } else if(rankA !== null) {
    cmp = -1;
  } else if(rankB !== null) {
    cmp = 1;
  } else {
    cmp = nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
  }

  if(cmp !== 0) return cmp;

  const memVal = (m) => {
    if(!m) return 0;
    const str = String(m).toLowerCase().trim();
    const dual = str.match(/(\d+)\s*(?:gb|mb)?\s*\/\s*(\d+)\s*(gb|tb|mb)?/i);
    if(dual){
      const ram = parseInt(dual[1]) || 0;
      let storage = parseInt(dual[2]) || 0;
      if((dual[3]||'').includes('tb')) storage *= 1024;
      return storage * 1000 + ram;
    }
    const match = str.match(/(\d+)\s*(tb|gb|mb)?/i);
    if(match){
      let val = parseInt(match[1]) || 0;
      if((match[2]||'').includes('tb')) val *= 1024;
      return val * 1000;
    }
    return 0;
  };
  return memVal(a?.memory) - memVal(b?.memory);
}

function sortedItems(list){

    return compareDeviceNames(a, b);
  });
}

function isoAddDays(iso,days){
  const parts = String(iso).split('-').map(Number);
  const d = new Date(parts[0], parts[1]-1, parts[2] + days, 12, 0, 0);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2, '0');
  const dt = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dt}`;
}
function mostRecentMonday(){
  const d = new Date();
  const day = d.getDay(); // 0 sun .. 6 sat
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2, '0');
  const dt = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dt}`;
}
function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(v=>{
    v = v==null?'':String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

const CsvImport = {

    const m = String(s).replace(/[€,\s]/g,'').match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;

  normCondition(c){

  classifyPrices(prices, defaults){
    const nums = prices.filter(p=>p!=null&&p>0).sort((a,b)=>a-b);
    if(!nums.length){
      const cost = defaults?.costPrice||0;
      return { cost, sale: defaults?.sellPrice||cost };
    }
    // Single price in sheet — if higher than known cost, treat as sale price
    if(nums.length===1 && defaults?.costPrice && nums[0]>defaults.costPrice*1.05){
      const cost=defaults.costPrice;
      return { cost, sale:nums[0] };
    }
    const cost = nums[0], sale = nums[nums.length-1];
    return { cost, sale: sale>cost?sale:(defaults?.sellPrice||sale) };
  },

  parseShopCsv(text, shopId){
    const out = [];
    const lines = text.split(/\r?\n/);
    let cat = 'Other';
    for(const line of lines){
      if(!line.trim()) continue;
      const cols = line.split(',').map(c=>c.trim());
      const lineLower = line.toLowerCase();
      if(lineLower.includes('iphone')) cat = 'iPhone';
      else if(lineLower.includes('samsung')) cat = 'Samsung';
      else if(lineLower.includes('ipad') || lineLower.includes('tablet')) cat = 'iPad & Tablets';
      else if(lineLower.includes('button') || lineLower.includes('nokia') || lineLower.includes('mobitel')) cat = 'Button Phones';
      else if(lineLower.includes('watch')) cat = 'Smart Watches';
      else if(lineLower.includes('mix phone') || lineLower.includes('other')) cat = 'Other Brands';
      else if(lineLower.includes('airpod') || lineLower.includes('gadget')) cat = 'Gadgets';

      if(/imei\s*number|current\s*availability|update\s*every|boxed\/new|storage.*colour/i.test(line)) continue;
      if(/date.*iphone|date.*samsung|model.*imei/i.test(line)) continue;
      if(/faulty|sold|transfer|out the back/i.test(line)) continue;

      let imei=null, model=null, condition='Used', prices=[], color='';
      if(shopId === 'warehouse'){
        if(cols.length >= 2){
          model = cols[0];
          imei = (cols[1]||'').replace(/[\s\-']/g,'');
          condition = cols[2] || 'New';
          if(cols[5]) { const p = this.parseEuro(cols[5]); if(p) prices.push(p); }
          if(cols[6]) { const p = this.parseEuro(cols[6]); if(p) prices.push(p); }
          if(cols[7]) { const p = this.parseEuro(cols[7]); if(p) prices.push(p); }
        }
      } else if(shopId === 'shop_thurles'){
        if(cols.length >= 4){
          model = cols[2];
          imei = (cols[3]||'').replace(/[\s\-']/g,'');
          condition = cols[4] || 'Used';
          if(cols[6]) { const p = this.parseEuro(cols[6]); if(p) prices.push(p); }
          if(cols[7]) { const p = this.parseEuro(cols[7]); if(p) prices.push(p); }
        }
      } else if(shopId === 'shop_tralee'){
        if(cols.length >= 4){
          const storage = (cols[1] && cols[1] !== '-') ? cols[1] : '';
          model = (cols[0] + ' ' + storage).trim();
          color = cols[2] || '';
          imei = (cols[3]||'').replace(/[\s\-']/g,'');
          condition = cols[4] || 'Used';
        }
      } else {
        if(cols.length >= 3){
          model = cols[1];
          imei = (cols[2]||'').replace(/[\s\-']/g,'');
          condition = cols[3] || 'Used';
          for(let i=4; i<cols.length; i++){
            const p = this.parseEuro(cols[i]);
            if(p) prices.push(p);
          }
        }
      }

      if(!imei || imei.length<8 || !model || /date/i.test(model) || model.toLowerCase()==='model') continue;
      out.push({ shopId, cat, model:model.trim(), imei, condition:this.normCondition(condition), color, prices });
    }
    return out;
  },
  catNameToId(name){
    const map={'iPhone':'iPhone','Samsung':'Samsung','Other Brands':'Other Brands','Button Phones':'Button Phones','iPad & Tablets':'iPad & Tablets','Gadgets':'Gadgets','Smart Watches':'Smart Watches'};
    const n=map[name]||name;
    let c=Store.data.categories.find(x=>x.name===n);
    if(!c){ c={id:uid('cat'),name:n}; Store.data.categories.push(c); }
    return c.id;
  },
  findItem(model, cat){
    const key=this.normKey(model);
    const items=Store.data.items;
    let it=items.find(i=>this.normKey(i.name)===key);
    if(it) return it;
    const scored=items.map(i=>{
      const ik=this.normKey(i.name);
      let score=0;
      if(ik.includes(key)||key.includes(ik)) score+=50;
      const words=key.match(/\d+[a-z]*/g)||[];
      words.forEach(w=>{ if(w.length>2&&ik.includes(w)) score+=10; });
      if(cat&&catName(i.category)===cat) score+=5;
      return {item:i,score};
    }).filter(x=>x.score>15).sort((a,b)=>b.score-a.score);
    return scored[0]?.item||null;
  },
  importUnits(rows, shopId){
    let added=0;
    rows.forEach(row=>{
      if(findUnitByImei(row.imei)) return;
      const loc=row.shopId||shopId;
      const existed=this.findItem(row.model, row.cat);
      let it=existed;
      const defaults = it ? { costPrice:it.costPrice, sellPrice:it.shopPrices[loc] } : null;
      const {cost,sale}=this.classifyPrices(row.prices, defaults);
      if(!it){
        it={ id:uid('item'), name:row.model, category:this.catNameToId(row.cat), memory:'', imei:'', condition:this.normCondition(row.condition),
          colors:row.color?[row.color]:[], batteryPct:null, costPrice:cost,
          shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
        activeShops().forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sale; });
        Store.data.items.push(it);
      } else {
        if(cost>0){ it.costPrice=cost; }
        if(sale>0) it.shopPrices[loc]=sale;
      }
      const unit={ id:uid('unit'), imei:row.imei, color:row.color||'', condition:this.normCondition(row.condition),
        location:loc, costPrice:cost||it.costPrice,
        sellPrice:sale||it.shopPrices[loc]||it.costPrice };
      if(!Array.isArray(it.units)) it.units=[];
      it.units.push(unit);
      // Only bump location count for brand-new items; existing RAW stock already counted these devices
      if(!existed) it.locations[loc]=(it.locations[loc]||0)+1;
      else if((it.locations[loc]||0) < it.units.filter(u=>u.location===loc).length)
        it.locations[loc] = it.units.filter(u=>u.location===loc).length;
      added++;
    });
    return added;
  },
  importText(shopId, text){
    const rows=this.parseShopCsv(text, shopId);
    return this.importUnits(rows, shopId);
  },
  async tryFetchAll(){
    let total=0;
    for(const [shopId,filename] of Object.entries(this.SHOP_FILES)){
      try{
        const r=await fetch(filename);
        if(r.ok) total+=this.importText(shopId, await r.text());
      }catch(e){}
    }
    if(total>0) Store.save();
    return total;
  },
  importFiles(fileList){
    const nameToShop={
      'warhouse phone count main.csv':'warehouse','thurles phone count.csv':'shop_thurles',
      'kilkenney phone count.csv':'shop_kilkenny','maynooth phone count.csv':'shop_maynooth',
      'mullingar phone count.csv':'shop_mullingar','tralee phone count.csv':'shop_tralee',
      'tullamore phone count.csv':'shop_tullamore',
    };
    let total=0, pending=fileList.length;
    return new Promise(resolve=>{
      if(!pending){ resolve(0); return; }
      [...fileList].forEach(file=>{
        const shopId=nameToShop[file.name.toLowerCase()];
        const reader=new FileReader();
        reader.onload=e=>{
          if(shopId) total+=CsvImport.importText(shopId, e.target.result);
          pending--;
          if(pending===0){ Store.data.meta.imeiImportedV2=true; Store.save(); resolve(total); }
        };
        reader.readAsText(file);
      });
    });
  }
};

function allUnitsWithImei(atLoc){
  const rows=[];
  (Store.data?.items||[]).forEach(it=>{
    if(!it) return;
    (it.units||[]).filter(u=>u&&u.imei&&(!atLoc||u.location===atLoc)).forEach(u=>rows.push({it,u}));
  });
  return rows.sort((a,b)=>(a.it?.name||'').localeCompare(b.it?.name||''));
}

const Stock = {
  addMovement(m){
    m.id = uid('mv'); m.date = m.date||todayISO();
    Store.data.movements.push(m);
  },
  stockIn(itemId, qty, date, note, location, supplier = '', invoice = ''){
    const it = itemById(itemId); if(!it||qty<=0) return;
    const loc = location || 'warehouse';
    it.locations[loc] = (it.locations[loc]||0) + qty;
    this.addMovement({
      type: 'stock-in',
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: loc,
      fromLocation: supplier || 'supplier',
      supplier: supplier || 'Supplier Stock In',
      invoice: invoice || '',
      qty,
      date: date || todayISO(),
      note: note || (invoice ? `Invoice #${invoice}` : (supplier ? `From ${supplier}` : 'Stock In'))
    });
    Store.save();
  },
  // Adds ONE individually-tracked unit (IMEI, colour, condition, its own price). IMEI may be blank.
  // logMovement is FALSE by default: adding phones/IMEIs in Inventory fixes the count without logging Stock In.
  // Only the Stock In tab sets logMovement = true.
  addUnit(itemId, loc, data, date, note, logMovement = false, supplier = '', invoice = ''){
    const it = itemById(itemId); if(!it) return null;
    if(!Array.isArray(it.units)) it.units=[];
    if(data.imei && findUnitByImei(data.imei)){ Toast.show('That IMEI is already in the system.','err'); return null; }
    const unit = {
      id: uid('unit'), imei:(data.imei||'').trim(), color:data.color||'', condition:data.condition||it.condition||'New',
      location: loc, costPrice: data.costPrice!=null?data.costPrice:it.costPrice, sellPrice: data.sellPrice!=null?data.sellPrice:((it.shopPrices&&it.shopPrices[loc])||it.costPrice),
      batteryPct: data.batteryPct!=null?data.batteryPct:null, dateAdded: date||todayISO()
    };
    it.units.push(unit);
    if(logMovement){
      it.locations[loc] = (it.locations[loc]||0) + 1;
      this.addMovement({
        type: 'stock-in',
        itemId,
        itemName: it.name,
        categoryId: it.category,
        location: loc,
        fromLocation: supplier || 'supplier',
        supplier: supplier || 'Supplier Stock In',
        invoice: invoice || '',
        qty: 1,
        date: date||todayISO(),
        unitData: { imei: unit.imei || '', color: unit.color, condition: unit.condition, costPrice: unit.costPrice },
        note: note || (invoice ? `Invoice #${invoice}` : (supplier ? `From ${supplier}` : (unit.imei ? `IMEI ${unit.imei}` : 'Stock In')))
      });
    } else {
      // Baseline / count adjustment: ensure locations count has at least this unit counted
      if((it.locations[loc]||0) < unitsAt(it, loc).length){
        it.locations[loc] = unitsAt(it, loc).length;
      }
    }
    if(unit.color && !it.colors.includes(unit.color)) it.colors.push(unit.color);
    Store.save();
    return unit;
  },
  transfer(itemId, toShopId, qty, date, note){
    // kept for backwards compatibility: warehouse -> shop
    return this.transferGeneric(itemId, 'warehouse', toShopId, qty, date, note);
  },
  transferGeneric(itemId, fromLoc, toLoc, qty, date, note){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if(fromLoc===toLoc){ Toast.show('Pick two different locations.','err'); return false; }
    if((it.locations[fromLoc]||0) < qty){ Toast.show(`Not enough stock at ${shopName(fromLoc)} for that transfer.`,'err'); return false; }
    it.locations[fromLoc] -= qty;
    it.locations[toLoc] = (it.locations[toLoc]||0) + qty;
    // if this fully-untracked bulk move happens to be the only stock and a tracked unit exists, leave units alone —
    // tracked units should be moved explicitly (by IMEI) so their record stays accurate.
    this.addMovement({type:'transfer-out', itemId, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty, date, note});
    this.addMovement({type:'transfer-in', itemId, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty, date, note});
    Store.save();
    return true;
  },
  // Move ONE specific tracked unit (by unitId) to a new location. Works with or without IMEI.
  transferUnit(itemId, unitId, toLoc, date, note){
    const it = itemById(itemId); if(!it) return false;
    const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return false;
    const fromLoc = unit.location;
    if(fromLoc===toLoc){ Toast.show('That device is already at '+shopName(toLoc)+'.','err'); return false; }
    it.locations[fromLoc] = Math.max(0,(it.locations[fromLoc]||0)-1);
    unit.location = toLoc;
    const trackedAtTo = (it.units||[]).filter(u=>u&&u.location===toLoc).length;
    it.locations[toLoc] = Math.max((it.locations[toLoc]||0)+1, trackedAtTo);
    const imeiLabel = unit.imei ? `IMEI ${unit.imei}` : `Device ID ${unit.id}`;
    this.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty:1, date:date||todayISO(), note:note||imeiLabel});
    this.addMovement({type:'transfer-in',  itemId:it.id, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty:1, date:date||todayISO(), note:note||imeiLabel});
    Store.save();
    return {item:it, unit};
  },
  // Move ONE specific tracked unit (found by IMEI) to a new location.
  transferUnitByImei(imei, toLoc, date, note){
    const found = findUnitByImei(imei);
    if(!found){ Toast.show('No device found with that IMEI.','err'); return false; }
    return this.transferUnit(found.item.id, found.unit.id, toLoc, date, note||('IMEI '+found.unit.imei));
  },
  // Remove ONE specific tracked unit from stock (sold / faulty / deposit).
  removeUnit(itemId, unitId, status, date, note){
    const it = itemById(itemId); if(!it) return false;
    const idx = (it.units||[]).findIndex(u=>u.id===unitId);
    if(idx<0) return false;
    const unit = it.units[idx];
    it.units.splice(idx,1);
    it.locations[unit.location] = Math.max(0,(it.locations[unit.location]||0)-1);
    const mv = {
      id: uid('mv'),
      type: status,
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: unit.location,
      qty: 1,
      date: date||todayISO(),
      note: note||('IMEI '+(unit.imei||'—')),
      sellPrice: unit.sellPrice,
      unitData: JSON.parse(JSON.stringify(unit))
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  // qty=1 convenience actions used by Shop Sales quick buttons — auto-consumes a tracked unit if one exists
  // at that location (so IMEI records stay accurate without the person having to pick one manually).
  sell(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'sold', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'sold', date, note); }
    it.locations[shopId] -= qty;
    const mv = {
      id: uid('mv'),
      type: 'sold',
      itemId,
      itemName: it.name,
      categoryId: it.category,
      location: shopId,
      qty,
      date: date||todayISO(),
      note: note||'Bulk sale'
    };
    this.addMovement(mv);
    Store.save();
    return mv;
  },
  faulty(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'faulty', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'faulty', date, note); }
    it.locations[shopId] -= qty;

      id: uid('mv'),
      type: 'faulty',

      itemName: it.name,

      location: shopId,
      qty,
      date: date||todayISO(),
      note: note||'Bulk faulty'

    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'deposit', date, note); }

      qty,

      note: note||'Bulk deposit'

    return mv;
  },
  sellUnit(itemId, unitId, date, note){ return this.removeUnit(itemId, unitId, 'sold', date, note); },
  faultyUnit(itemId, unitId, date, note){ return this.removeUnit(itemId, unitId, 'faulty', date, note); },
  depositUnit(itemId, unitId, date, note){ return this.removeUnit(itemId, unitId, 'deposit', date, note); },
  receiveFaultyInWarehouse(movementId){
    const mv = (Store.data.movements||[]).find(m=>m.id===movementId);
    if(!mv){ Toast.show('Record not found.','err'); return false; }
    mv.faultyStatus = 'received_warehouse';
    mv.warehouseReceivedDate = todayISO();
    if(mv.unitData){
      mv.unitData.location = 'warehouse';
      mv.unitData.faultyStatus = 'received_warehouse';
    }
    Store.save();
    Toast.show(`Faulty ${mv.itemName||'device'} marked as Received in Warehouse.`, 'ok');
    render();
    return true;
  },
  deleteMovement(movementId){
    const mIdx = Store.data.movements.findIndex(m=>m.id===movementId);
    if(mIdx < 0){ Toast.show('Activity record not found.','err'); return false; }
    const m = Store.data.movements[mIdx];
    const it = itemById(m.itemId);

    if(it){
      const qty = Math.abs(m.qty || 1);
      if(m.type === 'stock-in'){
        // If stock-in record is removed, decrease location count and remove tracked unit if present
        if(m.unitData && m.unitData.imei && Array.isArray(it.units)){
          const uIdx = it.units.findIndex(u => u.imei && u.imei.trim().toLowerCase() === m.unitData.imei.trim().toLowerCase());
          if(uIdx >= 0) it.units.splice(uIdx, 1);
        }
        if(it.locations && it.locations[m.location]){
          it.locations[m.location] = Math.max(0, (it.locations[m.location] || 0) - qty);
        }
      } else if(m.type === 'sold' || m.type === 'faulty' || m.type === 'deposit'){
        // If sold/faulty/deposit is removed, restore device to store stock
        if(it.locations){
          it.locations[m.location] = (it.locations[m.location] || 0) + qty;
        }
        if(m.unitData){
          if(!Array.isArray(it.units)) it.units = [];
          if(!it.units.some(u => u.id === m.unitData.id || (m.unitData.imei && u.imei === m.unitData.imei))){
            it.units.push(m.unitData);
          }
        }
      } else if(m.type === 'transfer-out' || m.type === 'transfer-in'){
        // Revert transfer between locations
        if(m.fromLocation && it.locations){
          it.locations[m.fromLocation] = (it.locations[m.fromLocation] || 0) + qty;
        }
        if(m.toLocation && it.locations && it.locations[m.toLocation]){
          it.locations[m.toLocation] = Math.max(0, (it.locations[m.toLocation] || 0) - qty);
        }
      }
    }

    Store.data.movements.splice(mIdx, 1);
    Store.save();
    return true;
  },
  revertMovement(movementId){
    return this.deleteMovement(movementId);
  },
  adjust(itemId, shopId, newQty, note){
    const it = itemById(itemId); if(!it) return;
    it.locations[shopId] = Math.max(0, Number(newQty)||0);
    Store.save();
  }
};

        ${activeShops().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn primary" style="background:#fff;color:var(--teal-dark);border:none;" onclick="Views.doScanTransfer()">⇄ Transfer</button>
    </div>

    <div class="toolbar" style="flex-wrap:wrap;gap:8px;">
      <div class="chip-select" style="flex-wrap:wrap;">${shopChips}</div>
      <div class="spacer"></div>
      <div class="search-input"><span class="ic">🔎</span><input id="inv_search_q" placeholder="Search name / IMEI…" value="${esc(f.q)}" oninput="Views._invFilter.q=this.value;render()"></div>
      <select onchange="Views._invFilter.cat=this.value;render()">
        <option value="all">All categories</option>
        ${Store.data.categories.map(c=>`<option value="${c.id}" ${f.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}

      <button class="btn sm ${Views._showBattery!==false?'teal':'ghost'}" onclick="Views._showBattery=!(Views._showBattery!==false);render();" title="Toggle Battery % display">🔋 Battery %: <b>${Views._showBattery!==false?'ON':'OFF'}</b></button>

Views.toggleUnitVerified = function(itemId, unitId){
  const it = itemById(itemId); if(!it) return;
  const u = (it.units||[]).find(x=>x.id===unitId); if(!u) return;
  u.verified = !u.verified;
  u.verifiedAt = u.verified ? todayISO() : null;
  Store.save();
  Toast.show(u.verified ? `IMEI ${u.imei||''} marked as Checked OK.` : 'IMEI verification cleared.', 'ok');
  render();
};

// Transfer by scanning/typing IMEI directly from the top bar
Views.doScanTransfer = function(){
  const imei = (document.getElementById('inv_scan_imei')?.value||'').trim();
  const toLoc = document.getElementById('inv_scan_to')?.value;
  if(!imei){ Toast.show('Enter or scan an IMEI first.','err'); return; }
  if(!toLoc){ Toast.show('Select a destination store.','err'); return; }
  const found = findUnitByImei(imei);
  if(!found){ Toast.show(`No device found with IMEI ${imei}.`,'err'); return; }
  const {item:it, unit:u} = found;
  if(u.location === toLoc){ Toast.show(`That device is already at ${shopName(toLoc)}.`,'err'); return; }
  const result = Stock.transferUnitByImei(imei, toLoc, todayISO(), 'Transferred by IMEI scan from Inventory');
  if(result) Toast.show(`✓ ${it.name} (IMEI ${imei}) moved to ${shopName(toLoc)}.`,'ok');
  render();
};

// Save IMEI typed/pasted directly on the inventory row — no modal needed
Views.saveInlineImei = function(itemId, unitId, rawVal){
  const imei = (rawVal||'').replace(/[\s\-]/g,'').trim();
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  if(imei && imei !== (unit.imei||'')){
    // Check for duplicate
    const existing = findUnitByImei(imei);
    if(existing && existing.unit.id !== unitId){
      Toast.show(`IMEI ${imei} already assigned to ${existing.item.name}.`,'err');
      // reset the input back to original
      const inp = document.getElementById('imei_inp_'+unitId);
      if(inp) inp.value = unit.imei||'';
      return;
    }
  }
  unit.imei = imei;
  Store.save();
  Toast.show(imei ? `IMEI ${imei} saved.` : 'IMEI cleared.','ok');
  render();
};

// Inline price setters from Inventory
Views.invSetCostPrice = function(itemId, unitId, v, showToast = true){
  const p = Number(v);
  if(isNaN(p)||p<0) return;
  const it = itemById(itemId); if(!it) return;
  it.costPrice = p;
  const u = (it.units||[]).find(x=>x.id===unitId);
  if(u) u.costPrice = p;
  // Sync to sibling units of this exact model with dummy/default cost
  (it.units||[]).forEach(x=>{ if(x.costPrice == null || x.costPrice <= 1) x.costPrice = p; });
  Store.save();
  if(showToast) Toast.show(`Cost price for ${it.name} saved (€${p.toFixed(2)}).`,'ok');
};
Views.invSetSalePrice = function(itemId, unitId, locId, v, showToast = true){
  const p = Number(v);
  if(isNaN(p)||p<0) return;
  const it = itemById(itemId); if(!it) return;
  if(!it.shopPrices) it.shopPrices = {};
  it.shopPrices[locId] = p;
  const u = (it.units||[]).find(x=>x.id===unitId);
  if(u) u.sellPrice = p;
  // Sync to sibling units at this exact location
  (it.units||[]).filter(x=>x.location===locId).forEach(x=>{ x.sellPrice = p; });
  Store.save();
  if(showToast) Toast.show(`Sale price for ${it.name} saved (€${p.toFixed(2)} at ${shopName(locId)}).`,'ok');
};
Views.invSetUntrackedCost = function(itemId, v, showToast = true){
  const p = Number(v);
  if(isNaN(p)||p<0) return;
  const it = itemById(itemId); if(!it) return;
  it.costPrice = p;
  (it.units||[]).forEach(u => { u.costPrice = p; });
  Store.save();
  if(showToast) Toast.show(`Cost price for ${it.name} saved (€${p.toFixed(2)}).`,'ok');
};
Views.invSetUntrackedSale = function(itemId, locId, v, showToast = true){
  const p = Number(v);
  if(isNaN(p)||p<0) return;
  const it = itemById(itemId); if(!it) return;
  if(!it.shopPrices) it.shopPrices = {};
  it.shopPrices[locId] = p;
  (it.units||[]).filter(u=>u.location===locId).forEach(u => { u.sellPrice = p; });
  Store.save();
  if(showToast) Toast.show(`Sale price for ${it.name} saved (€${p.toFixed(2)} at ${shopName(locId)}).`,'ok');
};

Views.saveInlineUntrackedImei = function(itemId, shopId, rawVal){
  const imei = (rawVal||'').replace(/[\s\-']/g,'').trim();
  if(!imei) return;
  const it = itemById(itemId); if(!it) return;
  const existing = findUnitByImei(imei);
  if(existing){ Toast.show(`IMEI ${imei} is already assigned to ${existing.item.name}.`,'err'); return; }
  if(!Array.isArray(it.units)) it.units = [];
  const newUnit = {
    id: uid('unit'),
    imei: imei,
    color: (it.colors&&it.colors[0]) || 'Black',
    condition: it.condition || 'New',
    batteryPct: it.batteryPct!=null?it.batteryPct:100,
    location: shopId,
    costPrice: it.costPrice || 0,
    wholesalePrice: it.wholesalePrice || 0,
    sellPrice: (it.shopPrices && it.shopPrices[shopId]) || it.costPrice || 0,
    addedAt: todayISO()
  };
  it.units.push(newUnit);
  if((it.locations[shopId]||0) < unitsAt(it, shopId).length){
    it.locations[shopId] = unitsAt(it, shopId).length;
  }
  Store.save();
  Toast.show(`✓ IMEI ${imei} assigned to ${it.name} at ${shopName(shopId)}.`,'ok');
  render();
};

Views.invSetUntrackedQty = function(itemId, locId, v){
  const q = parseInt(v);
  if(isNaN(q) || q < 0){ Toast.show('Enter a valid quantity (0 or greater).','err'); return; }
  const it = itemById(itemId); if(!it) return;
  if(!it.locations) it.locations = {};
  const trackedAtLoc = unitsAt(it, locId).length;
  it.locations[locId] = trackedAtLoc + q;
  Store.save();
  Toast.show(`Stock quantity for ${it.name} updated to ${it.locations[locId]} at ${shopName(locId)}.`, 'ok');
  render();
};

Views.doUntrackedTransfer = function(itemId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const toLoc = document.getElementById(`inv_untracked_to_${itemId}_${fromLoc}`)?.value;
  if(!toLoc || toLoc === fromLoc){ Toast.show('Pick a different destination store.','err'); return; }
  const untracked = untrackedQtyAt(it, fromLoc);
  if(untracked <= 0){ Toast.show(`No generic stock available at ${shopName(fromLoc)}.`, 'err'); return; }
  const ok = Stock.transferGeneric(itemId, fromLoc, toLoc, 1, todayISO(), 'Generic stock transfer from Inventory');
  if(ok){
    Toast.show(`1 unit of ${it.name} transferred: ${shopName(fromLoc)} → ${shopName(toLoc)}.`, 'ok');
    render();
  }
};

Views.invUntrackedAction = function(itemId, locId, kind){
  const it = itemById(itemId); if(!it) return;

  const colors = {sold:'var(--green)', faulty:'var(--red)', deposit:'#1967D2'};

        <button class="btn ghost sm" onclick="Modal.close()">✕</button>
      </div>
      <div class="modal-body">
        <div class="helpbox">
          Type: <b>Generic Product (No IMEI)</b><br>
          Location: <b>${esc(shopName(locId))}</b> · Stock available: <b>${untracked}</b>

        <div class="field-grid">

Views.confirmInvUntrackedAction = function(itemId, locId, kind){
  const it = itemById(itemId); if(!it) return;
  const date = val('iua_date') || todayISO();
  const price = parseFloat(val('iua_price')) || (it.shopPrices && it.shopPrices[locId]) || 0;
  const note = val('iua_note').trim() || (kind==='sold'?'Generic sold from Inventory':kind==='faulty'?'Generic faulty — from Inventory':'Generic deposit — from Inventory');

  if(it.locations[locId] <= 0){ Toast.show('No stock at that location.','err'); return; }
  it.locations[locId] = Math.max(0, it.locations[locId] - 1);

  const mv = {
    id: uid('mv'),
    type: kind,
    itemId,
    itemName: it.name,
    categoryId: it.category,
    location: locId,
    qty: 1,
    date: date,
    note: note,
    sellPrice: price
  };
  Stock.addMovement(mv);
  Store.save();
  Modal.close();

  const labels = {sold:'✓ Sold', faulty:'⚠ Marked faulty', deposit:'🔒 Deposit recorded'};
  Toast.show(`${labels[kind]}: ${it.name} at ${shopName(locId)}. <button class="btn sm" style="margin-left:8px;padding:2px 10px;font-size:11px;background:#fff;color:var(--ink);border:none;" onclick="Views.undoSale('${mv.id}')">↩ Undo</button>`, 'ok');
  render();
};

// Inline transfer of a tracked IMEI unit — reads the inline <select> for destination
Views.doInlineTransfer = function(itemId, unitId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const toLoc = document.getElementById('inv_to_'+unitId)?.value;
  if(!toLoc || toLoc===fromLoc){ Toast.show('Pick a different destination store.','err'); return; }

  const result = Stock.transferUnit(itemId, unitId, toLoc, todayISO(), `Transferred ${it.name} from ${shopName(fromLoc)} to ${shopName(toLoc)}`);
  if(result){
    Toast.show(`✓ ${it.name} ${unit.imei ? '(IMEI ' + unit.imei + ')' : ''} moved to ${shopName(toLoc)}.`, 'ok');
  }
  render();
};

Views.confirmInvUnitAction = function(itemId, unitId, kind){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const date = val('iua_date') || todayISO();
  const price = parseFloat(val('iua_price')) || unit.sellPrice || 0;
  const note = val('iua_note').trim() || (kind==='sold'?'Sold from Inventory':kind==='faulty'?'Faulty — from Inventory':'Deposit — from Inventory');
  if(price && kind==='sold') unit.sellPrice = price;
  const mv = Stock.removeUnit(itemId, unitId, kind, date, note);
  if(mv && mv.id){
    const labels = {sold:'✓ Sold',faulty:'⚠ Marked faulty',deposit:'🔒 Deposit recorded'};
    Toast.show(`${labels[kind]}: ${it.name} (IMEI ${unit.imei||'—'}). <button class="btn sm" style="margin-left:8px;padding:2px 10px;font-size:11px;background:#fff;color:var(--ink);border:none;" onclick="Views.undoSale('${mv.id}')">↩ Undo</button>`, 'ok');
  }
  Modal.close();
  render();
};

Views.doBulkInlineTransfer = function(itemId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const qtyEl = document.getElementById('inv_bqty_'+itemId+'_'+fromLoc);
  const toEl  = document.getElementById('inv_bto_'+itemId+'_'+fromLoc);
  const qty   = Number(qtyEl?.value)||0;
  const toLoc = toEl?.value;
  if(qty<=0){ Toast.show('Enter a quantity greater than 0.','err'); return; }
  if(!toLoc || toLoc===fromLoc){ Toast.show('Pick a different destination store.','err'); return; }
  const ok = Stock.transferGeneric(itemId, fromLoc, toLoc, qty, todayISO(), 'Bulk transfer from Inventory');
  if(ok) Toast.show(`${qty} unit(s) moved from ${shopName(fromLoc)} to ${shopName(toLoc)}.`,'ok');
  render();
};

Views.toggleAllExportCats = function(checked){
  document.querySelectorAll('.exp-cat-cb').forEach(cb => cb.checked = checked);
  Views.updateExportCountPreview();

Views.updateExportCountPreview = function(){
  const previewEl = document.getElementById('exp_preview_count');
  if(!previewEl) return;
  const shopId = document.getElementById('exp_shop')?.value || 'all';
  const checkedCats = Array.from(document.querySelectorAll('.exp-cat-cb:checked')).map(cb => cb.value);
  
  let count = 0;
  const catsWithItems = new Set();

  (Store.data.items || []).forEach(it => {
    if(!checkedCats.includes(it.category)) return;
    (it.units || []).forEach(u => {
      if(shopId === 'all' || u.location === shopId){
        count++;
        catsWithItems.add(it.category);
      }
    });
  });

  const shopNameStr = shopId === 'all' ? 'All Stores & Warehouse' : shopName(shopId);
  previewEl.innerHTML = `📋 <b>${count} device(s)</b> ready to export for <b>${esc(shopNameStr)}</b> across <b>${catsWithItems.size}</b> category section(s).`;
};

Views.generateInventoryPdf = function(){
  const shopId = document.getElementById('exp_shop')?.value || 'all';
  const checkedCats = Array.from(document.querySelectorAll('.exp-cat-cb:checked')).map(cb => cb.value);
  
  const incImei = !!document.getElementById('exp_col_imei')?.checked;
  const incColor = !!document.getElementById('exp_col_color')?.checked;
  const incCond = !!document.getElementById('exp_col_cond')?.checked;
  const incBatt = !!document.getElementById('exp_col_batt')?.checked;
  const incSale = !!document.getElementById('exp_col_sale')?.checked;
  const incCost = !!document.getElementById('exp_col_cost')?.checked;
  const incCheckbox = !!document.getElementById('exp_col_checkbox')?.checked;
  const groupCats = !!document.getElementById('exp_group_cats')?.checked;
  const incSignoff = !!document.getElementById('exp_signoff')?.checked;

  const shopNameStr = shopId === 'all' ? 'All Stores & Warehouse' : shopName(shopId);
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

  // Gather devices grouped by category
  const categories = (Store.data.categories || []).filter(c => checkedCats.includes(c.id));
  const categoryData = [];
  let totalDevicesCount = 0;

  categories.forEach(c => {
    const list = [];
    (Store.data.items || []).forEach(it => {
      if(it.category !== c.id) return;
      (it.units || []).forEach(u => {
        if(shopId === 'all' || u.location === shopId){
          list.push({ item: it, unit: u });
          totalDevicesCount++;
        }
      });
    });
    if(list.length > 0){
      list.sort((a, b) => (a.item.name + (a.item.memory||'')).localeCompare(b.item.name + (b.item.memory||'')));
      categoryData.push({ category: c, devices: list });
    }
  });

  if(totalDevicesCount === 0){
    Toast.show('No devices found matching the selected store and categories.', 'err');
    return;
  }

  // Build table columns
  let headersHtml = '<th>#</th><th>Device Model & Spec</th>';
  if(incImei) headersHtml += '<th>IMEI / Serial</th>';
  if(incColor) headersHtml += '<th>Colour</th>';
  if(incCond) headersHtml += '<th>Condition</th>';
  if(incBatt) headersHtml += '<th>Battery</th>';
  if(shopId === 'all') headersHtml += '<th>Store</th>';
  if(incCost) headersHtml += '<th>Cost Price</th>';
  if(incSale) headersHtml += '<th>Sale Price</th>';
  if(incCheckbox) headersHtml += '<th style="width:70px;text-align:center;">Checked</th>';

  let tablesHtml = '';

  if(groupCats){
    categoryData.forEach(cd => {
      let rowIdx = 1;
      let rowsHtml = cd.devices.map(({item: it, unit: u}) => {
        let r = `<tr>
          <td style="text-align:center;color:#64748B;font-size:11px;">${rowIdx++}</td>
          <td><b>${esc(it.name)}</b> ${it.memory ? `<span style="color:#475569;font-size:11px;">${esc(it.memory)}</span>` : ''}</td>`;
        if(incImei) r += `<td class="mono font-bold">${esc(u.imei || '(No IMEI)')}</td>`;
        if(incColor) r += `<td>${esc(u.color || '-')}</td>`;
        if(incCond) r += `<td>${esc(u.condition || 'Used')}</td>`;
        if(incBatt) r += `<td>${u.batteryPct != null ? u.batteryPct + '%' : '-'}</td>`;
        if(shopId === 'all') r += `<td>${esc(shopName(u.location))}</td>`;
        if(incCost) r += `<td style="text-align:right;">${euro(u.costPrice != null ? u.costPrice : it.costPrice)}</td>`;
        if(incSale) r += `<td style="text-align:right;font-weight:600;">${euro(u.sellPrice != null ? u.sellPrice : (it.shopPrices && it.shopPrices[u.location]) || 0)}</td>`;
        if(incCheckbox) r += `<td style="text-align:center;font-size:16px;">☐</td>`;
        r += `</tr>`;
        return r;
      }).join('');

      tablesHtml += `
        <div class="cat-section">
          <div class="cat-header">
            <span>📁 ${esc(cd.category.name)}</span>
            <span class="cat-count">${cd.devices.length} Unit${cd.devices.length===1?'':'s'}</span>

          <table>
            <thead><tr>${headersHtml}</tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      `;
    });
  } else {
    let rowIdx = 1;
    let rowsHtml = '';
    categoryData.forEach(cd => {
      cd.devices.forEach(({item: it, unit: u}) => {
        let r = `<tr>
          <td style="text-align:center;color:#64748B;font-size:11px;">${rowIdx++}</td>

        if(incSale) r += `<td style="text-align:right;font-weight:600;">${euro(u.sellPrice != null ? u.sellPrice : (it.shopPrices && it.shopPrices[u.location]) || 0)}</td>`;
        if(incCheckbox) r += `<td style="text-align:center;font-size:16px;">☐</td>`;
        r += `</tr>`;
        rowsHtml += r;
      });
    });

    tablesHtml += `
      <div class="cat-section">
        <table>
          <thead><tr>${headersHtml}</tr></thead>
          <tbody>${rowsHtml}</tbody>

  }

  const signoffHtml = incSignoff ? `

      <div style="font-weight:700;font-size:12px;margin-bottom:8px;color:#1E293B;text-transform:uppercase;letter-spacing:0.5px;">Physical Count & Stock Audit Confirmation</div>

        <div><b>Manager Signature:</b> ___________________________</div>
      </div>
    </div>

  const docHtml = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>StockLine Audit - ${esc(shopNameStr)} (${dateStr})</title>
  <style>
    @page { size: A4 portrait; margin: 10mm 10mm 12mm 10mm; }
