<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockLine — Multi-Shop Device Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430;
  --muted:#6B7686;
  --line:#DDE2E9;
  --bg:#ECEFF3;
  --card:#FFFFFF;
  --teal:#1D6F8C;
  --teal-dark:#154F63;
  --teal-light:#E6F1F5;
  --amber:#E2A33D;
  --amber-light:#FBF0DD;
  --red:#C1443C;
  --red-light:#FBEAE9;
  --green:#3E8E5A;
  --green-light:#E9F5EC;
  --radius:10px;
  --shadow:0 1px 2px rgba(27,36,48,.06), 0 4px 12px rgba(27,36,48,.05);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Inter',sans-serif; font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#C7CEDA;border-radius:8px;}

/* LAYOUT */
#app{display:flex;min-height:100vh;}
#sidebar{
  width:222px; flex-shrink:0; background:var(--ink); color:#DCE3EC;
  display:flex; flex-direction:column; padding:18px 12px;
}
#sidebar .brand{
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:19px; color:#fff;
  padding:6px 10px 18px 10px; display:flex; align-items:center; gap:8px;
}
#sidebar .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--amber);display:inline-block;}
.navgroup{margin-bottom:14px;}
.navlabel{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7C8AA0;padding:8px 10px 4px;}
.navbtn{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:none;color:#C7CFDD;padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:500;
  margin-bottom:2px; transition:background .12s;
}
.navbtn .ic{width:18px;text-align:center;opacity:.85;font-size:14px;}
.navbtn:hover{background:#26313F;color:#fff;}
.navbtn.active{background:var(--teal);color:#fff;}
#main{flex:1;min-width:0;display:flex;flex-direction:column;}
#topbar{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  position:sticky; top:0; z-index:20;
}
#topbar h1{font-size:19px;margin:0;font-weight:600;}
#topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
#content{padding:22px 26px 60px;flex:1;}

/* COMPONENTS */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:18px 20px;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.col{flex:1;min-width:0;}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);}
.stat-card .n{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;}
.stat-card .l{color:var(--muted);font-size:12px;margin-top:2px;}
.stat-card.accent-teal{border-left:4px solid var(--teal);}
.stat-card.accent-amber{border-left:4px solid var(--amber);}
.stat-card.accent-red{border-left:4px solid var(--red);}
.stat-card.accent-green{border-left:4px solid var(--green);}

.btn{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink);
}
.btn:hover{background:#F5F7FA;}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;}
.btn.primary:hover{background:var(--teal-dark);}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red-light);}
.btn.ghost{border-color:transparent;background:none;}
.btn.ghost:hover{background:#F0F2F5;}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;}
.pill.teal{background:var(--teal-light);color:var(--teal-dark);}
.pill.amber{background:var(--amber-light);color:#8A5A16;}
.pill.red{background:var(--red-light);color:var(--red);}
.pill.green{background:var(--green-light);color:var(--green);}
.pill.gray{background:#EEF0F3;color:var(--muted);}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{
  text-align:left;background:#F6F7F9;color:var(--muted);font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:9px 10px;border-bottom:1px solid #EEF0F3;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FAFBFC;}
.table-wrap{overflow-x:auto;border-radius:var(--radius);}
.table-section-title{background:var(--teal);color:#fff;font-family:'Space Grotesk';font-weight:700;padding:8px 12px;font-size:14px;}
.table-total-row td{background:#FBF7EC;font-weight:700;border-bottom:2px solid var(--amber);}

.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;background:#fff;color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 14px;}

.signal{display:inline-flex;align-items:flex-end;gap:2px;height:14px;vertical-align:middle;}
.signal i{width:4px;display:block;border-radius:1px;background:#D8DEE6;}
.signal i:nth-child(1){height:4px;} .signal i:nth-child(2){height:7px;}
.signal i:nth-child(3){height:10px;} .signal i:nth-child(4){height:14px;}
.signal.s1 i:nth-child(1){background:var(--red);}
.signal.s2 i:nth-child(1),.signal.s2 i:nth-child(2){background:var(--amber);}
.signal.s3 i:nth-child(1),.signal.s3 i:nth-child(2),.signal.s3 i:nth-child(3){background:var(--teal);}
.signal.s4 i{background:var(--green);}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
.toolbar .spacer{flex:1;}
.search-input{position:relative;}
.search-input input{padding:8px 10px 8px 30px;border:1px solid var(--line);border-radius:7px;font-size:13px;min-width:220px;}
.search-input .ic{position:absolute;left:9px;top:8px;color:var(--muted);font-size:13px;}

.empty{padding:44px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:4px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(20,26,34,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-bg.show{display:flex;}
.drawer-bg{position:fixed;inset:0;background:rgba(20,26,34,.45);display:none;z-index:100;}
.drawer-bg.show{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:92vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.18);overflow-y:auto;z-index:101;}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;position:sticky;top:0;background:#fff;z-index:2;}
.drawer-head h3{margin:0 0 2px;font-size:16px;}
.drawer-body{padding:16px 20px 40px;}
.unit-row{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.unit-row .meta{font-size:12.5px;color:var(--muted);}
.unit-row .meta b{color:var(--ink);}
.modal{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-size:16px;}
.modal-body{padding:18px 20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}
.modal.confirm .modal-body{color:var(--ink);}
.modal.confirm .icon{font-size:26px;margin-bottom:6px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:340px;}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-row .label{width:140px;flex-shrink:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-row .track{flex:1;background:#EEF1F4;border-radius:5px;height:16px;overflow:hidden;}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--teal),#2A93B9);border-radius:5px;}
.bar-row .val{width:34px;text-align:right;font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);}

.chip-select{display:flex;gap:6px;flex-wrap:wrap;}
.chip-select button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--muted);}
.chip-select button.active{background:var(--teal);border-color:var(--teal);color:#fff;}

.color-swatch{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.15);margin-right:4px;vertical-align:middle;}

.helpbox{background:var(--teal-light);border:1px solid #C8E2EA;border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--teal-dark);margin-bottom:16px;}

@media print{
  #sidebar,#topbar,.no-print{display:none !important;}
  body{background:#fff;}
  #content{padding:0;}
  .card{box-shadow:none;border:1px solid #999;}
}
@media (max-width:900px){
  #sidebar{position:fixed;left:-230px;top:0;bottom:0;z-index:50;transition:left .2s;}
  #sidebar.open{left:0;}
  #main{width:100%;}
  .navlabel{display:block;}
}
</style>
</head>

<div id="app">
  <nav id="sidebar"></nav>

    <div id="topbar">

      </div>
      <div class="row" style="gap:10px;align-items:center;">
        <button class="btn sm no-print" onclick="Modal.backupQuick()">💾 Quick backup</button>

      </div>
    </div>
    <div id="content"></div>

</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalRoot"></div></div>

    });
  });
  return {
    shops, categories, archivedCategories:[], items, movements,
    reorderList:[], meta:{createdAt:todayISO()}
  };

/* ---------- store ---------- */
const Store = {
  data:null,
  load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      this.data = raw ? JSON.parse(raw) : seedData();
    }catch(e){ this.data = seedData(); }
    this.migrate();
  },
  migrate(){
    const d = this.data;
    if(!d.archivedCategories) d.archivedCategories=[];
    if(!d.reorderList) d.reorderList=[];
    if(!d.reorderMeta) d.reorderMeta = { lastOrderDate: null };
    if(!d.meta) d.meta = { createdAt: todayISO() };
    // ensure Tullamore exists as a shop
    if(!d.shops.find(s=>s.id==='shop_tullamore')){
      d.shops.push({id:'shop_tullamore', name:'Tullamore', isWarehouse:false, active:true});
    }
    // ensure Kilkenney spelling
    const kilk = d.shops.find(s=>s.id==='shop_kilkenny' || s.name==='Kilkenny');
    if(kilk) kilk.name = 'Kilkenney';
    // de-duplicate shops that share a name (e.g. one added manually before, one added by a later update) —
    // keep the first, fold any stock from the duplicate into it, drop the duplicate.
    {
      const seenByName = {};
      const keep = [];
      d.shops.forEach(s=>{
        const key = s.name.trim().toLowerCase();
        if(!seenByName[key]){ seenByName[key]=s; keep.push(s); return; }
        const primary = seenByName[key];
        d.items.forEach(it=>{
          const extra = it.locations[s.id]||0;
          if(extra>0) it.locations[primary.id] = (it.locations[primary.id]||0)+extra;
          (it.units||[]).forEach(u=>{ if(u.location===s.id) u.location = primary.id; });
          delete it.locations[s.id];
          delete it.shopPrices[s.id];
        });
        d.movements.forEach(m=>{
          if(m.location===s.id) m.location = primary.id;
          if(m.toLocation===s.id) m.toLocation = primary.id;
          if(m.fromLocation===s.id) m.fromLocation = primary.id;
        });
      });
      d.shops = keep;
    }
    // backfill every item: units[] array, and a locations/shopPrices slot for every shop (incl. any newly added one)
    d.items.forEach(it=>{
      if(!Array.isArray(it.units)) it.units = [];
      if(it.wholesalePrice==null) it.wholesalePrice = it.costPrice||0;
      d.shops.forEach(s=>{
        if(it.locations[s.id]==null) it.locations[s.id]=0;
        if(it.shopPrices[s.id]==null) it.shopPrices[s.id]=it.shopPrices.warehouse||it.costPrice||0;
      });
      // backfill wholesalePrice on tracked units too
      (it.units||[]).forEach(u=>{
        if(u.wholesalePrice==null) u.wholesalePrice = u.costPrice||it.wholesalePrice||0;
      });
    });
    // import IMEIs from shop CSV files once (fetch from same folder, or via Settings import)
    if(!d.meta.imeiImportedV2){
      CsvImport.tryFetchAll().then(n=>{
        if(n>0){ d.meta.imeiImportedV2=true; Store.save(); render(); Toast.show(`Loaded ${n} device(s) with IMEI from shop CSV files.`,'ok'); }
      });
    }
    this.save();
  },
  save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data)); },
  snapshotToBackups(label){
    try{
      const list = JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]');
      list.unshift({id:uid('bak'), label:label||'Backup', at:new Date().toISOString(), data:JSON.parse(JSON.stringify(this.data))});
      while(list.length>15) list.pop();
      localStorage.setItem(BACKUP_KEY, JSON.stringify(list));
    }catch(e){}
  },
  getBackups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)||'[]'); }catch(e){ return []; } },
  restoreBackup(id){
    const list = this.getBackups();
    const b = list.find(x=>x.id===id);
    if(!b) return false;
    this.data = JSON.parse(JSON.stringify(b.data));
    this.save();
    return true;
  }
};

/* ---------- toast ---------- */
const Toast = {
  show(msg, type){
    const wrap = document.getElementById('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast' + (type?(' '+type):'');
    el.textContent = msg;
    wrap.appendChild(el);
    setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
  }
};

function shopName(id){ const s=Store.data.shops.find(x=>x.id===id); return s?s.name:id; }
function catName(id){ const c=Store.data.categories.find(x=>x.id===id); return c?c.name:'—'; }
function itemById(id){ return Store.data.items.find(x=>x.id===id); }
function totalQty(item){ return Object.values(item.locations).reduce((a,b)=>a+(Number(b)||0),0); }
function unitsAt(item, loc){ return (item.units||[]).filter(u=>u.location===loc); }
function untrackedQtyAt(item, loc){ return Math.max(0, (item.locations[loc]||0) - unitsAt(item, loc).length); }
function findUnitByImei(imei){
  imei = (imei||'').trim().toLowerCase();
  if(!imei) return null;
  for(const it of Store.data.items){
    const u = (it.units||[]).find(x=>(x.imei||'').trim().toLowerCase()===imei);
    if(u) return {item:it, unit:u};
  }
  return null;
}
function nonWarehouseShops(){ return Store.data.shops.filter(s=>!s.isWarehouse && s.active!==false); }
function activeShops(){ return Store.data.shops.filter(s=>s.active!==false); }
function categoryOrderIndex(catId){ const i = Store.data.categories.findIndex(c=>c.id===catId); return i<0?999:i; }
function sortedItems(list){
  return (list||Store.data.items).slice().sort((a,b)=>{
    const ci = categoryOrderIndex(a.category) - categoryOrderIndex(b.category);
    if(ci!==0) return ci;
    return a.name.localeCompare(b.name);
  });
}
function groupByCategory(list){
  const groups = {};
  Store.data.categories.forEach(c=>groups[c.id]=[]);
  (list||Store.data.items).forEach(it=>{ (groups[it.category]||(groups[it.category]=[])).push(it); });
  return Store.data.categories.map(c=>({cat:c, items:(groups[c.id]||[]).slice().sort((a,b)=>a.name.localeCompare(b.name))})).filter(g=>g.items.length);
}
function signalClass(q){ if(q<=0) return 's0'; if(q<=2) return 's1'; if(q<=5) return 's2'; if(q<=10) return 's3'; return 's4'; }
function signalHtml(q){
  return `<span class="signal ${signalClass(q)}" title="${q} in stock"><i></i><i></i><i></i><i></i></span>`;
}
function weekLabel(startISO,endISO){ return `${startISO} – ${endISO}`; }
function isoAddDays(iso,days){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); }
function mostRecentMonday(){
  const d = new Date();
  const day = d.getDay(); // 0 sun .. 6 sat
  const diff = (day===0? -6 : 1-day);
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function csvDownload(filename, rows){
  const csv = rows.map(r=>r.map(v=>{
    v = v==null?'':String(v);
    if(/[",\n]/.test(v)) v = '"'+v.replace(/"/g,'""')+'"';
    return v;
  }).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- CSV IMEI import (reads your shop count spreadsheets) ---------- */
const CsvImport = {
  SHOP_FILES: {
    warehouse:'Warhouse Phone Count Main.csv',
    shop_thurles:'Thurles Phone Count.csv',
    shop_kilkenny:'Kilkenney Phone Count.csv',
    shop_maynooth:'Maynooth Phone Count.csv',
    shop_mullingar:'Mullingar Phone Count.csv',
    shop_tralee:'Tralee Phone Count.csv',
    shop_tullamore:'Tullamore Phone Count.csv',
  },
  parseEuro(s){
    if(s==null||!String(s).trim()) return null;
    const m = String(s).replace(/[€,\s]/g,'').match(/[\d.]+/);
    return m ? parseFloat(m[0]) : null;
  },
  normKey(s){
    return String(s||'').toLowerCase().replace(/grade\s*['"]?[a-z]/gi,'').replace(/[^a-z0-9]/g,'');
  },
  normCondition(c){
    c = String(c||'').toLowerCase();
    if(/new|boxed|brand|mint/.test(c)) return 'New';
    return 'Used';
  },
  classifyPrices(prices, defaults){
    const nums = prices.filter(p=>p!=null&&p>0).sort((a,b)=>a-b);
    if(!nums.length){
      const cost = defaults?.costPrice||0;
      return { cost, wholesale: defaults?.wholesalePrice||Math.round((cost+12)*100)/100, sale: defaults?.sellPrice||cost };
    }
    // Single price in sheet — if higher than known cost, treat as sale price
    if(nums.length===1 && defaults?.costPrice && nums[0]>defaults.costPrice*1.05){
      const cost=defaults.costPrice;
      return { cost, wholesale:defaults.wholesalePrice||Math.round((cost+12)*100)/100, sale:nums[0] };
    }
    const cost = nums[0], sale = nums[nums.length-1];
    const wholesale = nums.length>=3 ? nums[1] : Math.round((cost+12)*100)/100;
    return { cost, wholesale, sale: sale>cost?sale:(defaults?.sellPrice||sale) };
  },
  parseShopCsv(text, shopId){
    const out = [];
    const lines = text.split(/\r?\n/);
    let headers=[], traleeCat=null, cat='Other', kilkennyMode=false;
    for(const line of lines){
      if(!line.trim()) continue;
      const cols = line.split(',').map(c=>c.trim());
      const l0=(cols[0]||'').toLowerCase(), l1=(cols[1]||'').toLowerCase();
      if(l1.includes('iphone')&&l1.includes('imei')){ cat='iPhone'; headers=cols; kilkennyMode=false; continue; }
      if(l1.includes('samsung')&&l1.includes('imei')){ cat='Samsung'; headers=cols; kilkennyMode=false; continue; }
      if((l1.includes('ipad')||l1.includes('tablet'))&&l1.includes('imei')){ cat='iPad & Tablets'; headers=cols; kilkennyMode=false; continue; }
      if(l1.includes('button')&&l1.includes('imei')){ cat='Button Phones'; headers=cols; kilkennyMode=false; continue; }
      if(l1.includes('watch')&&l1.includes('imei')){ cat='Smart Watches'; headers=cols; kilkennyMode=false; continue; }
      if(l1.includes('mix phone')){ cat='Other Brands'; headers=cols; kilkennyMode=false; continue; }
      if(l1.includes('airpod')){ cat='Gadgets'; headers=cols; kilkennyMode=false; continue; }
      if(l0==='model'&&l1==='imei'){ headers=cols; kilkennyMode=false; continue; }
      if(l0.includes('iphone')&&l1==='storage'){ traleeCat='iPhone'; continue; }
      if(l0.includes('samsung')&&l1==='storage'){ traleeCat='Samsung'; continue; }
      if(l0.includes('button')&&l1==='storage'){ traleeCat='Button Phones'; continue; }
      if(l0.includes('nokia')&&l1==='storage'){ traleeCat='Button Phones'; continue; }
      if(l0.includes('tablet')&&l1==='storage'){ traleeCat='iPad & Tablets'; continue; }
      if((l0.includes('watch')||l0.includes('watches'))&&l1===''){ traleeCat='Smart Watches'; continue; }
      if(l0==='date'&&l1.includes('iphone')&&cols.some(c=>c.toLowerCase().includes('cost'))){ cat='iPhone'; headers=cols; kilkennyMode=(shopId==='shop_kilkenny'); continue; }
      if(l0==='date'&&l1.includes('samsung')){ headers=cols; kilkennyMode=(shopId==='shop_kilkenny'&&cols.some(c=>/cost/i.test(c))); continue; }

      let imei=null, model=null, condition='Used', prices=[], color='';
      if(headers.length&&headers[0].toLowerCase().startsWith('model')){
        model=cols[0]; imei=(cols[1]||'').replace(/[\s\-']/g,''); condition=cols[2]||'New';
        prices=[this.parseEuro(cols[5]),this.parseEuro(cols[6]),this.parseEuro(cols[7])];
      } else if(headers.some(h=>h.toLowerCase().includes('imei'))){
        const hi=headers.findIndex(h=>h.toLowerCase().includes('imei'));
        const mi=hi>0?hi-1:1;
        model=cols[mi]||cols[1]||'';
        imei=(cols[hi]||'').replace(/[\s\-']/g,'');
        condition=cols[hi+1]||cols[3]||'Used';
        headers.forEach((h,idx)=>{
          const hl=h.toLowerCase();
          if(/cost|price|selling|gcw/.test(hl)){ const p=this.parseEuro(cols[idx]); if(p) prices.push(p); }
        });
        if(kilkennyMode){
          const saleP=this.parseEuro(cols[5]), costP=this.parseEuro(cols[6]);
          if(saleP) prices.push(saleP);
          if(costP) prices.push(costP);
        }
        if(shopId==='shop_tullamore'&&cols.length>4){
          const p=this.parseEuro(cols[4]); if(p) prices.push(p);
        }
      } else if(traleeCat&&cols[3]){
        const id=cols[3].replace(/\s/g,'');
        if(id.length>=8){ model=cols[0]+' '+cols[1]; color=cols[2]||''; imei=id; condition=cols[4]||'Used'; cat=traleeCat; }
      }
      if(!imei||imei.length<8||!model||/date/i.test(model)||model.toLowerCase()==='model') continue;
      if(/faulty|sold|transfer|out the back/i.test(line)) continue;
      const qtyIdx = headers.findIndex(h=>/^qty$/i.test(h.trim()));
      if(qtyIdx>=0 && cols[qtyIdx]==='0') continue;
      out.push({ shopId, cat, model:model.trim(), imei, condition, color, prices:prices.filter(Boolean) });
    }
    return out;
  },
  catNameToId(name){
    const map={'iPhone':'iPhone','Samsung':'Samsung','Other Brands':'Other Brands','Button Phones':'Button Phones','iPad & Tablets':'iPad & Tablets','Gadgets':'Gadgets','Smart Watches':'Smart Watches'};
    const n=map[name]||name;
    let c=Store.data.categories.find(x=>x.name===n);
    if(!c){ c={id:uid('cat'),name:n}; Store.data.categories.push(c); }
    return c.id;
  },
  findItem(model, cat){
    const key=this.normKey(model);
    const items=Store.data.items;
    let it=items.find(i=>this.normKey(i.name)===key);
    if(it) return it;
    const scored=items.map(i=>{
      const ik=this.normKey(i.name);
      let score=0;
      if(ik.includes(key)||key.includes(ik)) score+=50;
      const words=key.match(/\d+[a-z]*/g)||[];
      words.forEach(w=>{ if(w.length>2&&ik.includes(w)) score+=10; });
      if(cat&&catName(i.category)===cat) score+=5;
      return {item:i,score};
    }).filter(x=>x.score>15).sort((a,b)=>b.score-a.score);
    return scored[0]?.item||null;
  },
  importUnits(rows, shopId){
    let added=0;
    rows.forEach(row=>{
      if(findUnitByImei(row.imei)) return;
      const loc=row.shopId||shopId;
      const existed=this.findItem(row.model, row.cat);
      let it=existed;
      const defaults = it ? { costPrice:it.costPrice, wholesalePrice:it.wholesalePrice, sellPrice:it.shopPrices[loc] } : null;
      const {cost,wholesale,sale}=this.classifyPrices(row.prices, defaults);
      if(!it){
        it={ id:uid('item'), name:row.model, category:this.catNameToId(row.cat), memory:'', imei:'', condition:this.normCondition(row.condition),
          colors:row.color?[row.color]:[], batteryPct:null, costPrice:cost, wholesalePrice:wholesale,
          shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
        activeShops().forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sale; });
        Store.data.items.push(it);
      } else {
        if(cost>0){ it.costPrice=cost; it.wholesalePrice=wholesale; }
        if(sale>0) it.shopPrices[loc]=sale;
      }
      const unit={ id:uid('unit'), imei:row.imei, color:row.color||'', condition:this.normCondition(row.condition),
        location:loc, costPrice:cost||it.costPrice, wholesalePrice:wholesale||it.wholesalePrice||it.costPrice+12,
        sellPrice:sale||it.shopPrices[loc]||it.costPrice };
      if(!Array.isArray(it.units)) it.units=[];
      it.units.push(unit);
      // Only bump location count for brand-new items; existing RAW stock already counted these devices
      if(!existed) it.locations[loc]=(it.locations[loc]||0)+1;
      else if((it.locations[loc]||0) < it.units.filter(u=>u.location===loc).length)
        it.locations[loc] = it.units.filter(u=>u.location===loc).length;
      added++;
    });
    return added;
  },
  importText(shopId, text){
    const rows=this.parseShopCsv(text, shopId);
    return this.importUnits(rows, shopId);
  },
  async tryFetchAll(){
    let total=0;
    for(const [shopId,filename] of Object.entries(this.SHOP_FILES)){
      try{
        const r=await fetch(filename);
        if(r.ok) total+=this.importText(shopId, await r.text());
      }catch(e){}
    }
    if(total>0) Store.save();
    return total;
  },
  importFiles(fileList){
    const nameToShop={
      'warhouse phone count main.csv':'warehouse','thurles phone count.csv':'shop_thurles',
      'kilkenney phone count.csv':'shop_kilkenny','maynooth phone count.csv':'shop_maynooth',
      'mullingar phone count.csv':'shop_mullingar','tralee phone count.csv':'shop_tralee',
      'tullamore phone count.csv':'shop_tullamore',
    };
    let total=0, pending=fileList.length;
    return new Promise(resolve=>{
      if(!pending){ resolve(0); return; }
      [...fileList].forEach(file=>{
        const shopId=nameToShop[file.name.toLowerCase()];
        const reader=new FileReader();
        reader.onload=e=>{
          if(shopId) total+=CsvImport.importText(shopId, e.target.result);
          pending--;
          if(pending===0){ Store.data.meta.imeiImportedV2=true; Store.save(); resolve(total); }
        };
        reader.readAsText(file);
      });
    });
  }
};

function allUnitsWithImei(atLoc){
  const rows=[];
  Store.data.items.forEach(it=>{
    (it.units||[]).filter(u=>u.imei&&(!atLoc||u.location===atLoc)).forEach(u=>rows.push({it,u}));
  });
  return rows.sort((a,b)=>a.it.name.localeCompare(b.it.name));
}

const Stock = {
  addMovement(m){
    m.id = uid('mv'); m.date = m.date||todayISO();
    Store.data.movements.push(m);
  },
  stockIn(itemId, qty, date, note, location){
    const it = itemById(itemId); if(!it||qty<=0) return;
    const loc = location || 'warehouse';
    it.locations[loc] = (it.locations[loc]||0) + qty;
    this.addMovement({type:'stock-in', itemId, itemName:it.name, categoryId:it.category, location:loc, fromLocation:'supplier', qty, date, note});
    Store.save();
  },
  // Adds ONE individually-tracked unit (IMEI, colour, condition, its own price). IMEI may be blank.
  addUnit(itemId, loc, data, date, note){
    const it = itemById(itemId); if(!it) return null;
    if(!Array.isArray(it.units)) it.units=[];
    if(data.imei && findUnitByImei(data.imei)){ Toast.show('That IMEI is already in the system.','err'); return null; }
    const unit = {
      id: uid('unit'), imei:(data.imei||'').trim(), color:data.color||'', condition:data.condition||it.condition||'New',
      location: loc, costPrice: data.costPrice!=null?data.costPrice:it.costPrice, sellPrice: data.sellPrice!=null?data.sellPrice:(it.shopPrices[loc]||it.costPrice),
      batteryPct: data.batteryPct!=null?data.batteryPct:null, dateAdded: date||todayISO()
    };
    it.units.push(unit);
    it.locations[loc] = (it.locations[loc]||0) + 1;
    if(unit.color && !it.colors.includes(unit.color)) it.colors.push(unit.color);
    this.addMovement({type:'stock-in', itemId, itemName:it.name, categoryId:it.category, location:loc, fromLocation:'supplier', qty:1, date, note:note||(unit.imei?('IMEI '+unit.imei):'Individually tracked unit')});
    Store.save();
    return unit;
  },
  transfer(itemId, toShopId, qty, date, note){
    // kept for backwards compatibility: warehouse -> shop
    return this.transferGeneric(itemId, 'warehouse', toShopId, qty, date, note);
  },
  transferGeneric(itemId, fromLoc, toLoc, qty, date, note){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if(fromLoc===toLoc){ Toast.show('Pick two different locations.','err'); return false; }
    if((it.locations[fromLoc]||0) < qty){ Toast.show(`Not enough stock at ${shopName(fromLoc)} for that transfer.`,'err'); return false; }
    it.locations[fromLoc] -= qty;
    it.locations[toLoc] = (it.locations[toLoc]||0) + qty;
    // if this fully-untracked bulk move happens to be the only stock and a tracked unit exists, leave units alone —
    // tracked units should be moved explicitly (by IMEI) so their record stays accurate.
    this.addMovement({type:'transfer-out', itemId, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty, date, note});
    this.addMovement({type:'transfer-in', itemId, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty, date, note});
    Store.save();
    return true;
  },
  // Move ONE specific tracked unit (found by IMEI) to a new location.
  transferUnitByImei(imei, toLoc, date, note){
    const found = findUnitByImei(imei);
    if(!found){ Toast.show('No device found with that IMEI.','err'); return false; }
    const {item:it, unit} = found;
    const fromLoc = unit.location;
    if(fromLoc===toLoc){ Toast.show('That device is already at '+shopName(toLoc)+'.','err'); return false; }
    it.locations[fromLoc] = Math.max(0,(it.locations[fromLoc]||0)-1);
    it.locations[toLoc] = (it.locations[toLoc]||0)+1;
    unit.location = toLoc;
    this.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty:1, date, note:note||('IMEI '+unit.imei)});
    this.addMovement({type:'transfer-in', itemId:it.id, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty:1, date, note:note||('IMEI '+unit.imei)});
    Store.save();
    return {item:it, unit};
  },
  // Remove ONE specific tracked unit from stock (sold / faulty / deposit).
  removeUnit(itemId, unitId, status, date, note){
    const it = itemById(itemId); if(!it) return false;
    const idx = (it.units||[]).findIndex(u=>u.id===unitId);
    if(idx<0) return false;
    const unit = it.units[idx];
    it.units.splice(idx,1);
    it.locations[unit.location] = Math.max(0,(it.locations[unit.location]||0)-1);
    this.addMovement({type:status, itemId, itemName:it.name, categoryId:it.category, location:unit.location, qty:1, date:date||todayISO(), note:note||('IMEI '+(unit.imei||'—')), sellPrice:unit.sellPrice});
    Store.save();
    return true;
  },
  // qty=1 convenience actions used by Shop Sales quick buttons — auto-consumes a tracked unit if one exists
  // at that location (so IMEI records stay accurate without the person having to pick one manually).
  sell(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'sold', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'sold', date, note); }
    it.locations[shopId] -= qty;
    this.addMovement({type:'sold', itemId, itemName:it.name, categoryId:it.category, location:shopId, qty, date, note});
    Store.save();
    return true;
  },
  faulty(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'faulty', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'faulty', date, note); }
    it.locations[shopId] -= qty;
    this.addMovement({type:'faulty', itemId, itemName:it.name, categoryId:it.category, location:shopId, qty, date, note});
    Store.save();
    return true;
  },
  deposit(itemId, shopId, qty, date, note, unitId){
    const it = itemById(itemId); if(!it||qty<=0) return false;
    if((it.locations[shopId]||0) < qty){ Toast.show('Not enough stock at that shop.','err'); return false; }
    if(unitId) return this.removeUnit(itemId, unitId, 'deposit', date, note);
    if(qty===1){ const u = unitsAt(it, shopId)[0]; if(u) return this.removeUnit(itemId, u.id, 'deposit', date, note); }
    it.locations[shopId] -= qty;
    this.addMovement({type:'deposit', itemId, itemName:it.name, categoryId:it.category, location:shopId, qty, date, note});
    Store.save();
    return true;
  },
  adjust(itemId, shopId, newQty, note){
    const it = itemById(itemId); if(!it) return;
    const old = it.locations[shopId]||0;
    const diff = newQty - old;
    it.locations[shopId] = newQty;
    this.addMovement({type:'adjustment', itemId, itemName:it.name, categoryId:it.category, location:shopId, qty:diff, date:todayISO(), note:note||'Manual adjustment'});
    Store.save();
  }
};

/* ---- DASHBOARD ---- */
Views.dashboard = function(){
  const items = Store.data.items;
  const totalUnits = items.reduce((a,it)=>a+totalQty(it),0);
  const totalValue = items.reduce((a,it)=>a+totalQty(it)*(Number(it.costPrice)||0),0);
  const lowStock = items.filter(it=>totalQty(it)>0 && totalQty(it)<=3);
  const outOfStock = items.filter(it=>totalQty(it)===0);
  const soldLast30 = Store.data.movements.filter(m=>m.type==='sold' && daysAgo(m.date)<=30).reduce((a,m)=>a+m.qty,0);

  const byCat = {};
  Store.data.categories.forEach(c=>byCat[c.id]=0);
  items.forEach(it=>{ byCat[it.category] = (byCat[it.category]||0) + totalQty(it); });
  const maxCat = Math.max(1,...Object.values(byCat));

  const shopCards = activeShops().map(s=>{
    const q = items.reduce((a,it)=>a+(it.locations[s.id]||0),0);
    return `<div class="stat-card accent-teal"><div class="n">${q}</div><div class="l">${esc(s.name)} ${s.isWarehouse?'(warehouse)':'— units on shelf'}</div></div>`;
  }).join('');

  return `
    <div class="stat-cards">
      <div class="stat-card accent-teal"><div class="n">${totalUnits}</div><div class="l">Total units, all locations</div></div>
      <div class="stat-card accent-green"><div class="n">${euro(totalValue)}</div><div class="l">Stock value at cost</div></div>
      <div class="stat-card accent-amber"><div class="n">${lowStock.length}</div><div class="l">Items running low (≤3)</div></div>
      <div class="stat-card accent-red"><div class="n">${outOfStock.length}</div><div class="l">Out of stock</div></div>
      <div class="stat-card accent-teal"><div class="n">${soldLast30}</div><div class="l">Sold, last 30 days</div></div>
    </div>
    <div class="row">
      <div class="col" style="flex:2;min-width:340px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Units by category</h3>
          ${Store.data.categories.map(c=>`
            <div class="bar-row">
              <div class="label">${esc(c.name)}</div>
              <div class="track"><div class="fill" style="width:${(byCat[c.id]/maxCat*100).toFixed(0)}%"></div></div>
              <div class="val">${byCat[c.id]}</div>
            </div>`).join('') || '<div class="empty">No categories yet.</div>'}
        </div>
      </div>
      <div class="col" style="flex:1;min-width:260px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Per-shop units</h3>
          <div class="row" style="flex-direction:column;gap:10px;">${shopCards}</div>
        </div>
      </div>
    </div>
    <div class="card card-pad" style="margin-top:16px;">
      <h3 style="margin-top:0;">Needs attention</h3>
      ${ (lowStock.length+outOfStock.length)===0 ? '<div class="empty">Everything is healthily stocked. 🎉</div>' :
        `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Total left</th><th>Status</th></tr></thead><tbody>
          ${[...outOfStock,...lowStock].map(it=>`<tr><td>${esc(it.name)}</td><td>${esc(catName(it.category))}</td><td>${signalHtml(totalQty(it))} ${totalQty(it)}</td><td>${totalQty(it)===0?'<span class="pill red">Out of stock</span>':'<span class="pill amber">Low stock</span>'}</td></tr>`).join('')}
        </tbody></table></div>`}
    </div>
  `;
};
function daysAgo(iso){ return Math.round((Date.now()-new Date(iso+'T00:00:00').getTime())/86400000); }

/* ---- INVENTORY ---- */
Views._invFilter = {q:'', cat:'all', shop:'all'};

Views.inventory = function(){
  const f = Views._invFilter;
  const shops = activeShops();
  let items = sortedItems();

  if(f.q) items = items.filter(it=>(it.name+(it.imei||'')+(it.memory||'')+(it.units||[]).map(u=>u.imei).join(' ')).toLowerCase().includes(f.q.toLowerCase()));
  if(f.cat!=='all') items = items.filter(it=>it.category===f.cat);
  if(f.shop!=='all') items = items.filter(it=>(it.locations[f.shop]||0) > 0);

  const shopChips = [
    `<button class="${f.shop==='all'?'active':''}" onclick="Views._invFilter.shop='all';render()">All Stores</button>`,
    ...shops.map(s=>`<button class="${f.shop===s.id?'active':''}" onclick="Views._invFilter.shop='${s.id}';render()">${esc(s.name)}</button>`)
  ].join('');

  // Build flat rows — one per IMEI unit (each phone on its own line)
  let rows = '';
  if(items.length === 0){
    rows = `<tr><td colspan="11"><div class="empty"><div class="big">No items match</div>Try clearing filters or add a new device.</div></td></tr>`;
  } else {
    items.forEach(it=>{
      const units = (it.units||[]);
      const filterShop = f.shop !== 'all' ? f.shop : null;
      const relevantUnits = filterShop ? units.filter(u=>u.location===filterShop) : units;

      relevantUnits.forEach(u=>{
        const otherShops = shops.filter(s=>s.id!==u.location);
        const hasImei = !!(u.imei && u.imei.trim());
        const cost = u.costPrice!=null?u.costPrice:it.costPrice;
        const wholesale = u.wholesalePrice!=null?u.wholesalePrice:(it.wholesalePrice||cost+12);
        const sale = u.sellPrice!=null?u.sellPrice:(it.shopPrices[u.location]||it.costPrice);
        rows += `<tr style="${hasImei?'':'background:#FFFBF2;'}">
          <td><b>${esc(it.name)}</b><br><span style="font-size:11px;color:var(--muted);">${esc(it.memory||'')} · ${esc(u.color||'')} · ${u.condition==='New'?'<span style="color:var(--green)">New</span>':'<span style="color:var(--muted)">Used</span>'}</span></td>
          <td>
            ${hasImei
              ? `<span class="mono imei-copy" style="font-size:13px;font-weight:700;color:var(--teal-dark);letter-spacing:.03em;cursor:pointer;" title="Click to copy" onclick="navigator.clipboard.writeText('${esc(u.imei)}');Toast.show('IMEI copied.','ok')">${esc(u.imei)}</span>`
              : `<span style="color:var(--muted);font-style:italic;font-size:12px;">No IMEI recorded</span>`
            }
          </td>
          <td><span class="pill teal">${esc(catName(it.category))}</span></td>
          <td class="mono">${esc(it.memory||'-')}</td>
          <td>${u.condition==='New'?'<span class="pill green">New</span>':'<span class="pill gray">Used</span>'}</td>
          <td>${euro(cost)}</td>
          <td style="color:#8A5A16;">${euro(wholesale)}</td>
          <td style="color:var(--teal-dark);font-weight:600;">${euro(sale)}</td>
          <td>1</td>
          <td><b style="color:var(--teal-dark);">${esc(shopName(u.location))}</b></td>
          <td style="white-space:nowrap;">
            <select id="inv_to_${u.id}" style="padding:4px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;margin-right:4px;">
              ${otherShops.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
            </select>
            <button class="btn sm primary" onclick="Views.doInlineTransfer('${it.id}','${u.id}','${u.location}')">⇄ Transfer</button>
            <button class="btn sm danger" onclick="Views.drawerRemoveUnit('${it.id}','${u.id}')">✕</button>
          </td>
        </tr>`;
      });

      if(relevantUnits.length === 0 && filterShop){
        rows += `<tr style="background:#FAFBFC;"><td colspan="11" style="color:var(--muted);font-size:12px;padding-left:20px;">${esc(it.name)} — ${it.locations[filterShop]||0} unit(s) here with no IMEI on file (add IMEIs via Stock In or import CSVs)</td></tr>`;
      }
    });
  }

  return `
    <style>
      .inv-flat th { white-space:nowrap; background:#F0F4F8; }
      .inv-flat td { vertical-align:middle; }
      .inv-imei-scan { display:flex;align-items:center;gap:10px;background:var(--teal);color:#fff;padding:12px 16px;border-radius:var(--radius);margin-bottom:14px; }
      .inv-imei-scan label { font-weight:700;font-size:13px;white-space:nowrap; }
      .inv-imei-scan input { flex:1;padding:8px 12px;border:none;border-radius:6px;font-size:14px;font-family:'IBM Plex Mono',monospace;background:#fff;color:var(--ink);min-width:0; }
      .inv-imei-scan select { padding:8px 10px;border:none;border-radius:6px;font-size:13px;background:#fff;color:var(--ink); }
      .inv-imei-scan button { white-space:nowrap; }
    </style>

    <div class="inv-imei-scan">
      <label>📱 Transfer by IMEI:</label>
      <input id="inv_scan_imei" placeholder="Scan or type IMEI number…" autocomplete="off">
      <span style="font-size:12px;opacity:.8;">→ to</span>
      <select id="inv_scan_to">
        ${activeShops().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
      </select>
      <button class="btn primary" style="background:#fff;color:var(--teal-dark);border:none;" onclick="Views.doScanTransfer()">⇄ Transfer</button>
    </div>

    <div class="toolbar" style="flex-wrap:wrap;gap:8px;">
      <div class="chip-select" style="flex-wrap:wrap;">${shopChips}</div>
      <div class="spacer"></div>
      <div class="search-input"><span class="ic">🔎</span><input placeholder="Search name / IMEI…" value="${esc(f.q)}" oninput="Views._invFilter.q=this.value;render()"></div>
      <select onchange="Views._invFilter.cat=this.value;render()">
        <option value="all">All categories</option>
        ${Store.data.categories.map(c=>`<option value="${c.id}" ${f.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select>
      <button class="btn" onclick="Views.exportInventoryCsv()">⬇ Export CSV</button>
      <button class="btn primary" onclick="Views.openItemModal()">+ Add device</button>
    </div>

    <div class="helpbox">Each phone is its own row with its <b>IMEI</b> (click to copy). Transfer one device at a time using the dropdown per row, or use the IMEI scan bar above.</div>
    <div class="card">
      <div class="table-wrap"><table class="inv-flat">
        <thead><tr>
          <th>Device Name</th><th>IMEI</th><th>Category</th><th>Memory</th><th>Condition</th>
          <th style="border-bottom:3px solid var(--line);">Cost</th>
          <th style="border-bottom:3px solid #F0B429;">Wholesale</th>
          <th style="border-bottom:3px solid var(--teal);">Sale</th>
          <th>Qty</th><th>Currently At</th><th>Transfer To →</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>
    <div style="margin-top:12px;text-align:right;">
      <button class="btn" onclick="Views.openItemModal()">+ Add new device to inventory</button>
    </div>
  `;
};

// Transfer by scanning/typing IMEI directly from the top bar
Views.doScanTransfer = function(){
  const imei = (document.getElementById('inv_scan_imei')?.value||'').trim();
  const toLoc = document.getElementById('inv_scan_to')?.value;
  if(!imei){ Toast.show('Enter or scan an IMEI first.','err'); return; }
  if(!toLoc){ Toast.show('Select a destination store.','err'); return; }
  const found = findUnitByImei(imei);
  if(!found){ Toast.show(`No device found with IMEI ${imei}.`,'err'); return; }
  const {item:it, unit:u} = found;
  if(u.location === toLoc){ Toast.show(`That device is already at ${shopName(toLoc)}.`,'err'); return; }
  const result = Stock.transferUnitByImei(imei, toLoc, todayISO(), 'Transferred by IMEI scan from Inventory');
  if(result) Toast.show(`✓ ${it.name} (IMEI ${imei}) moved to ${shopName(toLoc)}.`,'ok');
  render();
};

// Inline transfer of a tracked IMEI unit — reads the inline <select> for destination
Views.doInlineTransfer = function(itemId, unitId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const toLoc = document.getElementById('inv_to_'+unitId)?.value;
  if(!toLoc || toLoc===fromLoc){ Toast.show('Pick a different destination store.','err'); return; }

  if(unit.imei){
    const result = Stock.transferUnitByImei(unit.imei, toLoc, todayISO(), 'Transferred from Inventory');
    if(result) Toast.show(`IMEI ${unit.imei} → ${shopName(toLoc)}.`,'ok');
  } else {
    it.locations[fromLoc] = Math.max(0,(it.locations[fromLoc]||0)-1);
    it.locations[toLoc] = (it.locations[toLoc]||0)+1;
    unit.location = toLoc;
    Stock.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:fromLoc, toLocation:toLoc, qty:1, date:todayISO(), note:'Transferred from Inventory'});
    Stock.addMovement({type:'transfer-in',  itemId:it.id, itemName:it.name, categoryId:it.category, location:toLoc, fromLocation:fromLoc, qty:1, date:todayISO(), note:'Transferred from Inventory'});
    Store.save();
    Toast.show(`Device transferred to ${shopName(toLoc)}.`,'ok');
  }
  render();
};

// Inline transfer of bulk (no-IMEI) stock — reads qty + destination selects
Views.doBulkInlineTransfer = function(itemId, fromLoc){
  const it = itemById(itemId); if(!it) return;
  const qtyEl = document.getElementById('inv_bqty_'+itemId+'_'+fromLoc);
  const toEl  = document.getElementById('inv_bto_'+itemId+'_'+fromLoc);
  const qty   = Number(qtyEl?.value)||0;
  const toLoc = toEl?.value;
  if(qty<=0){ Toast.show('Enter a quantity greater than 0.','err'); return; }
  if(!toLoc || toLoc===fromLoc){ Toast.show('Pick a different destination store.','err'); return; }
  const ok = Stock.transferGeneric(itemId, fromLoc, toLoc, qty, todayISO(), 'Bulk transfer from Inventory');
  if(ok) Toast.show(`${qty} unit(s) moved from ${shopName(fromLoc)} to ${shopName(toLoc)}.`,'ok');
  render();
};

Views.exportInventoryCsv = function(){
  const rows = [['Name','Category','Memory','IMEI','Colour','Condition','Location','Cost Price','Wholesale Price','Sale Price']];
  Store.data.items.forEach(it=>{
    const units = (it.units||[]).filter(u=>u.imei);
    if(units.length){
      units.forEach(u=>{
        rows.push([it.name, catName(it.category), it.memory, u.imei, u.color||'', u.condition||'',
          shopName(u.location), u.costPrice||it.costPrice, u.wholesalePrice||it.wholesalePrice, u.sellPrice||'']);
      });
    } else if(totalQty(it)>0){
      rows.push([it.name, catName(it.category), it.memory, '', '', it.condition, '',
        it.costPrice, it.wholesalePrice||0, it.shopPrices.warehouse||'']);
    }
  });
  csvDownload('inventory_export.csv', rows);
  Toast.show('Inventory exported as CSV.','ok');
};

Views.drawerAddUnit = function(itemId){
  const loc = val('dw_loc');

  const unit = Stock.addUnit(itemId, loc, data, todayISO(), 'Added from Inventory');
  if(unit){ Toast.show('Device added.','ok'); Views.openDeviceDrawer(itemId); render(); }
};
Views.drawerRemoveUnit = function(itemId, unitId){
  const it = itemById(itemId); const unit = (it.units||[]).find(u=>u.id===unitId);
  Modal.confirm({
    title:'Remove this device?',
    body:`<p>Remove IMEI <b>${esc(unit?unit.imei||'(none)':'')}</b> from ${esc(shopName(unit?unit.location:''))}? Use this for sold/faulty/lost devices you're taking off the books outside the normal Sales flow.</p>`,
    danger:true, confirmText:'Remove',
    onConfirm:()=>{
      Stock.removeUnit(itemId, unitId, 'adjustment', todayISO(), 'Removed from Inventory drawer');

      Views.openDeviceDrawer(itemId);
      render();

Views.drawerTransferUnit = function(itemId, unitId){
  const it = itemById(itemId); const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const locs = activeShops().filter(s=>s.id!==unit.location);
  Modal.open(`
    <div class="modal">
      <div class="modal-head"><h3>Transfer ${esc(unit.imei||'device')}</h3><button class="btn ghost sm" onclick="Modal.close()">✕</button></div>

      </div>
      <div class="modal-foot"><button class="btn" onclick="Modal.close()">Cancel</button><button class="btn primary" onclick="Views.drawerConfirmTransfer('${itemId}','${unitId}')">Transfer</button></div>

Views.drawerConfirmTransfer = function(itemId, unitId){
  const it = itemById(itemId); const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const to = val('dwt_to');
  const from = unit.location;
  if(unit.imei){
    Stock.transferUnitByImei(unit.imei, to, todayISO(), 'Transferred from Inventory drawer');
  } else {
    it.locations[from] = Math.max(0,(it.locations[from]||0)-1);
    it.locations[to] = (it.locations[to]||0)+1;
    unit.location = to;
    Stock.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:from, toLocation:to, qty:1, date:todayISO(), note:'Transferred from Inventory drawer'});
    Stock.addMovement({type:'transfer-in', itemId:it.id, itemName:it.name, categoryId:it.category, location:to, fromLocation:from, qty:1, date:todayISO(), note:'Transferred from Inventory drawer'});
    Store.save();
  }
  Toast.show('Device transferred.','ok');
  Modal.close();
  Views.openDeviceDrawer(itemId);
  render();
};

  const mem = val('f_mem').trim();

  const imei = val('f_imei').trim();
  const colors = val('f_colors').split(',').map(s=>s.trim()).filter(Boolean);
  const cost = parseFloat(val('f_cost'))||0;
  const shopPrices = {};
  document.querySelectorAll('.sp').forEach(inp=>{ shopPrices[inp.dataset.shop] = parseFloat(inp.value)||0; });

const CSV_HEADERS = ['Name','Memory','Category','Colour','Condition','IMEI','Location','Cost','Sell','Qty'];
Views.exportCsvTemplate = function(){

Views.exportFullStockCsv = function(){
  const rows = [CSV_HEADERS];
  Store.data.items.forEach(it=>{
    (it.units||[]).forEach(u=>{
      rows.push([it.name, it.memory, catName(it.category), u.color, u.condition, u.imei, shopName(u.location), u.costPrice, u.sellPrice, 1]);
    });
    Store.data.shops.forEach(s=>{
      const bulk = untrackedQtyAt(it, s.id);
      if(bulk>0) rows.push([it.name, it.memory, catName(it.category), (it.colors||[]).join('/'), it.condition, '', s.name, it.costPrice, it.shopPrices[s.id], bulk]);
    });
  });
  csvDownload('stockline_current_stock.csv', rows);
  Toast.show('Full stock exported.','ok');
};
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(line=>{
    const cells=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===',' && !inQ){ cells.push(cur); cur=''; continue; }
      cur+=c;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}
Views.doCsvImport = function(){
  const fileInput = document.getElementById('si_csv_file');
  const file = fileInput && fileInput.files[0];
  if(!file){ Toast.show('Choose a CSV file first.','err'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const rows = parseCsv(e.target.result);
      const header = rows[0].map(h=>h.toLowerCase());
      const idx = name => header.indexOf(name.toLowerCase());
      const iName=idx('Name'), iMem=idx('Memory'), iCat=idx('Category'), iColor=idx('Colour'), iCond=idx('Condition'),
            iImei=idx('IMEI'), iLoc=idx('Location'), iCost=idx('Cost'), iSell=idx('Sell'), iQty=idx('Qty');
      if(iName<0){ Toast.show('CSV needs at least a Name column.','err'); return; }
      let added=0, skipped=0;
      rows.slice(1).forEach(r=>{
        const name=(r[iName]||'').trim(); if(!name) return;
        const memory=iMem>=0?(r[iMem]||'').trim():'';
        const catNameStr=iCat>=0?(r[iCat]||'').trim():'';
        const color=iColor>=0?(r[iColor]||'').trim():'';
        const condition=iCond>=0?(r[iCond]||'New').trim():'New';
        const imei=iImei>=0?(r[iImei]||'').trim():'';
        const locName=iLoc>=0?(r[iLoc]||'').trim():'Warehouse';
        const cost=iCost>=0?Number(r[iCost])||0:0;
        const sell=iSell>=0?Number(r[iSell])||0:0;
        const qty=iQty>=0?Number(r[iQty])||1:1;
        const shop = Store.data.shops.find(s=>s.name.toLowerCase()===locName.toLowerCase()) || Store.data.shops.find(s=>s.isWarehouse);
        let it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase() && (x.memory||'').toLowerCase()===memory.toLowerCase());
        if(!it){
          let cat = Store.data.categories.find(c=>c.name.toLowerCase()===catNameStr.toLowerCase());
          if(!cat) cat = Store.data.categories[0];
          it = { id:uid('item'), name, category:cat.id, memory, imei:'', condition, colors:[], batteryPct:null, costPrice:cost||0, shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
          Store.data.shops.forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sell||cost||0; });
          Store.data.items.push(it);
        }
        if(imei){
          if(findUnitByImei(imei)){ skipped++; return; }
          Stock.addUnit(it.id, shop.id, {imei, color, condition, costPrice:cost||it.costPrice, sellPrice:sell||it.shopPrices[shop.id]}, todayISO(), 'CSV import');
        } else if(qty>0){
          Stock.stockIn(it.id, qty, todayISO(), 'CSV import', shop.id);
        }
        added++;
      });
      Store.save();
      Toast.show(`Imported ${added} row(s).${skipped?(' '+skipped+' skipped (duplicate IMEI).'):''}`, 'ok');
      render();
    }catch(err){
      Toast.show('Could not read that CSV file.','err');
    }
  };
  reader.readAsText(file);
};

Views.doSetExisting = function(){
  const itemId = val('ex_item');
  const loc = val('ex_loc');
  const qty = Number(val('ex_qty'));
  if(isNaN(qty)||qty<0){ Toast.show('Enter a valid quantity.','err'); return; }
  Stock.adjust(itemId, loc, qty, 'Existing stock recorded');
  Toast.show('Quantity set.','ok');
  render();
};
Views.doBulkExisting = function(){
  const raw = val('exb_bulk').trim();
  const loc = val('exb_loc');
  if(!raw){ Toast.show('Paste a list first.','err'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=[];
  lines.forEach(line=>{
    const parts = line.split(/\t|,(?=[^,]*$)/).map(s=>s.trim());
    if(parts.length<2){ fail.push(line); return; }
    const name = parts[0]; const qty = Number(parts[1]);
    const it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!it || isNaN(qty)){ fail.push(line); return; }
    Stock.adjust(it.id, loc, qty, 'Existing stock — bulk stocktake');
    ok++;
  });
  Toast.show(`${ok} item(s) set.${fail.length? ' '+fail.length+' skipped (name not found — add the item first in Inventory).':''}`, fail.length?'err':'ok');
  render();
};

/* ---- WEEKLY REPORT (matches your uploaded sheet layout) ---- */
Views._weekStart = mostRecentMonday();
Views.weekly = function(){
  const weekStart = Views._weekStart;
  const weekEnd = isoAddDays(weekStart,6);
  const shops = nonWarehouseShops();

  function calcFor(shopId, catId){
    // start = current qty minus everything that happened at/after weekStart, plus everything undone... simplified:
    // We reconstruct using movement log: Start = qty before weekStart; then apply week's movements.
    const itemsInCat = Store.data.items.filter(it=>it.category===catId);
    let start=0, inQ=0, outQ=0, faultyQ=0, depositQ=0;
    itemsInCat.forEach(it=>{
      const moves = Store.data.movements.filter(m=>m.itemId===it.id && m.location===shopId);
      const before = moves.filter(m=>m.date<weekStart);
      const during = moves.filter(m=>m.date>=weekStart && m.date<=weekEnd);
      let bal = 0;
      before.forEach(m=>{ bal += deltaFor(m); });
      start += bal;
      during.forEach(m=>{
        if(m.type==='stock-in'||m.type==='transfer-in'||(m.type==='adjustment'&&m.qty>0)) inQ += Math.abs(m.qty);
        else if(m.type==='sold'||m.type==='transfer-out') outQ += Math.abs(m.qty);
        else if(m.type==='faulty') faultyQ += Math.abs(m.qty);
        else if(m.type==='deposit') depositQ += Math.abs(m.qty);
        else if(m.type==='adjustment'&&m.qty<0) outQ += Math.abs(m.qty);
      });
    });
    const afterIn = start+inQ;
    const remaining = afterIn - outQ - faultyQ - depositQ;
    return {start,inQ,afterIn,outQ,faultyQ,depositQ,remaining};
  }
  function deltaFor(m){
    if(m.type==='stock-in'||m.type==='transfer-in') return m.qty;
    if(m.type==='transfer-out'||m.type==='sold'||m.type==='faulty'||m.type==='deposit') return -m.qty;
    if(m.type==='adjustment') return m.qty;
    return 0;
  }

  let html = `
    <div class="toolbar">
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,-7);render()">← Prev week</button>
      <span style="font-weight:600;">${weekLabel(weekStart,weekEnd)}</span>
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,7);render()">Next week →</button>
      <div class="spacer"></div>
      <button class="btn" onclick="Views.printPage()">🖨 Export PDF</button>
      <button class="btn" onclick="Views.exportWeeklyCsv()">⬇ Export Excel (CSV)</button>
    </div>
  `;
  shops.forEach(s=>{
    let tS=0,tI=0,tAI=0,tO=0,tF=0,tD=0,tR=0;
    const catRows = Store.data.categories.map(c=>{
      const r = calcFor(s.id,c.id);
      tS+=r.start;tI+=r.inQ;tAI+=r.afterIn;tO+=r.outQ;tF+=r.faultyQ;tD+=r.depositQ;tR+=r.remaining;
      return `<tr><td>${esc(c.name)}</td><td>${r.start}</td><td>${r.inQ?'+'+r.inQ:0}</td><td>${r.afterIn}</td><td>${r.outQ?'-'+r.outQ:0}</td><td>${r.faultyQ||0}</td><td>${r.depositQ||0}</td><td><b>${r.remaining}</b></td></tr>`;
    }).join('');
    html += `
      <div class="card" style="margin-bottom:18px;">
        <div class="table-section-title">${esc(s.name)}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Category</th><th>Start of week</th><th>Stock in</th><th>After stock in</th><th>Stock out</th><th>Faulty</th><th>Deposit</th><th>Remaining</th></tr></thead>
          <tbody>
            <tr class="table-total-row"><td>All categories</td><td>${tS}</td><td>${tI?'+'+tI:0}</td><td>${tAI}</td><td>${tO?'-'+tO:0}</td><td>${tF}</td><td>${tD}</td><td>${tR}</td></tr>
            ${catRows}
          </tbody>
        </table></div>
      </div>`;
  });
  return html;
};
Views.exportWeeklyCsv = function(){
  const weekStart = Views._weekStart, weekEnd = isoAddDays(weekStart,6);
  const rows = [['Shop','Category','Start of week','Stock in','After stock in','Stock out','Faulty','Deposit','Remaining']];
  // Re-run same calc quickly by re-invoking Views.weekly's logic via DOM scrape is messy; recompute directly:
  const shops = nonWarehouseShops();
  shops.forEach(s=>{
    Store.data.categories.forEach(c=>{
      const itemsInCat = Store.data.items.filter(it=>it.category===c.id);
      let start=0, inQ=0, outQ=0, faultyQ=0, depositQ=0;
      itemsInCat.forEach(it=>{
        const moves = Store.data.movements.filter(m=>m.itemId===it.id && m.location===s.id);
        moves.filter(m=>m.date<weekStart).forEach(m=>{ start += (m.type==='stock-in'||m.type==='transfer-in')?m.qty:(m.type==='adjustment'?m.qty:-m.qty); });
        moves.filter(m=>m.date>=weekStart&&m.date<=weekEnd).forEach(m=>{
          if(m.type==='stock-in'||m.type==='transfer-in') inQ+=m.qty;
          else if(m.type==='sold') outQ+=m.qty;
          else if(m.type==='faulty') faultyQ+=m.qty;
          else if(m.type==='deposit') depositQ+=m.qty;
        });
      });
      const afterIn = start+inQ, remaining = afterIn-outQ-faultyQ-depositQ;
      rows.push([s.name, c.name, start, inQ, afterIn, outQ, faultyQ, depositQ, remaining]);
    });
  });
  csvDownload(`weekly_report_${weekStart}.csv`, rows);
  Toast.show('Weekly report exported.','ok');
};

Views.exportStockviewCsv = function(){
  const locId = Views._svLoc;
  const mode = Views._svMode;
  const items = Store.data.items.filter(it=> locId==='all' ? totalQty(it)>0 : (it.locations[locId]||0)>0);
  const groups = groupByCategory(items);
  if(mode==='imei'){
    const rows = [['Category','Name','IMEI','Colour','Condition','Cost Price','Wholesale Price','Sale Price','Location']];
    groups.forEach(g=>{
      g.items.forEach(it=>{
        const units = locId==='all' ? (it.units||[]) : unitsAt(it, locId);
        units.filter(u=>u.imei).forEach(u=>{
          rows.push([g.cat.name, it.name, u.imei, u.color||'', u.condition||'',
            u.costPrice||it.costPrice, u.wholesalePrice||it.wholesalePrice, u.sellPrice||it.shopPrices[u.location],
            shopName(u.location)]);
        });
      });
    });
    csvDownload(`stock_list_imei_${locId}.csv`, rows);
  } else {
    const rows = [['Category','Name','Colours','Cost Price','Wholesale Price','Sale Price','Condition','Qty']];
    groups.forEach(g=>{
      g.items.forEach(it=>{
        const qty = locId==='all'?totalQty(it):it.locations[locId];
        const sale = locId==='all'?it.shopPrices[activeShops()[0]?.id]:it.shopPrices[locId];
        rows.push([g.cat.name, it.name, (it.colors||[]).join(', '), it.costPrice, it.wholesalePrice||0, sale||0, it.condition, qty]);
      });
    });
    csvDownload(`stock_list_${locId}.csv`, rows);
  }
  Toast.show('Stock list exported.','ok');
};


/* ---- BEST SELLERS ---- */
Views._bsRange = 30;
Views.bestsellers = function(){
  const range = Views._bsRange;
  const cutoff = isoAddDays(todayISO(), -range);
  const sold = {};
  Store.data.movements.filter(m=>m.type==='sold' && m.date>=cutoff).forEach(m=>{
    sold[m.itemId] = (sold[m.itemId]||0) + m.qty;
  });
  const rows = Object.entries(sold).map(([id,q])=>({item:itemById(id),q})).filter(r=>r.item).sort((a,b)=>b.q-a.q);
  const max = Math.max(1,...rows.map(r=>r.q));

  return `
    <div class="toolbar">
      <div class="chip-select">
        ${[7,30,90].map(d=>`<button class="${range===d?'active':''}" onclick="Views._bsRange=${d};render()">Last ${d} days</button>`).join('')}
      </div>
    </div>
    <div class="card card-pad">
      <h3 style="margin-top:0;">Top sellers</h3>
      ${rows.length? rows.slice(0,20).map(r=>`
        <div class="bar-row">
          <div class="label">${esc(r.item.name)}</div>
          <div class="track"><div class="fill" style="width:${(r.q/max*100).toFixed(0)}%"></div></div>
          <div class="val">${r.q}</div>
        </div>`).join('') : '<div class="empty">No sales recorded in this period yet — mark items sold from <b>Shop Sales</b>.</div>'}
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="table-wrap"><table>
        <thead><tr><th>Item</th><th>Category</th><th>Sold (period)</th><th>Currently in stock</th><th></th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.item.name)}</td><td><span class="pill teal">${esc(catName(r.item.category))}</span></td>
          <td><b>${r.q}</b></td><td>${signalHtml(totalQty(r.item))} ${totalQty(r.item)}</td>
          <td><button class="btn sm" onclick="Views.addToReorder('${r.item.id}')">+ Add to reorder list</button></td>
        </tr>`).join('') || `<tr><td colspan="5"><div class="empty">Nothing to show yet.</div></td></tr>`}
        </tbody>
      </table></div>
    </div>
  `;
};
Views.addToReorder = function(itemId){
  if(Store.data.reorderList.find(r=>r.itemId===itemId)){ Toast.show('Already on the reorder list.'); return; }
  Store.data.reorderList.push({itemId, qty:5});

function reorderPeriodStart(){
  const p = Views._reorderPeriod;
  if(p==='since_last') return Store.data.reorderMeta.lastOrderDate || '2000-01-01';
  return isoAddDays(todayISO(), -Number(p));
}
function soldInPeriod(item, sinceDate){
  return Store.data.movements.filter(m=>m.itemId===item.id && m.type==='sold' && m.date>=sinceDate).reduce((a,m)=>a+m.qty,0);
}

            <label class="btn" style="cursor:pointer;">📂 Choose CSV files<input type="file" accept=".csv" multiple style="display:none;" onchange="Views.importShopCsvs(this)"></label>
          </div>
          <p style="color:var(--muted);font-size:12px;margin-top:10px;">Select all 7 shop CSV files if auto-load doesn't work (e.g. opening the file directly from Downloads).</p>
        </div>
        <div class="card card-pad" style="margin-top:16px;">
          <h3 style="margin-top:0;">Publish online (Cloudflare)</h3>
          <p style="color:var(--muted);font-size:13px;line-height:1.6;">
            This app is a single file — you can host it for free on <b>Cloudflare Pages</b>:<br>
            1. Download this page (use your browser's Save As, or ask for the file).<br>
            2. Go to the Cloudflare dashboard → Workers &amp; Pages → Create → Pages → upload the file.<br>
            3. Cloudflare gives you a public link you can open from any device.
          </p>
          <p style="color:var(--muted);font-size:13px;">
            Note: stock data is saved in the browser you're using (per device). For one shared list across all shops and devices, ask to connect this to a small cloud database — happy to help set that up next.
          </p>
        </div>
      </div>
      <div class="col" style="flex:1;min-width:320px;">
        <div class="card card-pad">
          <h3 style="margin-top:0;">Automatic snapshots (undo safety net)</h3>
          <p style="color:var(--muted);font-size:13px;">Saved automatically before risky actions (like removing a category or device), plus whenever you click "Quick backup" at the top of the screen.</p>
          <div class="table-wrap"><table>
            <thead><tr><th>When</th><th>Label</th><th></th></tr></thead>
            <tbody>
              ${backups.length? backups.map(b=>`<tr><td>${new Date(b.at).toLocaleString()}</td><td>${esc(b.label)}</td><td><button class="btn sm" onclick="Views.restoreSnapshot('${b.id}')">Restore</button></td></tr>`).join('') : `<tr><td colspan="3"><div class="empty">No snapshots yet.</div></td></tr>`}
            </tbody>
          </table></div>
        </div>
      </div>
    </div>
  `;
};
Views.fetchShopCsvs = function(){
  CsvImport.tryFetchAll().then(n=>{
    if(n>0){
      Store.data.meta.imeiImportedV2=true;
      Store.save();
      Toast.show(`Loaded ${n} device(s) with IMEI from CSV files.`,'ok');
      render();
    } else {
      Toast.show('Could not auto-load CSVs — use "Choose CSV files" and select all shop count spreadsheets.','err');
    }
  });
};
Views.importShopCsvs = function(input){
  const files = input.files;
  if(!files||!files.length){ Toast.show('Select at least one CSV file.','err'); return; }
  CsvImport.importFiles(files).then(n=>{
    Toast.show(n>0?`Imported ${n} device(s) with IMEI.`:'No new devices imported (may already exist).', n>0?'ok':'err');
    render();
  });
};
Views.downloadFullBackup = function(){
  const blob = new Blob([JSON.stringify(Store.data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stockline_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  Toast.show('Backup downloaded.','ok');
};
Views.restoreFromFile = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      Modal.confirm({
        title:'Restore from this file?',
        body:'<p>This will replace all current data with the contents of the uploaded backup. Your current data will be snapshotted first, just in case.</p>',
        danger:true, confirmText:'Restore',
        onConfirm:()=>{
          Store.snapshotToBackups('Before restoring from uploaded file');
          Store.data = data; Store.save(); Toast.show('Data restored.','ok'); render();
        }
      });
    }catch(err){ Toast.show('That file could not be read as a backup.','err'); }
  };
  reader.readAsText(file);
};
Views.restoreSnapshot = function(id){
  Modal.confirm({
    title:'Restore this snapshot?',
    body:'<p>Your current data will replace with this earlier snapshot. This action itself is also backed up first.</p>',
    danger:true, confirmText:'Restore',
    onConfirm:()=>{
      Store.snapshotToBackups('Before restoring snapshot');
      Store.restoreBackup(id);
      Toast.show('Restored.','ok'); render();
    }
  });
};
Views.addShop = function(){
  const name = val('newshop').trim();
  if(!name){ Toast.show('Enter a shop name.','err'); return; }
  const id = uid('shop');
  Store.data.shops.push({id,name,isWarehouse:false,active:true});
  Store.data.items.forEach(it=>{ it.locations[id]=0; it.shopPrices[id]=it.shopPrices.warehouse||0; });
  Store.save(); Toast.show('Shop added.','ok'); render();
};

/* =========================================================================
   INIT
   ========================================================================= */
Store.load();
render();
</script>
</body>
</html>
