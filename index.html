Views.exportFilteredCsv = function(){
  const shopId = document.getElementById('exp_shop')?.value || 'all';
  const checkedCats = Array.from(document.querySelectorAll('.exp-cat-cb:checked')).map(cb => cb.value);
  const incImei = !!document.getElementById('exp_col_imei')?.checked;
  const incColor = !!document.getElementById('exp_col_color')?.checked;
  const incCond = !!document.getElementById('exp_col_cond')?.checked;
  const incBatt = !!document.getElementById('exp_col_batt')?.checked;
  const incSale = !!document.getElementById('exp_col_sale')?.checked;
  const incCost = !!document.getElementById('exp_col_cost')?.checked;

  const headers = ['Category', 'Device Name', 'Memory'];
  if(incImei) headers.push('IMEI / Serial');
  if(incColor) headers.push('Colour');
  if(incCond) headers.push('Condition');
  if(incBatt) headers.push('Battery %');
  if(shopId === 'all') headers.push('Store Location');
  if(incCost) headers.push('Cost Price');
  if(incSale) headers.push('Sale Price');

  const rows = [headers];

  (Store.data.categories || []).forEach(c => {
    if(!checkedCats.includes(c.id)) return;
    (Store.data.items || []).forEach(it => {
      if(it.category !== c.id) return;
      (it.units || []).forEach(u => {
        if(shopId === 'all' || u.location === shopId){
          const row = [c.name, it.name, it.memory || ''];
          if(incImei) row.push(u.imei || '');
          if(incColor) row.push(u.color || '');
          if(incCond) row.push(u.condition || 'Used');
          if(incBatt) row.push(u.batteryPct != null ? u.batteryPct + '%' : '');
          if(shopId === 'all') row.push(shopName(u.location));
          if(incCost) row.push(u.costPrice != null ? u.costPrice : it.costPrice || 0);
          if(incSale) row.push(u.sellPrice != null ? u.sellPrice : (it.shopPrices && it.shopPrices[u.location]) || 0);
          rows.push(row);
        }
      });
    });
  });

  const filename = `stock_audit_${shopId}_${todayISO()}.csv`;
  csvDownload(filename, rows);
  Modal.close();
  Toast.show(`Exported ${rows.length - 1} records to ${filename}.`, 'ok');
};

};

Views.toggleShopPortalStatus = function(shopId){

      enabled: true, allowCostPrice: false, allowSalePrice: true,
      allowEditImei: true, allowEditDetails: true, allowVerify: true, allowAddDevice: true
    };
  }
  const curr = Store.data.meta.shopPortals[shopId].enabled;
  Store.data.meta.shopPortals[shopId].enabled = !curr;
  Store.save();
  Toast.show(`${shopName(shopId)} live link is now ${!curr ? '🟢 LIVE (Open for edits)' : '🔴 UNALIVE (Locked/Closed)'}.`, 'ok');
  render();
};

Views.updateShopPortalPerm = function(shopId, permKey, val){
  if(!Store.data.meta) Store.data.meta = {};
  if(!Store.data.meta.shopPortals) Store.data.meta.shopPortals = {};
  if(!Store.data.meta.shopPortals[shopId]){
    Store.data.meta.shopPortals[shopId] = {
      enabled: true, allowCostPrice: false, allowSalePrice: true,
      allowEditImei: true, allowEditDetails: true, allowVerify: true, allowAddDevice: true
    };
  }
  Store.data.meta.shopPortals[shopId][permKey] = val;
  Store.save();
  Toast.show(`Updated permission for ${shopName(shopId)}.`, 'ok');
};

Views.savePortalBattery = function(itemId, unitId, rawVal){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const val = (rawVal||'').trim() === '' ? null : Math.max(0, Math.min(100, parseInt(rawVal)||0));
  unit.batteryPct = val;
  Store.save();
  Toast.show(val != null ? `Battery ${val}% saved.` : 'Battery cleared.', 'ok');
};

Views.shopPortal = function(shopId){
  const shop = Store.data.shops.find(s => s.id === shopId) || { id: shopId, name: shopName(shopId) };
  const portals = (Store.data.meta && Store.data.meta.shopPortals) || {};
  const cfg = portals[shopId] || {
    enabled: true,
    allowEditName: true,
    allowCostPrice: false,
    allowSalePrice: true,
    allowEditImei: true,
    allowVerify: true,
    allowAddDevice: true,
    allowEditActions: true
  };

  // If unalive / locked
  if(!cfg.enabled){
    return `
      <div style="max-width:560px;margin:40px auto;padding:36px 28px;background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.06);text-align:center;border:1px solid #E2E8F0;">
        <div style="width:64px;height:64px;border-radius:50%;background:#FEF2F2;color:#DC2626;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">🔒</div>
        <h2 style="color:#0F172A;font-size:22px;margin:0 0 8px 0;font-weight:800;">Stock Audit Closed</h2>
        <p style="color:#64748B;font-size:14px;line-height:1.5;margin:0 0 20px 0;">
          The inventory verification portal for <b>${esc(shop.name)}</b> is currently <b>locked / closed</b> by Head Office.
        </p>
        <div style="background:#F8FAFC;padding:12px 16px;border-radius:8px;font-size:13px;color:#334155;border:1px solid #E2E8F0;">
          If you need to perform a stock audit, please contact your manager to open this session.
        </div>
      </div>
    `;
  }

  const f = Views._portalFilter;
  const categories = Store.data.categories || [];
  
  // Gather devices only at this location
  let totalUnitsCount = 0;
  let verifiedCount = 0;
  const itemsWithUnits = [];

  (Store.data.items || []).forEach(it => {
    const units = (it.units || []).filter(u => u && u.location === shopId);
    if(units.length > 0){
      totalUnitsCount += units.length;
      units.forEach(u => { if(u.verified) verifiedCount++; });
      itemsWithUnits.push({ item: it, units });
    }
  });

  // Filter items
  const filtered = itemsWithUnits.filter(({item: it, units}) => {
    if(f.cat !== 'all' && it.category !== f.cat) return false;
    if(f.q){
      const q = f.q.toLowerCase().trim();
      const matchName = it.name.toLowerCase().includes(q) || (it.memory||'').toLowerCase().includes(q);
      const matchImei = units.some(u => (u.imei||'').toLowerCase().includes(q) || (u.color||'').toLowerCase().includes(q));
      if(!matchName && !matchImei) return false;
    }
    return true;
  });

  const catPills = categories.map(c => {
    const count = itemsWithUnits.filter(({item: it}) => it.category === c.id).reduce((sum, x) => sum + x.units.length, 0);
    if(count === 0) return '';
    return `<button class="chip ${f.cat===c.id?'active':''}" onclick="Views._portalFilter.cat='${c.id}';render();">${esc(c.name)} <span class="badge">${count}</span></button>`;
  }).filter(Boolean).join('');

  let tableRows = '';
  let rowIdx = 1;

  filtered.forEach(({item: it, units}) => {
    units.forEach(u => {
      const isVerified = !!u.verified;
      const imeiInput = cfg.allowEditImei !== false 
        ? `<input class="mono" id="imei_inp_${u.id}" value="${esc(u.imei||'')}" placeholder="Scan / enter IMEI" onchange="Views.saveInlineImei('${it.id}','${u.id}',this.value)" style="width:170px;font-weight:700;padding:4px 8px;border-radius:4px;border:1.5px solid ${isVerified?'#86EFAC':'#CBD5E1'};background:${isVerified?'#F0FDF4':'#fff'};font-size:12px;">`
        : `<span class="mono" style="font-weight:700;font-size:12px;color:#334155;">${esc(u.imei||'(No IMEI)')}</span>`;

      const verifyBtn = cfg.allowVerify !== false
        ? `<button class="btn sm ${isVerified?'green':'ghost'}" onclick="Views.toggleUnitVerified('${it.id}','${u.id}');render();" title="${isVerified?'Verified OK':'Click to Mark Checked & Verified OK'}">${isVerified?'✓ OK':'🔍 Check'}</button>`
        : (isVerified ? `<span class="pill green" style="font-size:11px;font-weight:700;">✓ OK</span>` : `<span style="color:#94A3B8;font-size:11px;">Pending</span>`);

      const battInput = `<input type="number" min="0" max="100" value="${u.batteryPct!=null?u.batteryPct:''}" placeholder="—" onchange="Views.savePortalBattery('${it.id}','${u.id}',this.value)" style="width:48px;text-align:center;padding:3px 4px;font-size:11.5px;border:1px solid #CBD5E1;border-radius:4px;">`;

      const costCol = cfg.allowCostPrice 
        ? `<td style="text-align:right;"><input type="number" step="0.01" min="0" value="${u.costPrice!=null?u.costPrice:it.costPrice}" oninput="Views.invSetCostPrice('${it.id}','${u.id}',this.value,false)" onchange="Views.invSetCostPrice('${it.id}','${u.id}',this.value,true)" onkeydown="if(event.key==='Enter')this.blur()" style="width:75px;text-align:right;padding:4px 6px;border:1px solid #CBD5E1;border-radius:4px;font-size:12px;"></td>` 
        : '';
      const salePriceVal = (u.sellPrice != null && u.sellPrice > 0) ? u.sellPrice : ((it.shopPrices && it.shopPrices[shopId]) || 0);
      const saleCol = cfg.allowSalePrice !== false 
        ? `<td style="text-align:right;">
             <input type="number" step="0.01" min="0" value="${salePriceVal}" oninput="Views.invSetSalePrice('${it.id}','${u.id}','${shopId}',this.value,false)" onchange="Views.invSetSalePrice('${it.id}','${u.id}','${shopId}',this.value,true)" onkeydown="if(event.key==='Enter')this.blur()" style="width:75px;text-align:right;font-weight:700;padding:4px 6px;border:1px solid #CBD5E1;border-radius:4px;font-size:12px;">
           </td>` 
        : '';

      const nameHtml = cfg.allowEditActions !== false 
        ? `<a href="javascript:void(0)" onclick="Views.openEditUnitModal('${it.id}','${u.id}','${shopId}')" style="font-weight:700;color:var(--teal-dark);text-decoration:underline;" title="Click to edit device details">${esc(it.name)}</a>`
        : `<div style="font-weight:700;color:var(--ink);">${esc(it.name)}</div>`;

      const actionsCol = cfg.allowEditActions !== false 
        ? `<td style="text-align:center;white-space:nowrap;">
             <button class="btn sm" onclick="Views.openEditUnitModal('${it.id}','${u.id}','${shopId}')" title="Edit Model Name, Memory, Colour, Condition, Sale Price, IMEI">✏️ Edit</button>
           </td>`
        : '';

      tableRows += `
        <tr style="${isVerified?'background:#F0FDF4;':''}">
          <td style="text-align:center;color:#64748B;font-size:11px;">${rowIdx++}</td>
          <td>
            ${nameHtml}
            <div style="font-size:11px;color:var(--muted);">${esc(catName(it.category))} · ${esc(it.memory||'')}</div>
          </td>
          <td>
            <div style="display:flex;align-items:center;gap:6px;">
              ${imeiInput}
              ${verifyBtn}
            </div>
          </td>
          <td>${esc(u.color||'-')}</td>
          <td><span class="pill sm ${u.condition==='New'?'green':'blue'}">${esc(u.condition||'Used')}</span></td>
          <td style="text-align:center;">${battInput}</td>
          ${costCol}
          ${saleCol}
          ${actionsCol}
        </tr>
      `;
    });
  });

  return `
    <div style="margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 18px;border-radius:10px;border:1px solid #E2E8F0;box-shadow:0 1px 3px rgba(0,0,0,.04);flex-wrap:wrap;gap:12px;">
      <div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:22px;">📍</span>
          <h2 style="margin:0;font-size:18px;font-weight:800;color:#0F172A;">${esc(shop.name)} — Store Inventory Portal</h2>
          <span class="pill green" style="font-weight:700;font-size:11px;">🟢 LIVE SESSION</span>
        </div>
        <div style="color:#64748B;font-size:12.5px;margin-top:3px;">
          Audited: <b>${verifiedCount} / ${totalUnitsCount}</b> devices checked (${totalUnitsCount>0?Math.round((verifiedCount/totalUnitsCount)*100):0}%) · Cloud Auto-Sync active
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn sm" onclick="Views.openPdfExportModal()"><span class="ic">📄</span> Print / PDF Sheet</button>
        ${cfg.allowAddDevice!==false ? `<button class="btn sm primary" style="background:#0F766E;" onclick="Views.openItemModal(null, '${shopId}')">+ Add Device</button>` : ''}
      </div>
    </div>

    <div class="toolbar" style="flex-wrap:wrap;gap:8px;margin-bottom:14px;">
      <div class="chip-select" style="flex-wrap:wrap;">
        <button class="chip ${f.cat==='all'?'active':''}" onclick="Views._portalFilter.cat='all';render();">All Categories <span class="badge">${totalUnitsCount}</span></button>
        ${catPills}
      </div>
      <div class="spacer"></div>
      <div class="search-input">
        <span class="ic">🔎</span>
        <input placeholder="Search device or scan IMEI…" value="${esc(f.q)}" oninput="Views._portalFilter.q=this.value;render();">
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table class="inv-flat">
          <thead>
            <tr>
              <th style="width:40px;text-align:center;">#</th>
              <th>Device Model & Spec</th>
              <th>IMEI & Verification</th>
              <th>Colour</th>
              <th>Condition</th>
              <th style="width:65px;text-align:center;">Battery %</th>
              ${cfg.allowCostPrice ? '<th style="text-align:right;">Cost Price (€)</th>' : ''}
              ${cfg.allowSalePrice !== false ? '<th style="text-align:right;">Sale Price (€)</th>' : ''}
              ${cfg.allowEditActions !== false ? '<th style="width:75px;text-align:center;">Actions</th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${tableRows || `<tr><td colspan="9" style="text-align:center;padding:30px;color:#64748B;">No devices found matching this filter at ${esc(shop.name)}.</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
};

/* ---- UNTRACKED / NO-IMEI STOCK HANDLERS ---- */
Views.cleanAllUntracked = function(){
  Modal.confirm({
    title: 'Clean all untracked (no-IMEI) balances?',
    body: '<p>This will adjust all stock counts so they match <b>only your exact tracked IMEI devices</b>.</p><p>Any ghost opening balances that do not have an IMEI number will be removed immediately.</p>',
    danger: true,
    confirmText: '🧹 Clean untracked counts',
    onConfirm: ()=>{
      let cleaned = 0;
      Store.data.items.forEach(it=>{
        Store.data.shops.forEach(s=>{
          const trackedCount = unitsAt(it, s.id).length;
          if((it.locations[s.id]||0) > trackedCount){
            cleaned += ((it.locations[s.id]||0) - trackedCount);
            it.locations[s.id] = trackedCount;
          }
        });
      });
      Store.save();
      Toast.show(`Cleaned ${cleaned} untracked balance(s). All stock now matches exact IMEIs.`,'ok');
      render();
    }
  });
};

Views.removeUntrackedStock = function(itemId, shopId){
  const it = itemById(itemId); if(!it) return;
  const untracked = untrackedQtyAt(it, shopId);
  const qtyToClear = untracked > 0 ? untracked : (it.locations[shopId]||0);
  Modal.confirm({
    title: `Clear untracked ${esc(it.name)}?`,
    body: `<p>Remove the ${qtyToClear} non-IMEI unit(s) for <b>${esc(it.name)}</b> at <b>${esc(shopName(shopId))}</b>?</p>`,
    danger: true,
    confirmText: 'Clear from store',
    onConfirm: ()=>{
      it.locations[shopId] = unitsAt(it, shopId).length;
      Store.save();
      Toast.show(`Cleared untracked balance for ${it.name} at ${shopName(shopId)}.`,'ok');
      render();
    }
  });
};

Views.saveAssignedImei = function(itemId, shopId){
  const it = itemById(itemId); if(!it) return;
  const imei = val('au_imei').replace(/[\s\-']/g,'');
  if(!imei || imei.length < 8){ Toast.show('Please enter a valid IMEI number.','err'); return; }
  const existing = findUnitByImei(imei);
  if(existing){ Toast.show(`IMEI ${imei} is already in use by ${existing.item.name}.`,'err'); return; }
  const color = val('au_color').trim();
  const cond = val('au_cond');
  
  Stock.addUnit(itemId, shopId, {
    imei, color, condition: cond,
    costPrice: it.costPrice,
    sellPrice: it.shopPrices[shopId] || it.costPrice
  }, todayISO(), 'Assigned IMEI to untracked stock');

  Store.save();
  Modal.close();
  Toast.show(`Added ${it.name} (IMEI ${imei}) at ${shopName(shopId)}.`,'ok');
  render();
};

  const shops = activeShops();
  const currentPortalShop = portalShopId || Router.getPortalShopId();
  const portals = (Store.data.meta && Store.data.meta.shopPortals) || {};
  const cfg = currentPortalShop ? (portals[currentPortalShop] || {}) : null;
  const showCost = !cfg || cfg.allowCostPrice === true;

  const cost = unit.costPrice != null ? unit.costPrice : (it.costPrice || 0);

  const locSelectHtml = currentPortalShop ? `

      <label>Location</label>

  ` : `

        ${shops.map(s=>`<option value="${s.id}" ${unit.location===s.id?'selected':''}>${esc(s.name)}${s.isWarehouse?' (Warehouse)':''}</option>`).join('')}
      </select>

  `;

  const priceFieldsHtml = showCost ? `
    <div class="field-grid" style="grid-template-columns:1fr 1fr;">
      <div class="field">
        <label>Cost Price (€)</label>
        <input id="eu_cost" type="number" step="0.01" value="${cost}">
      </div>
      <div class="field">
        <label>Sale Price (€)</label>

Views.saveEditedUnit = function(itemId, unitId){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;

  const newName = (val('eu_name')||'').trim() || it.name;
  if(!newName){ Toast.show('Please enter a device model/name.','err'); return; }
  const newCat = val('eu_cat') || it.category;
  let newMem = val('eu_mem').trim();
  if(newMem){
    newMem = newMem.replace(/\s+/g, '').replace(/gb/gi, 'GB');
    if(/^\d+$/.test(newMem)) newMem = newMem + 'GB';
  }
  const newImei = val('eu_imei').replace(/[\s\-']/g,'');
  const newColor = val('eu_color').trim();
  const newCond = val('eu_cond');
  const newBatt = val('eu_batt').trim() !== '' ? Number(val('eu_batt')) : null;
  const newVerified = !!document.getElementById('eu_verified')?.checked;
  const newLoc = val('eu_loc');
  const newCost = Math.max(0, parseFloat(val('eu_cost'))||0);
  const newSale = Math.max(0, parseFloat(val('eu_sale'))||0);

  // Check duplicate IMEI if changed
  if(newImei && newImei.toLowerCase() !== (unit.imei||'').toLowerCase()){
    const existing = findUnitByImei(newImei);
    if(existing && existing.unit.id !== unit.id){
      Toast.show(`IMEI ${newImei} is already assigned to ${existing.item.name}.`,'err');
      return;
    }
  }

  // Handle location change if changed
  const oldLoc = unit.location;
  if(newLoc && newLoc !== oldLoc){
    it.locations[oldLoc] = Math.max(0, (it.locations[oldLoc]||0) - 1);
    it.locations[newLoc] = (it.locations[newLoc]||0) + 1;
    unit.location = newLoc;
    Stock.addMovement({
      type: 'transfer-out',
      itemId: it.id, itemName: newName, categoryId: newCat,
      location: oldLoc, toLocation: newLoc, fromLocation: oldLoc,
      qty: 1, date: todayISO(), note: `Transferred to ${shopName(newLoc)} (${newImei ? 'IMEI ' + newImei : 'Unit ' + unit.id})`
    });
    Stock.addMovement({
      type: 'transfer-in',
      itemId: it.id, itemName: newName, categoryId: newCat,
      location: newLoc, toLocation: newLoc, fromLocation: oldLoc,
      qty: 1, date: todayISO(), note: `Transferred from ${shopName(oldLoc)} (${newImei ? 'IMEI ' + newImei : 'Unit ' + unit.id})`
    });
  }

  // Update unit specifications
  unit.imei = newImei;
  unit.color = newColor;
  unit.condition = newCond;
  unit.batteryPct = newBatt;
  unit.verified = newVerified;
  unit.verifiedAt = newVerified ? (unit.verifiedAt || todayISO()) : null;
  unit.costPrice = newCost;
  unit.sellPrice = newSale;

  const canonOld = (it.name + '|' + it.category + '|' + (it.memory||'')).toLowerCase();
  const canonNew = (newName + '|' + newCat + '|' + newMem).toLowerCase();

  // If model specification (Name / Category / Memory) changed:
  if(canonNew !== canonOld){
    // 1. Detach unit from old item
    it.units = (it.units||[]).filter(u => u.id !== unit.id);
    it.locations[unit.location] = Math.max(0, (it.locations[unit.location]||0) - 1);

    // 2. Find or create target item model
    let targetItem = Store.data.items.find(x => ((x.name + '|' + x.category + '|' + (x.memory||'')).toLowerCase() === canonNew));
    if(!targetItem){
      if((it.units||[]).length === 0){
        // Reuse old item object if it became empty
        it.name = newName;
        it.category = newCat;
        it.memory = newMem;
        if(newColor && !it.colors.includes(newColor)) it.colors.push(newColor);
        it.locations[unit.location] = (it.locations[unit.location]||0) + 1;
        it.units.push(unit);
      } else {
        targetItem = {
          id: uid('item'),
          name: newName,
          category: newCat,
          memory: newMem,
          condition: newCond,
          colors: newColor ? [newColor] : (it.colors||[]),
          costPrice: newCost,
          shopPrices: JSON.parse(JSON.stringify(it.shopPrices || {})),
          locations: {},
          units: [unit],
          createdAt: todayISO()
        };
        Store.data.shops.forEach(s => { targetItem.locations[s.id] = 0; });
        targetItem.locations[unit.location] = 1;
        Store.data.items.push(targetItem);
      }
    } else {
      // Merge unit into targetItem
      if(newColor && !targetItem.colors.includes(newColor)) targetItem.colors.push(newColor);
      targetItem.locations[unit.location] = (targetItem.locations[unit.location]||0) + 1;
      if(!Array.isArray(targetItem.units)) targetItem.units = [];
      targetItem.units.push(unit);

      // If old item is now completely empty (0 units and 0 total stock), delete old empty item
      if((it.units||[]).length === 0 && Object.values(it.locations||{}).every(v => v === 0)){
        Store.data.items = Store.data.items.filter(x => x.id !== it.id);
      }
    }
  } else {
    // Model didn't change
    it.name = newName;
    it.category = newCat;
    it.memory = newMem;
    if(newColor && !it.colors.includes(newColor)) it.colors.push(newColor);
  }

  Store.save();
  Modal.close();
  Toast.show(`Saved ${newName} (${shopName(unit.location)}).`,'ok');
  render();
};

Views.drawerRemoveUnit = function(itemId, unitId){
  const it = itemById(itemId); if(!it) return;
  const unit = (it.units||[]).find(u=>u.id===unitId);
  Modal.confirm({
    title: 'Delete this device record?',
    body: `<p>This will <b>silently remove</b> IMEI <b>${esc(unit?unit.imei||'(no IMEI)':'')}</b> from ${esc(shopName(unit?unit.location:''))} — no stock-in, stock-out or faulty entry will be created. Use this only to correct a data entry mistake.</p>`,
    danger: true, confirmText: 'Delete record',
    onConfirm: ()=>{
      const idx = (it.units||[]).findIndex(u=>u.id===unitId);
      if(idx >= 0){
        const loc = it.units[idx].location;
        const uImei = (it.units[idx].imei || '').trim().toLowerCase();
        it.units.splice(idx, 1);
        it.locations[loc] = Math.max(0, (it.locations[loc]||0) - 1);
        if(it.imei && uImei && String(it.imei).trim().toLowerCase() === uImei){
          delete it.imei;
        }
        if(it.units.length === 0){
          activeShops().forEach(s => {
            if((it.locations[s.id]||0) <= 0) it.locations[s.id] = 0;
          });
        }
        Store.save();
      }
      Toast.show('Device record deleted (no movement logged).','ok');
      render();
    }
  });
};

Views.drawerConfirmTransfer = function(itemId, unitId){
  const it = itemById(itemId); const unit = (it.units||[]).find(u=>u.id===unitId); if(!unit) return;
  const to = val('dwt_to');
  const from = unit.location;
  if(unit.imei){
    Stock.transferUnitByImei(unit.imei, to, todayISO(), 'Transferred from Inventory drawer');
  } else {
    it.locations[from] = Math.max(0,(it.locations[from]||0)-1);
    it.locations[to] = (it.locations[to]||0)+1;
    unit.location = to;
    Stock.addMovement({type:'transfer-out', itemId:it.id, itemName:it.name, categoryId:it.category, location:from, toLocation:to, qty:1, date:todayISO(), note:'Transferred from Inventory drawer'});
    Stock.addMovement({type:'transfer-in', itemId:it.id, itemName:it.name, categoryId:it.category, location:to, fromLocation:from, qty:1, date:todayISO(), note:'Transferred from Inventory drawer'});
    Store.save();
  }
  Toast.show('Device transferred.','ok');
  Modal.close();
  Views.openDeviceDrawer(itemId);
  render();
};

Views.saveItem = function(itemId){
  let name = val('f_name').trim();
  if(!name){ Toast.show('Please enter a product name.','err'); return; }
  const cat = val('f_cat');
  let mem = val('f_mem').trim();
  if(mem){
    mem = mem.replace(/\s+/g, '').replace(/gb/gi, 'GB');
    if(/^\d+$/.test(mem)) mem = mem + 'GB';
  }
  const cond = val('f_cond') || 'New';
  const batt = val('f_batt');
  const isGeneric = !!document.getElementById('f_generic')?.checked || (!val('f_imei').trim() && (cat === 'cat_u83iatxw69i' || cat === 'cat_qaxr5vow69i'));
  const imei = isGeneric ? '' : val('f_imei').trim();

  if(imei){
    const existing = findUnitByImei(imei);
    if(existing){
      const itTarget = itemId ? itemById(itemId) : null;
      const isSelf = itTarget && existing.item.id === itemId && (itTarget.units||[]).some(x=>x.imei===imei);
      if(!isSelf){
        Toast.show(`⚠️ IMEI ${imei} already belongs to ${existing.item.name} at ${shopName(existing.unit.location)}. Cannot duplicate IMEI.`, 'err');
        return;
      }
    }
  }

  // Collect all colors
  const colorInps = Array.from(document.querySelectorAll('.modal-color-input')).map(i => i.value.trim()).filter(Boolean);
  let rawColors = colorInps.length ? colorInps : (val('f_color')||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!rawColors.length) rawColors = ['Black'];
  const primaryColor = rawColors[0];

  const cost = parseFloat(val('f_cost'))||0;
  const salePriceOverride = val('f_saleprice') !== null ? (parseFloat(val('f_saleprice'))||0) : null;
  const openLoc = val('f_openloc') || 'warehouse';
  const qty = isGeneric ? Math.max(0, parseInt(val('f_qty')) || 0) : 1;
  const supplier = (val('f_supplier')||'').trim();
  const invoice = (val('f_invoice')||'').trim();

  if(supplier && Array.isArray(Store.data.suppliers) && !Store.data.suppliers.includes(supplier)){
    Store.data.suppliers.push(supplier);
  }

  if(itemId){
    const it = itemById(itemId);
    if(it){
      it.name = name;
      it.category = cat;
      it.memory = mem;
      it.condition = cond;
      it.batteryPct = batt===''?null:Number(batt);
      it.costPrice = cost;
      it.colors = [...new Set(rawColors)];
      if(!Array.isArray(it.units)) it.units = [];

      if(imei){
        let u = it.units.find(x => x.imei && x.imei.toLowerCase() === imei.toLowerCase());
        if(!u){
          u = it.units.find(x => !x.imei && x.location === openLoc) || it.units.find(x => !x.imei);
        }
        if(!u){
          u = {
            id: uid('unit'),
            imei: imei,
            color: primaryColor,
            condition: cond,
            batteryPct: batt===''?null:Number(batt),
            location: openLoc,
            costPrice: cost || it.costPrice || 0,
            sellPrice: (salePriceOverride !== null && salePriceOverride > 0) ? salePriceOverride : ((it.shopPrices && it.shopPrices[openLoc]) || cost || 0),
            addedAt: todayISO()
          };
          it.units.push(u);
          if((it.locations[openLoc]||0) < unitsAt(it, openLoc).length){
            it.locations[openLoc] = unitsAt(it, openLoc).length;
          }
        } else {
          u.imei = imei;
          u.color = primaryColor;
          u.condition = cond;
          u.costPrice = cost;
          u.location = openLoc;
          if(batt!=='') u.batteryPct = Number(batt);
        }
      } else if(isGeneric || !imei){
        delete it.imei;
        const trackedAtLoc = unitsAt(it, openLoc).length;
        if(!it.locations) it.locations = {};
        it.locations[openLoc] = trackedAtLoc + qty;
      }
    }
  } else {
    const canonKey = (name + '|' + cat + '|' + mem).toLowerCase();
    let it = Store.data.items.find(x => ((x.name + '|' + x.category + '|' + (x.memory||'')).toLowerCase() === canonKey));

    if(!it){
      it = {
        id: uid('item'),
        name: name,
        category: cat,
        memory: mem,
        condition: cond,
        batteryPct: batt===''?null:Number(batt),
        imei: imei || '',
        colors: [...new Set(rawColors)],
        costPrice: cost,
        shopPrices: {},
        locations: {},
        units: [],
        createdAt: todayISO()
      };
      Store.data.shops.forEach(s => {
        it.locations[s.id] = 0;
        it.shopPrices[s.id] = cost > 0 ? (cost + 30) : 0;
      });
      Store.data.items.push(it);
    } else {
      rawColors.forEach(c => { if(!it.colors.includes(c)) it.colors.push(c); });
      if(cost > 0 && (it.costPrice <= 1 || it.costPrice == null)){
        it.costPrice = cost;
      } else if(cost === 0){
        it.costPrice = 0;
      }
    }

    it.locations[openLoc] = (it.locations[openLoc] || 0) + qty;

    if(!isGeneric && imei){
      const newUnit = {
        id: uid('unit'),
        imei: imei,
        color: primaryColor,
        condition: cond,
        batteryPct: batt===''?null:Number(batt),
        location: openLoc,
        costPrice: cost,
        sellPrice: (salePriceOverride !== null && salePriceOverride > 0) ? salePriceOverride : ((it.shopPrices && it.shopPrices[openLoc]) || cost || 0),
        addedAt: todayISO()
      };
      if(!Array.isArray(it.units)) it.units = [];
      it.units.push(newUnit);
    }
  }

  Store.save();
  Modal.close();
  Toast.show(qty > 1 ? `${qty} units added to ${shopName(openLoc)}.` : 'Product saved successfully.', 'ok');
  render();
};

Views.doStockIn = function(){
  const itemId = val('si_item');
  const loc = val('si_loc');
  const date = val('si_date')||todayISO();
  const supplier = val('si_supplier').trim();
  const invoice = val('si_invoice').trim();
  const note = val('si_note').trim();
  const imei = val('si_imei').trim();

  if(supplier && Array.isArray(Store.data.suppliers) && !Store.data.suppliers.includes(supplier)){
    Store.data.suppliers.push(supplier);
  }

  if(imei){
    const unit = Stock.addUnit(itemId, loc, {
      imei, color: val('si_color'), condition: val('si_cond'),
      costPrice: val('si_cost')?Number(val('si_cost')):null, sellPrice: val('si_sell')?Number(val('si_sell')):null
    }, date, note, true, supplier, invoice);
    if(unit) Toast.show(`Device added to ${shopName(loc)}.`,'ok');
  } else {
    const qty = Number(val('si_qty'))||0;
    if(qty<=0){ Toast.show('Enter a quantity greater than 0.','err'); return; }
    Stock.stockIn(itemId, qty, date, note, loc, supplier, invoice);
    Toast.show(`Stock received into ${shopName(loc)}.`,'ok');
  }
  render();
};

/* =========================================================================
   HISTORY: Date-wise Stock In, Stock Out & Faulty Records (Minimizable Batches)
   ========================================================================= */
Views._historyTab = 'stockin'; // 'stockin', 'stockout', 'faulty'
Views._historyFilter = { shop: 'all', search: '' };
Views._historySubFilter = Views._historySubFilter || 'all';
Views._historyExpandedDates = Views._historyExpandedDates || {};

Views.history = function(){
  const tab = Views._historyTab || 'stockin';
  const f = Views._historyFilter || { shop: 'all', search: '' };
  const subFilter = Views._historySubFilter || 'all';
  const shops = activeShops();
  const moves = (Store.data.movements || []).slice();

  const faultyCount = moves.filter(m => m && m.type === 'faulty' && m.faultyStatus !== 'received_warehouse').length;

  // Stock Out & Transfers Activity Counts
  const allOutMoves = moves.filter(m => {
    if(!m) return false;
    if(!['sold', 'transfer-out', 'deposit'].includes(m.type) && m.type !== 'faulty'){
      if(m.type === 'transfer-in'){
        const hasOut = moves.some(o => o.type === 'transfer-out' && o.itemId === m.itemId && o.date === m.date && o.toLocation === m.location);
        if(hasOut) return false;
      } else return false;
    }
    if(f.shop !== 'all' && m.location !== f.shop && m.toLocation !== f.shop && m.fromLocation !== f.shop) return false;
    return true;
  });

  const countTransfers = allOutMoves.filter(m => m.type === 'transfer-out' || m.type === 'transfer-in').length;
  const countSold = allOutMoves.filter(m => m.type === 'sold').length;
  const countFaultyOut = allOutMoves.filter(m => m.type === 'faulty').length;
  const countDeposit = allOutMoves.filter(m => m.type === 'deposit').length;
  const countAllOut = allOutMoves.length;

  // Filter movements
  let filtered = moves.filter(m => {
    if(!m) return false;
    if(tab === 'stockin'){
      if(m.type !== 'stock-in') return false;
    } else if(tab === 'faulty'){
      if(m.type !== 'faulty') return false;
    } else {
      // Stock Out & Transfers
      if(!['sold', 'transfer-out', 'deposit'].includes(m.type) && m.type !== 'faulty') {
        // Only include transfer-in if there's no matching transfer-out in the dataset
        if(m.type === 'transfer-in'){
          const hasOut = moves.some(o => o.type === 'transfer-out' && o.itemId === m.itemId && o.date === m.date && o.toLocation === m.location);
          if(hasOut) return false; // Deduplicate paired transfer
        } else {
          return false;
        }
      }
      if(subFilter === 'transfer' && !(m.type === 'transfer-out' || m.type === 'transfer-in')) return false;
      if(subFilter === 'sold' && m.type !== 'sold') return false;
      if(subFilter === 'faulty' && m.type !== 'faulty') return false;
      if(subFilter === 'deposit' && m.type !== 'deposit') return false;
    }
    if(f.shop !== 'all' && m.location !== f.shop && m.toLocation !== f.shop && m.fromLocation !== f.shop) return false;
    if(f.search){
      const q = f.search.toLowerCase();
      const match = (m.itemName||'').toLowerCase().includes(q) ||
                    (m.unitData?.imei||'').toLowerCase().includes(q) ||
                    (m.unitData?.color||'').toLowerCase().includes(q) ||
                    (m.supplier||'').toLowerCase().includes(q) ||

Views.saveBulkEditBatch = function(dateKey){
  const sup = val('be_supplier').trim();
  const inv = val('be_invoice').trim();
  if(sup && Array.isArray(Store.data.suppliers) && !Store.data.suppliers.includes(sup)){
    Store.data.suppliers.push(sup);
  }
  const moves = (Store.data.movements || []).filter(m => m.date === dateKey && (m.type==='stock-in'||m.type==='transfer-in'));
  moves.forEach(m => {
    if(sup) m.supplier = sup;
    if(inv) m.invoice = inv;
  });
  Store.save();
  Modal.close();
  Toast.show(`Updated ${moves.length} device records for ${dateKey}.`,'ok');
  render();
};
Views.doBulkStockIn = function(){
  const raw = val('si_bulk').trim();
  const loc = val('si_bulk_loc') || 'warehouse';
  if(!raw){ Toast.show('Paste a list first.','err'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=[];
  lines.forEach(line=>{
    const parts = line.split(/\t|,(?=[^,]*$)/).map(s=>s.trim());
    if(parts.length<2){ fail.push(line); return; }
    const name = parts[0]; const qty = Number(parts[1]);
    const it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!it || !qty){ fail.push(line); return; }
    Stock.stockIn(it.id, qty, todayISO(), 'Bulk import', loc);
    ok++;
  });
  Toast.show(`${ok} line(s) imported.${fail.length? ' '+fail.length+' skipped (name not found).':''}`, fail.length?'err':'ok');
  render();
};

const CSV_HEADERS = ['Name','Memory','Category','Colour','Condition','IMEI','Location','Cost','Sell','Qty'];
Views.exportCsvTemplate = function(){

Views.exportFullStockCsv = function(){
  const rows = [CSV_HEADERS];
  Store.data.items.forEach(it=>{
    (it.units||[]).forEach(u=>{
      rows.push([it.name, it.memory, catName(it.category), u.color, u.condition, u.imei, shopName(u.location), u.costPrice, u.sellPrice, 1]);
    });
    Store.data.shops.forEach(s=>{
      const bulk = untrackedQtyAt(it, s.id);
      if(bulk>0) rows.push([it.name, it.memory, catName(it.category), (it.colors||[]).join('/'), it.condition, '', s.name, it.costPrice, it.shopPrices[s.id], bulk]);
    });
  });
  csvDownload('stockline_current_stock.csv', rows);
  Toast.show('Full stock exported.','ok');
};
function parseCsv(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length);
  return lines.map(line=>{
    const cells=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===',' && !inQ){ cells.push(cur); cur=''; continue; }
      cur+=c;
    }
    cells.push(cur);
    return cells.map(c=>c.trim());
  });
}
Views.doCsvImport = function(){
  const fileInput = document.getElementById('si_csv_file');
  const file = fileInput && fileInput.files[0];
  if(!file){ Toast.show('Choose a CSV file first.','err'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const rows = parseCsv(e.target.result);
      const header = rows[0].map(h=>h.toLowerCase());
      const idx = name => header.indexOf(name.toLowerCase());
      const iName=idx('Name'), iMem=idx('Memory'), iCat=idx('Category'), iColor=idx('Colour'), iCond=idx('Condition'),
            iImei=idx('IMEI'), iLoc=idx('Location'), iCost=idx('Cost'), iSell=idx('Sell'), iQty=idx('Qty');
      if(iName<0){ Toast.show('CSV needs at least a Name column.','err'); return; }
      let added=0, skipped=0;
      rows.slice(1).forEach(r=>{
        const name=(r[iName]||'').trim(); if(!name) return;
        const memory=iMem>=0?(r[iMem]||'').trim():'';
        const catNameStr=iCat>=0?(r[iCat]||'').trim():'';
        const color=iColor>=0?(r[iColor]||'').trim():'';
        const condition=iCond>=0?(r[iCond]||'New').trim():'New';
        const imei=iImei>=0?(r[iImei]||'').trim():'';
        const locName=iLoc>=0?(r[iLoc]||'').trim():'Warehouse';
        const cost=iCost>=0?Number(r[iCost])||0:0;
        const sell=iSell>=0?Number(r[iSell])||0:0;
        const qty=iQty>=0?Number(r[iQty])||1:1;
        const shop = Store.data.shops.find(s=>s.name.toLowerCase()===locName.toLowerCase()) || Store.data.shops.find(s=>s.isWarehouse);
        let it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase() && (x.memory||'').toLowerCase()===memory.toLowerCase());
        if(!it){
          let cat = Store.data.categories.find(c=>c.name.toLowerCase()===catNameStr.toLowerCase());
          if(!cat) cat = Store.data.categories[0];
          it = { id:uid('item'), name, category:cat.id, memory, imei:'', condition, colors:[], batteryPct:null, costPrice:cost||0, shopPrices:{}, locations:{}, units:[], createdAt:todayISO() };
          Store.data.shops.forEach(s=>{ it.locations[s.id]=0; it.shopPrices[s.id]=sell||cost||0; });
          Store.data.items.push(it);
        }
        if(imei){
          if(findUnitByImei(imei)){ skipped++; return; }
          Stock.addUnit(it.id, shop.id, {imei, color, condition, costPrice:cost||it.costPrice, sellPrice:sell||it.shopPrices[shop.id]}, todayISO(), 'CSV import');
        } else if(qty>0){
          Stock.stockIn(it.id, qty, todayISO(), 'CSV import', shop.id);
        }
        added++;
      });
      Store.save();
      Toast.show(`Imported ${added} row(s).${skipped?(' '+skipped+' skipped (duplicate IMEI).'):''}`, 'ok');
      render();
    }catch(err){
      Toast.show('Could not read that CSV file.','err');
    }
  };
  reader.readAsText(file);
};

Views.doTransferOneImei = function(unitId){
  const to = val('tr_to');
  if(!to){ Toast.show('Select a destination store.','err'); return; }
  let imei = null;
  for(const it of Store.data.items){
    const u = (it.units||[]).find(x=>x.id===unitId);
    if(u){ imei = u.imei; break; }
  }
  if(!imei){ Toast.show('Device not found.','err'); return; }
  const result = Stock.transferUnitByImei(imei, to, todayISO(), 'Transferred by IMEI');
  if(result){ Toast.show(`${result.item.name} (IMEI ${imei}) → ${shopName(to)}`,'ok'); render(); }
};
Views.doTransferByImei = function(){
  const imei = val('tri_imei').trim();
  const to = val('tr_to');
  if(!imei){ Toast.show('Enter an IMEI.','err'); return; }
  if(!to){ Toast.show('Select a destination store.','err'); return; }
  const result = Stock.transferUnitByImei(imei, to, todayISO(), 'Transferred by IMEI');
  if(result){ Toast.show(`${result.item.name} moved to ${shopName(to)}.`,'ok'); render(); }
};

Views.doSetExisting = function(){
  const itemId = val('ex_item');
  const loc = val('ex_loc');
  const qty = Number(val('ex_qty'));
  if(isNaN(qty)||qty<0){ Toast.show('Enter a valid quantity.','err'); return; }
  Stock.adjust(itemId, loc, qty, 'Existing stock recorded');
  Toast.show('Quantity set.','ok');
  render();
};
Views.doBulkExisting = function(){
  const raw = val('exb_bulk').trim();
  const loc = val('exb_loc');
  if(!raw){ Toast.show('Paste a list first.','err'); return; }
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let ok=0, fail=[];
  lines.forEach(line=>{
    const parts = line.split(/\t|,(?=[^,]*$)/).map(s=>s.trim());
    if(parts.length<2){ fail.push(line); return; }
    const name = parts[0]; const qty = Number(parts[1]);
    const it = Store.data.items.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(!it || isNaN(qty)){ fail.push(line); return; }
    Stock.adjust(it.id, loc, qty, 'Existing stock — bulk stocktake');
    ok++;
  });
  Toast.show(`${ok} item(s) set.${fail.length? ' '+fail.length+' skipped (name not found — add the item first in Inventory).':''}`, fail.length?'err':'ok');
  render();
};

/* ---- WEEKLY REPORT (Monday-Sunday, matching paper sheet) ---- */
Views._weekStart = mostRecentMonday();
Views._weeklyExpandedDetails = Views._weeklyExpandedDetails || {};
Views.weekly = function(){
  const weekStart = Views._weekStart, weekEnd = isoAddDays(weekStart,6);
  const shops = activeShops();
  function calcFor(shopId, catId){
    const itemsInCat = Store.data.items.filter(it=>it.category===catId);
    const currQty = itemsInCat.reduce((sum, it) => sum + ((it.locations&&it.locations[shopId])||0), 0);

    let inQ = 0, outQ = 0, faultyQ = 0, depositQ = 0;
    itemsInCat.forEach(it=>{
      const moves = (Store.data.movements||[]).filter(m => m && m.itemId === it.id && m.location === shopId);
      const during = moves.filter(m => m.date >= weekStart && m.date <= weekEnd);
      during.forEach(m=>{
        if(m.type === 'stock-in' || m.type === 'transfer-in') inQ += Math.abs(m.qty);
        else if(m.type === 'sold' || m.type === 'transfer-out') outQ += Math.abs(m.qty);
        else if(m.type === 'faulty') faultyQ += Math.abs(m.qty);
        else if(m.type === 'deposit') depositQ += Math.abs(m.qty);
      });
    });

    let afterInQ = 0, afterOutQ = 0;
    itemsInCat.forEach(it=>{
      const moves = (Store.data.movements||[]).filter(m => m && m.itemId === it.id && m.location === shopId);
      const after = moves.filter(m => m.date > weekEnd);
      after.forEach(m=>{
        if(m.type === 'stock-in' || m.type === 'transfer-in') afterInQ += Math.abs(m.qty);
        else if(m.type === 'sold' || m.type === 'transfer-out' || m.type === 'faulty' || m.type === 'deposit') afterOutQ += Math.abs(m.qty);
      });
    });

    const remaining = Math.max(0, currQty + afterOutQ - afterInQ);
    const afterIn = remaining + outQ + faultyQ + depositQ;
    const start = Math.max(0, afterIn - inQ);

    return { start, inQ, afterIn, outQ, faultyQ, depositQ, remaining };
  }

  let html = `
    <div class="toolbar no-print" style="flex-wrap:wrap;gap:8px;">
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,-7);render()">← Prev week</button>
      <span style="font-weight:600;">${weekLabel(weekStart,weekEnd)}</span>
      <button class="btn sm" onclick="Views._weekStart=isoAddDays(Views._weekStart,7);render()">Next week →</button>
      <div class="spacer"></div>
      <div class="field" style="margin:0;min-width:180px;">
        <select onchange="Views._weeklyShop=this.value;render();">
          <option value="all">All Stores (Multi-Store Overview)</option>
          ${shops.map(s=>`<option value="${s.id}" ${Views._weeklyShop===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
      </div>
      <button class="btn" onclick="Views.printPage()">🖨 Export PDF</button>
      <button class="btn" onclick="Views.exportWeeklyCsv()">⬇ Export Excel (CSV)</button>
    </div>
    <div class="weekly-print-grid">
  `;

  const shopsToRender = (Views._weeklyShop && Views._weeklyShop !== 'all') ? shops.filter(s=>s.id===Views._weeklyShop) : shops;

  shopsToRender.forEach(s=>{
    let tS=0,tI=0,tAI=0,tO=0,tF=0,tD=0,tR=0;
    const wLabel = weekLabel(weekStart,weekEnd);
    const catRows = Store.data.categories.map(c=>{
      const r = calcFor(s.id,c.id);
      tS+=r.start;tI+=r.inQ;tAI+=r.afterIn;tO+=r.outQ;tF+=r.faultyQ;tD+=r.depositQ;tR+=r.remaining;
      return `<tr><td>${esc(wLabel)}</td><td><b>${esc(c.name)}</b></td><td>${r.start}</td><td>${r.inQ?'+'+r.inQ:0}</td><td>${r.afterIn}</td><td>${r.outQ?'-'+r.outQ:0}</td><td>${r.faultyQ||0}</td><td>${r.depositQ||0}</td><td><b>${r.remaining}</b></td></tr>`;
    }).join('');

    const inMoves = (Store.data.movements||[]).filter(m => m && (m.location===s.id || (m.type==='transfer-in' && m.location===s.id)) && (m.type==='stock-in'||m.type==='transfer-in') && m.date>=weekStart && m.date<=weekEnd);

Views.exportWeeklyCsv = function(){
  const weekStart = Views._weekStart, weekEnd = isoAddDays(weekStart,6);
  const wLabel = weekLabel(weekStart, weekEnd);
  const rows = [['Shop', 'Weeks', 'Category', 'Total Quantity in the Start', 'Stock In', 'Stock after stock in', 'Stock Out', 'Faulty', 'Deposit', 'Remaining Stock']];
  const shops = activeShops();
  shops.forEach(s=>{
    let tS=0, tI=0, tAI=0, tO=0, tF=0, tD=0, tR=0;
    const catRows = [];
    Store.data.categories.forEach(c=>{
      const itemsInCat = Store.data.items.filter(it=>it.category===c.id);
      const currQty = itemsInCat.reduce((sum, it) => sum + ((it.locations&&it.locations[s.id])||0), 0);
      let inQ = 0, outQ = 0, faultyQ = 0, depositQ = 0;
      itemsInCat.forEach(it=>{
        const moves = (Store.data.movements||[]).filter(m => m && m.itemId === it.id && m.location === s.id);
        const during = moves.filter(m => m.date >= weekStart && m.date <= weekEnd);
        during.forEach(m=>{
          if(m.type === 'stock-in' || m.type === 'transfer-in') inQ += Math.abs(m.qty);
          else if(m.type === 'sold' || m.type === 'transfer-out') outQ += Math.abs(m.qty);
          else if(m.type === 'faulty') faultyQ += Math.abs(m.qty);
          else if(m.type === 'deposit') depositQ += Math.abs(m.qty);
        });
      });
      let afterInQ = 0, afterOutQ = 0;
      itemsInCat.forEach(it=>{
        const moves = (Store.data.movements||[]).filter(m => m && m.itemId === it.id && m.location === s.id);
        const after = moves.filter(m => m.date > weekEnd);
        after.forEach(m=>{
          if(m.type === 'stock-in' || m.type === 'transfer-in') afterInQ += Math.abs(m.qty);
          else if(m.type === 'sold' || m.type === 'transfer-out' || m.type === 'faulty' || m.type === 'deposit') afterOutQ += Math.abs(m.qty);
        });
      });
      const remaining = Math.max(0, currQty + afterOutQ - afterInQ);
      const afterIn = remaining + outQ + faultyQ + depositQ;
      const start = Math.max(0, afterIn - inQ);
      tS+=start; tI+=inQ; tAI+=afterIn; tO+=outQ; tF+=faultyQ; tD+=depositQ; tR+=remaining;
      catRows.push([s.name, wLabel, c.name, start, inQ, afterIn, outQ, faultyQ, depositQ, remaining]);
    });
    rows.push([s.name, wLabel, `Total (${s.name})`, tS, tI, tAI, tO, tF, tD, tR]);
    catRows.forEach(cr => rows.push(cr));
  });
  csvDownload(`weekly_stock_report_${weekStart}.csv`, rows);
  Toast.show('Weekly report exported to Excel CSV.','ok');
};

Views.svSetCostPrice = function(itemId, v, shouldRender = true){

  if(shouldRender){ Toast.show('Cost price updated.','ok'); render(); }
};
Views.svSetPrice = function(itemId, shopId, v, shouldRender = true){
  const p = Number(v); if(isNaN(p)||p<0) return;

      if(svCatCounts[catId] == null){
        const found = Store.data.categories.find(c => c.id === catId || c.name.toLowerCase() === (catId||'').toLowerCase());

          <div class="pill" style="flex-shrink:0;background:${th.pillBg};color:${th.pillColor};font-weight:700;font-size:12px;border:1.5px solid ${th.pillBorder};padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;">

    <div class="toolbar no-print">
      <div class="chip-select">${locs.map(l=>`<button class="${locId===l.id?'active':''}" onclick="Views._svLoc='${l.id}';render()">${esc(l.name)}</button>`).join('')}</div>
      <div class="chip-select"><button class="${mode==='totals'?'active':''}" onclick="Views._svMode='totals';render()">Totals</button><button class="${mode==='imei'?'active':''}" onclick="Views._svMode='imei';render()">With IMEI</button></div>
      <div class="spacer"></div>
      <button class="btn" onclick="Views.printPage()">🖨 Export PDF</button>
      <button class="btn" onclick="Views.exportStockviewCsv()">⬇ Export CSV</button>

    ${groups.map(g=>`
      <div class="card" style="margin-bottom:18px;">
        <div class="table-section-title">${esc(g.cat.name)} (${g.items.reduce((a,it)=>a+(locId==='all'?totalQty(it):(it.locations[locId]||0)),0)} units)</div>
        <div class="table-wrap"><table>
          <thead><tr>
            ${mode==='totals' ? `<th>Device</th><th>Memory</th><th>Colours</th><th>Qty</th><th>Cost Price</th><th>Sale Price</th><th>Condition</th><th></th>` : `<th>Device</th><th>IMEI</th><th>Colour</th><th>Qty</th><th>Cost</th><th>Sale</th><th>Location</th><th class="no-print"></th>`}

Views.exportStockviewCsv = function(){
  const locId = Views._svLoc || 'warehouse';
  const mode = Views._svMode || 'totals';
  const isAll = locId === 'all';
  let items = Store.data.items.filter(it=> isAll ? totalQty(it)>0 : (it.locations[locId]||0)>0);

  let rows = [];
  if(mode === 'imei'){
    rows.push(['Device', 'IMEI', 'Category', 'Memory', 'Colour', 'Condition', 'Cost Price', 'Sale Price', 'Location', 'Verified']);
    items.forEach(it=>{
      const units = isAll ? (it.units||[]) : unitsAt(it, locId);
      units.forEach(u=>{
        const cost = u.costPrice != null ? u.costPrice : (it.costPrice || 0);
        const sale = u.sellPrice != null ? u.sellPrice : (it.shopPrices[u.location] || it.costPrice || 0);
        rows.push([it.name, u.imei||'—', catName(it.category), it.memory||'', u.color||'', u.condition||it.condition, cost, sale, shopName(u.location), u.verified ? 'Yes' : 'No']);
      });
    });
  } else {
    rows.push(['Device', 'Category', 'Memory', 'Colours', 'Condition', 'Cost Price', 'Sale Price', 'Qty In Stock', 'Location']);
    items.forEach(it=>{
      const qty = isAll ? totalQty(it) : (it.locations[locId]||0);
      const defaultShopId = activeShops()[0]?.id || 'warehouse';
      const sale = isAll ? ((it.shopPrices && it.shopPrices[defaultShopId])||it.costPrice||0) : ((it.shopPrices && it.shopPrices[locId])||it.costPrice||0);
      rows.push([it.name, catName(it.category), it.memory||'', (it.colors||[]).join(', '), it.condition, it.costPrice||0, sale, qty, isAll ? 'All locations' : shopName(locId)]);
    });
  }

  csvDownload(`stock_list_${locId}_${mode}_${todayISO()}.csv`, rows);
  Toast.show('Stock list exported to CSV.','ok');
};

/* ---- BEST SELLERS ---- */
Views._bsRange = 30;
Views.bestsellers = function(){
  const range = Views._bsRange;
  const since = isoAddDays(todayISO(), -range);
  const sold = {};
  Store.data.movements.filter(m=>m.type==='sold' && m.date>=since).forEach(m=>{
    sold[m.itemId] = (sold[m.itemId]||0) + m.qty;
  });
  const rows = Object.entries(sold).map(([id,q])=>({item:itemById(id),q})).filter(r=>r.item).sort((a,b)=>b.q-a.q);
  const max = Math.max(1,...rows.map(r=>r.q));

  return `
    <div class="toolbar">
      <div class="chip-select">
        ${[7,30,90].map(d=>`<button class="${range===d?'active':''}" onclick="Views._bsRange=${d};render()">Last ${d} days</button>`).join('')}
      </div>
    </div>
    <div class="card card-pad">
      <h3 style="margin-top:0;">Top sellers</h3>
      ${rows.length? rows.slice(0,20).map(r=>`
        <div class="bar-row">
          <div class="label">${esc(r.item.name)}</div>
          <div class="track"><div class="fill" style="width:${(r.q/max*100).toFixed(0)}%"></div></div>
          <div class="val">${r.q}</div>
        </div>`).join('') : '<div class="empty">No sales recorded in this period yet — mark items sold from <b>Shop Sales</b>.</div>'}
    </div>
    <div class="card" style="margin-top:16px;">
      <div class="table-wrap"><table>
        <thead><tr><th>Item</th><th>Category</th><th>Sold (period)</th><th>Currently in stock</th><th></th></tr></thead>
        <tbody>
        ${rows.map(r=>`<tr>
          <td>${esc(r.item.name)}</td><td><span class="pill teal">${esc(catName(r.item.category))}</span></td>
          <td><b>${r.q}</b></td><td>${signalHtml(totalQty(r.item))} ${totalQty(r.item)}</td>
          <td><button class="btn sm" onclick="Views.addToReorder('${r.item.id}')">+ Add to reorder list</button></td>
        </tr>`).join('') || `<tr><td colspan="5"><div class="empty">Nothing to show yet.</div></td></tr>`}

      </table></div>

Views.addToReorder = function(itemId){

/* ---- REORDER LIST ---- */
Views._reorderPeriod = 'since_last';
function reorderPeriodStart(){
  const p = Views._reorderPeriod;
  if(p==='since_last') return Store.data.reorderMeta.lastOrderDate || '2000-01-01';
  return isoAddDays(todayISO(), -Number(p));
}
function soldInPeriod(item, sinceDate){
  return Store.data.movements.filter(m=>m.itemId===item.id && m.type==='sold' && m.date>=sinceDate).reduce((a,m)=>a+m.qty,0);
}
Views.reorder = function(){
  const rows = Store.data.reorderList.map(r=>({...r, item:itemById(r.itemId)})).filter(r=>r.item);
  const since = reorderPeriodStart();
  const lastOrder = Store.data.reorderMeta.lastOrderDate;
  const periodLabel = {since_last:'Since last order', '7':'Last 7 days', '30':'Last 30 days', '90':'Last 90 days'}[Views._reorderPeriod];
  return `
    <div class="toolbar">
      <div class="chip-select">
        <button class="${Views._reorderPeriod==='since_last'?'active':''}" onclick="Views._reorderPeriod='since_last';render()">Since last order${lastOrder?` (${lastOrder})`:''}</button>
        <button class="${Views._reorderPeriod==='7'?'active':''}" onclick="Views._reorderPeriod='7';render()">7 days</button>
        <button class="${Views._reorderPeriod==='30'?'active':''}" onclick="Views._reorderPeriod='30';render()">30 days</button>
        <button class="${Views._reorderPeriod==='90'?'active':''}" onclick="Views._reorderPeriod='90';render()">90 days</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" onclick="Views.markOrdered()">✓ Mark list as ordered</button>
      <button class="btn" onclick="Views.exportReorderCsv()">⬇ Export order for supplier (CSV)</button>
      <button class="btn" onclick="Views.printPage()">🖨 Export PDF</button>
      <button class="btn primary" onclick="Views.addAnyToReorder()">+ Add item</button>
    </div>
    <div class="helpbox no-print">Sold quantity is counted "${esc(periodLabel)}" — switch the range above to see how demand looks over a different window. "Mark list as ordered" resets the "since last order" clock to today.</div>
    <div class="card">
      <div class="table-wrap"><table>
        <thead><tr><th>Item</th><th>Category</th><th>Currently in stock</th><th>Sold (${esc(periodLabel)})</th><th>Qty to order</th><th></th></tr></thead>
        <tbody>
          ${rows.length? rows.map(r=>`<tr>
            <td>${esc(r.item.name)}</td><td><span class="pill teal">${esc(catName(r.item.category))}</span></td>
            <td>${totalQty(r.item)}</td>
            <td><b>${soldInPeriod(r.item, since)}</b></td>
            <td><input type="number" min="1" value="${r.qty}" style="width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;" onchange="Views.setReorderQty('${r.itemId}',this.value)"></td>
            <td><button class="btn sm danger" onclick="Views.removeReorder('${r.itemId}')">Remove</button></td>
          </tr>`).join('') : `<tr><td colspan="6"><div class="empty"><div class="big">Reorder list is empty</div>Add items from Best Sellers or click "+ Add item".</div></td></tr>`}
        </tbody>
      </table></div>

        `}

          <input id="ro_qty" type="number" min="1" value="5">

      </div>

Views.updateReorderSoldHint = function(){
  const it = itemById(val('ro_item'));
  const el = document.getElementById('ro_sold_hint');
  if(!it || !el) return;
  const since = reorderPeriodStart();
  el.textContent = `Currently in stock: ${totalQty(it)} · Sold in selected period: ${soldInPeriod(it, since)}`;
};
Views.confirmAddReorder = function(){
  const isNew = (Views._reorderModalMode === 'new');
  const qty = Number(val('ro_qty')) || 1;

  if(isNew){
    const name = val('ro_new_name').trim();
    if(!name){ Toast.show('Please enter a device model name.', 'err'); return; }
    const cat = val('ro_new_cat');
    let mem = val('ro_new_mem').trim();
    if(mem){
      mem = mem.replace(/\s+/g, '').replace(/gb/gi, 'GB');
      if(/^\d+$/.test(mem)) mem = mem + 'GB';
    }

    const canonKey = (name + '|' + cat + '|' + mem).toLowerCase();
    let it = Store.data.items.find(x => ((x.name + '|' + x.category + '|' + (x.memory||'')).toLowerCase() === canonKey));
    if(!it){
      it = {
        id: uid('item'), name, category: cat, memory: mem, condition: 'Used', batteryPct: null, imei: '', colors: [],
        costPrice: 0, wholesalePrice: 0, shopPrices: {}, locations: {}, units: [], createdAt: todayISO()
      };
      Store.data.shops.forEach(s => { it.locations[s.id] = 0; it.shopPrices[s.id] = 0; });
      Store.data.items.push(it);
    }
    const existing = Store.data.reorderList.find(r => r.itemId === it.id);
    if(existing) existing.qty = qty; else Store.data.reorderList.push({ itemId: it.id, qty });
  } else {
    const itemId = val('ro_item');
    if(!itemId) return;
    const existing = Store.data.reorderList.find(r => r.itemId === itemId);
    if(existing) existing.qty = qty; else Store.data.reorderList.push({ itemId, qty });
  }

  Store.save(); Modal.close(); Toast.show('Added to reorder list.', 'ok'); render();
};
Views.exportReorderCsv = function(){
  const since = reorderPeriodStart();
  const rows = [['Item','Category','Memory','Currently in stock','Sold in period','Qty to order','Cost price']];
  Store.data.reorderList.forEach(r=>{
    const it = itemById(r.itemId); if(!it) return;
    rows.push([it.name, catName(it.category), it.memory, totalQty(it), soldInPeriod(it, since), r.qty, it.costPrice]);
  });
  csvDownload('supplier_reorder_list.csv', rows);
  Toast.show('Reorder list exported — ready to send to your supplier.','ok');
};

    title:'Remove this category?',
    body:`<p>Do you really want to remove <b>${esc(c.name)}</b>?${inUse?` It is currently used by <b>${inUse}</b> item(s).`:''}</p>
          <p>A full backup is saved automatically before removing, and the category itself is kept in <b>Removed categories</b> so you can restore it any time — nothing is permanently deleted.</p>`,
    danger:true, confirmText:'Yes, remove it',
    onConfirm:()=>{
      Store.snapshotToBackups('Before removing category: '+c.name);
      Store.data.categories = Store.data.categories.filter(x=>x.id!==catId);
      Store.data.archivedCategories.push({...c, removedAt: todayISO()});
      Store.save();
      Toast.show('Category removed — restore it any time from this page.','ok');
      render();
    }
  });
};
Views.restoreCategory = function(catId){
  const idx = Store.data.archivedCategories.findIndex(x=>x.id===catId);
  if(idx<0) return;
  const [c] = Store.data.archivedCategories.splice(idx,1);
  delete c.removedAt;
  Store.data.categories.push(c);
  Store.save(); Toast.show('Category restored.','ok'); render();
};

/* ---- BACKUP & SETTINGS ---- */

Views.saveGitHubConfigAndTest = async function(){
  const token = val('gh_token_input').trim();
  const owner = val('gh_owner_input').trim() || 'idigitalfun-ui';
  const repo = val('gh_repo_input').trim() || 'phone-count';
  const branch = val('gh_branch_input').trim() || 'main';
  const path = val('gh_path_input').trim() || 'phone_count_data.json';
  const intervalMinutes = Number(val('gh_interval_select')) || 3;

  GitHubStore.saveConfig({ token, owner, repo, branch, path, intervalMinutes, autoSync: true });
  const resEl = document.getElementById('gh_test_result');
  if(resEl) resEl.innerHTML = '<span style="color:var(--muted);">Testing connection…</span>';

  const result = await GitHubStore.testConnection();
  if(result.ok){
    if(resEl) resEl.innerHTML = `<span style="color:var(--green);font-weight:600;">✓ ${esc(result.message)}</span>`;
    Toast.show('GitHub connected successfully! Auto-save is active.', 'ok');
    GitHubStore.saveRemote(false);
  } else {
    if(resEl) resEl.innerHTML = `<span style="color:var(--red);font-weight:600;">✕ ${esc(result.error)}</span>`;
    Toast.show('Connection failed: ' + result.error, 'err');
  }
  render();
};
Views.fetchShopCsvs = function(){
  CsvImport.tryFetchAll().then(n=>{
    if(n>0){
      Store.data.meta.imeiImportedV2=true;
      Store.save();
      Toast.show(`Loaded ${n} device(s) with IMEI from CSV files.`,'ok');
      render();
    } else {
      Toast.show('Could not auto-load CSVs — use "Choose CSV files" and select all shop count spreadsheets.','err');
    }
  });
};
Views.importShopCsvs = function(input){
  const files = input.files;
  if(!files||!files.length){ Toast.show('Select at least one CSV file.','err'); return; }
  CsvImport.importFiles(files).then(n=>{
    Toast.show(n>0?`Imported ${n} device(s) with IMEI.`:'No new devices imported (may already exist).', n>0?'ok':'err');
    render();
  });
};
Views.downloadFullBackup = function(){
  const blob = new Blob([JSON.stringify(Store.data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `stockline_backup_${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  Toast.show('Backup downloaded.','ok');
};
Views.restoreFromFile = function(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      Modal.confirm({
        title:'Restore from this file?',
        body:'<p>This will replace all current data with the contents of the uploaded backup. Your current data will be snapshotted first, just in case.</p>',
        danger:true, confirmText:'Restore',
        onConfirm:()=>{
          Store.snapshotToBackups('Before restoring from uploaded file');
          Store.data = data; Store.save(); Toast.show('Data restored.','ok'); render();
        }
      });
    }catch(err){ Toast.show('That file could not be read as a backup.','err'); }
  };
  reader.readAsText(file);
};
Views.restoreSnapshot = function(id){
  Modal.confirm({
    title:'Restore this snapshot?',
    body:'<p>Your current data will replace with this earlier snapshot. This action itself is also backed up first.</p>',
    danger:true, confirmText:'Restore',
    onConfirm:()=>{
      Store.snapshotToBackups('Before restoring snapshot');
      Store.restoreBackup(id);
      Toast.show('Restored.','ok'); render();
    }
  });
};
Views.addShop = function(){
  const name = val('newshop').trim();
  if(!name){ Toast.show('Enter a shop name.','err'); return; }
  const id = uid('shop');
  Store.data.shops.push({id,name,isWarehouse:false,active:true});
  Store.data.items.forEach(it=>{ it.locations[id]=0; it.shopPrices[id]=it.shopPrices.warehouse||0; });
  Store.save(); Toast.show('Shop added.','ok'); render();
};

Store.load();
render();
FileStore.init(); // restore file handle from IndexedDB and sync data if file is newer
GitHubStore.startAutoSyncTimer(); // start silent background GitHub cloud sync timer
</script>
